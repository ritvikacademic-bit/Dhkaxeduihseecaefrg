<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>CLAT UG Performance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230071e3'/%3E%3Cpath d='M14 44l12-12 9 8 15-18' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>(function(){try{var p=JSON.parse(localStorage.getItem('clat_dash_v14_prefs')||'{}');if(p.theme==='light'||p.theme==='dark')document.documentElement.setAttribute('data-theme',p.theme);}catch(e){}})();</script>
<style>
/* ─────────────────────────── Tokens ─────────────────────────── */
:root{
  color-scheme:light;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;

  --bg:#f5f5f7;
  --surface:#ffffff;
  --surface-2:#f7f7f9;
  --fill:rgba(120,120,128,.12);
  --fill-2:rgba(120,120,128,.20);
  --ink:#1d1d1f;
  --ink-2:#515154;
  --ink-3:#6e6e73;
  --hairline:rgba(0,0,0,.09);
  --grid:#e9e9ee;
  --axis:#c7c7cc;
  --accent:#0066cc;
  --accent-fill:#0071e3;
  --on-accent:#ffffff;
  --focus-ring:rgba(0,113,227,.45);
  --material:rgba(245,245,247,.76);
  --material-edge:rgba(0,0,0,.08);
  --tip-bg:rgba(255,255,255,.94);
  --card-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.035);
  --card-border:rgba(0,0,0,0);

  /* data — cohort identity (validated pair: blue/orange; gray = context) */
  --c-pyq:#2a78d6;
  --c-mock:#eb6834;
  --c-other:#898781;
  --net:#48484a;
  --on-net:#ffffff;

  /* status — reserved meaning, always paired with a glyph or label */
  --good:#0ca30c;
  --good-ink:#0a7d0a;
  --bad:#d03b3b;
  --bad-ink:#c0292b;
  --warn:#fab219;
  --warn-ink:#935f00;

  /* ordinal ramp — one line per timed PYQ, oldest → newest (validated) */
  --ord-1:#86b6ef;
  --ord-2:#3987e5;
  --ord-3:#184f95;

  /* in-table bars: one hue for "higher is better", a neutral for costs */
  --bar:#3987e5;
  --bar-2:#1baf7a;
  --bench-1:#1baf7a;
  --bench-2:#898781;
  --bar-cost:#a1a1a6;
  --target:#1d1d1f;

  --r-card:18px;
  --r-inner:12px;
  --spring:cubic-bezier(.32,.72,0,1);
  --ease:cubic-bezier(.25,.1,.25,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000;--surface:#1c1c1e;--surface-2:#242426;--fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);
    --ink:#f5f5f7;--ink-2:#aeaeb2;--ink-3:#98989d;--hairline:rgba(255,255,255,.11);--grid:#2c2c2e;--axis:#48484a;
    --accent:#2997ff;--accent-fill:#0a84ff;--focus-ring:rgba(41,151,255,.55);
    --material:rgba(22,22,23,.74);--material-edge:rgba(255,255,255,.1);--tip-bg:rgba(44,44,46,.94);
    --card-shadow:none;--card-border:rgba(255,255,255,.06);
    --c-pyq:#3987e5;--c-mock:#d95926;--c-other:#8e8e93;--net:#d1d1d6;--on-net:#1c1c1e;
    --good-ink:#34c759;--bad-ink:#ff6b6b;--warn-ink:#ffcc4d;
    --bar:#3987e5;--bar-2:#199e70;--bench-1:#199e70;--bench-2:#8e8e93;--bar-cost:#7c7c80;--target:#f5f5f7;
    --ord-1:#184f95;--ord-2:#3987e5;--ord-3:#9ec5f4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000;--surface:#1c1c1e;--surface-2:#242426;--fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.36);
  --ink:#f5f5f7;--ink-2:#aeaeb2;--ink-3:#98989d;--hairline:rgba(255,255,255,.11);--grid:#2c2c2e;--axis:#48484a;
  --accent:#2997ff;--accent-fill:#0a84ff;--focus-ring:rgba(41,151,255,.55);
  --material:rgba(22,22,23,.74);--material-edge:rgba(255,255,255,.1);--tip-bg:rgba(44,44,46,.94);
  --card-shadow:none;--card-border:rgba(255,255,255,.06);
  --c-pyq:#3987e5;--c-mock:#d95926;--c-other:#8e8e93;--net:#d1d1d6;--on-net:#1c1c1e;
  --good-ink:#34c759;--bad-ink:#ff6b6b;--warn-ink:#ffcc4d;
  --bar:#3987e5;--bar-2:#199e70;--bench-1:#199e70;--bench-2:#8e8e93;--bar-cost:#7c7c80;--target:#f5f5f7;
  --ord-1:#184f95;--ord-2:#3987e5;--ord-3:#9ec5f4;
}

/* ─────────────────────────── Base ─────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.47 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
svg text{font-family:var(--font)}
/* Labels that can sit on a line keep a thin outline in the card colour, so the line never strikes through them. */
svg text.halo{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}

/* ─────────────────────────── App bar (material) ─────────────────────────── */
.appbar{position:sticky;top:0;z-index:60;background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 transparent;transition:box-shadow .25s var(--ease)}
.appbar.scrolled{box-shadow:0 1px 0 var(--material-edge)}
.appbar .wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-.022em;white-space:nowrap}
.brand span{font-size:12px;color:var(--ink-3);letter-spacing:0;white-space:nowrap}
.actions{display:flex;align-items:center;gap:8px;justify-self:end}

/* segmented control */
.seg{position:relative;display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:0;isolation:isolate;max-width:100%}
.seg button{position:relative;z-index:1;border:0;background:transparent;border-radius:8px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;transition:color .2s var(--ease)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{font-weight:600}
.seg .thumb{position:absolute;z-index:0;top:2px;bottom:2px;left:0;width:0;border-radius:8px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform .45s var(--spring),width .45s var(--spring)}
:root[data-theme="dark"] .seg .thumb{background:#636366}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg .thumb{background:#636366}}
.tabs-scroll{overflow-x:auto;scrollbar-width:none;justify-self:center;max-width:100%;padding:2px}
.tabs-scroll::-webkit-scrollbar{display:none}
.seg.small button{padding:4px 11px;font-size:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 14px;border-radius:980px;border:0;background:var(--fill);color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap;transition:transform .12s var(--ease),background-color .15s var(--ease),filter .15s}
.btn:hover{background:var(--fill-2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-fill);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{width:32px;padding:0}
.btn.plain{background:transparent;color:var(--accent);padding:0 6px}
.btn.plain:hover{background:var(--fill)}
.btn.danger{color:var(--bad-ink)}
.btn svg{width:16px;height:16px}

/* switch (Guiding light) */
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;user-select:none;white-space:nowrap}
.switch input{appearance:none;-webkit-appearance:none;margin:0;width:40px;height:24px;border-radius:12px;background:var(--fill-2);position:relative;cursor:pointer;transition:background-color .25s var(--ease);flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.04);transition:transform .4s var(--spring)}
.switch input:checked{background:var(--good)}
.switch input:checked::after{transform:translateX(16px)}
.guide-group{display:inline-flex;align-items:center;gap:2px}
.btn.small{min-height:28px;padding:0 8px;font-size:13px}
dialog.sheet.narrow{width:min(620px,calc(100vw - 32px))}
.tgt-preview{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--surface-2)}
.tgt-preview .minihead{margin:0}
.tp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 20px}
.tp-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--hairline);padding-bottom:6px}
.tp-row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.err{margin:0;color:var(--bad-ink);font-size:13px}
.switch.wiz input:checked{background:var(--accent-fill)}
/* Benchmark Wiz: coaching beside a chart when the card is wide, above it when narrow */
.card{container-type:inline-size}
.coach-wrap{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.coach-wrap > .coach{order:-1}
@container (min-width:760px){.coach-wrap{grid-template-columns:minmax(0,1fr) 262px;align-items:start;gap:20px}.coach-wrap > .coach{order:0;position:sticky;top:132px}}
.card-main{min-width:0;display:grid;gap:0;align-content:start}
.coach{display:grid;gap:10px;padding:12px 14px;border-radius:14px;background:color-mix(in oklab,var(--accent-fill) 7%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--accent-fill) 20%,transparent);font-size:13px;line-height:1.45;color:var(--ink-2);text-wrap:pretty}
.coach-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.01em}
.coach .ck{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.coach b{color:var(--ink);font-weight:600}
.card.wiz{box-shadow:var(--card-shadow),inset 0 0 0 1px color-mix(in oklab,var(--accent-fill) 22%,transparent)}
.wiz-top{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@container (min-width:760px){.wiz-top{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.wiz-stand,.wiz-week{padding:14px 16px;border-radius:14px;background:var(--surface-2)}
.wiz-stand p{margin:6px 0 10px;font-size:13px;color:var(--ink-2);text-wrap:pretty}
.wiz-big{font-family:var(--font-display);font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-top:6px}
.wiz-big small{font-size:16px;font-weight:500;color:var(--ink-3);letter-spacing:0}
.wiz-gaps{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px;color:var(--ink-2)}
.wiz-gaps li{display:grid;grid-template-columns:12px 1fr;gap:8px;align-items:start}
.wiz-gaps .sw{width:12px;height:12px;border-radius:3px;margin-top:3px;opacity:.75}
.wiz-gaps b{color:var(--ink)}
.tp-grid.one{grid-template-columns:1fr;margin-top:8px}
.wiz-flag{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:color-mix(in oklab,var(--warn) 18%,transparent);color:var(--ink);font-size:12.5px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.wiz-levers{display:grid;gap:6px;margin-top:18px}
.wiz-levers .lv{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:10px;font-size:13px}
.wiz-levers .lv .bc{--bw:minmax(120px,340px);grid-template-columns:minmax(120px,340px) auto}
.wiz-levers .lv-n{font-weight:500;color:var(--ink)}
.tbl tr.now td{background:color-mix(in oklab,var(--accent-fill) 6%,var(--surface))}

/* ─────────────────────────── Views ─────────────────────────── */
main{min-height:60vh}
.view{display:grid;gap:20px;padding-block:28px 80px}
.view.enter{animation:view-in .32s var(--ease) both}
@keyframes view-in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding-top:4px}
.view-head h1{font-family:var(--font-display);font-size:clamp(28px,3.6vw,36px);line-height:1.08;letter-spacing:-.028em;font-weight:700;margin:0 0 6px;text-wrap:balance}
.view-head p{margin:0;color:var(--ink-2);max-width:72ch;text-wrap:pretty}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.filters .lbl{font-size:12px;font-weight:500;color:var(--ink-3)}
.filter-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--card-shadow);border:1px solid var(--card-border);padding:clamp(16px,2.2vw,24px);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 16px;flex-wrap:wrap;margin-bottom:16px}
.card-head h2{font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.card-head p{margin:4px 0 0;font-size:13px;line-height:1.45;color:var(--ink-2);max-width:72ch;text-wrap:pretty}
.card-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--hairline);font-size:12px;line-height:1.5;color:var(--ink-3);text-wrap:pretty}
.grid-2{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,470px),1fr));align-items:start}
.grid-3{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:start}
.chart{position:relative;width:100%;min-height:40px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart:focus-visible{outline-offset:4px;border-radius:8px}
.empty{padding:28px 12px;text-align:center;color:var(--ink-3);font-size:13px}

/* legend + cohort glyphs */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
.legend .k{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none}
.legend .ln{width:16px;height:0;border-top:2px dashed var(--target);flex:none;opacity:.7}
.glyph{display:inline-block;vertical-align:-1px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:980px;background:var(--fill);font-size:11px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tag.warn{background:color-mix(in oklab,var(--warn) 22%,transparent);color:var(--warn-ink)}
.tag.good{background:color-mix(in oklab,var(--good) 16%,transparent);color:var(--good-ink)}
.tag.bad{background:color-mix(in oklab,var(--bad) 14%,transparent);color:var(--bad-ink)}

/* toggle chips (cohort filter) */
.tchip{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 12px 0 10px;border-radius:980px;border:1px solid var(--hairline);background:var(--surface);font-size:12px;font-weight:500;color:var(--ink-2);transition:transform .12s var(--ease),background-color .15s,opacity .15s}
.tchip:active{transform:scale(.97)}
.tchip[aria-pressed="true"]{background:var(--fill);color:var(--ink);border-color:transparent}
.tchip[aria-pressed="false"]{opacity:.55}
.tchip[aria-pressed="false"] .glyph{filter:grayscale(1)}

/* ─────────────────────────── Overview ─────────────────────────── */
.latest{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.latest{grid-template-columns:minmax(260px,.8fr) minmax(0,1.6fr)}}
.eyebrow{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.01em}
.hero-title{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.022em;margin:4px 0 2px;line-height:1.2}
.hero-v{font-family:var(--font-display);font-size:clamp(52px,6.4vw,68px);font-weight:700;letter-spacing:-.045em;line-height:1;margin:16px 0 6px}
.hero-s{font-size:15px;color:var(--ink-2)}
.hero-s b{color:var(--ink);font-weight:600}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--surface-2);border-radius:var(--r-inner);padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;font-weight:500;color:var(--ink-2)}
.kpi .v{font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:-.028em;line-height:1.15;margin-top:4px}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi .g{font-size:12px;margin-top:6px;color:var(--ink-2)}
.kpi .spark-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:8px}
.kpi .spark-row small{font-size:11px;color:var(--ink-3);line-height:1.3}
.spark{display:block;flex:none;overflow:visible}
.hero-spark{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:12px;color:var(--ink-3)}
.legend .lk{width:18px;height:0;border-top:2.5px solid currentColor;flex:none;border-radius:2px}
.chart-block{display:grid;gap:10px;min-width:0}
.chart-block h3{margin:0;font-size:13px;font-weight:600}
.cmp{margin-top:16px}
.cmp table{width:100%}
.delta{font-weight:600;white-space:nowrap}
.delta.up{color:var(--good-ink)}
.delta.down{color:var(--bad-ink)}
.delta.flat{color:var(--ink-3)}

.insights{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.insights li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.5;color:var(--ink-2);text-wrap:pretty}
.insights li b{color:var(--ink);font-weight:600}
.insights .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--fill);color:var(--ink-2);font-size:12px;font-weight:700}
.insights .ic.bad{background:color-mix(in oklab,var(--bad) 14%,transparent);color:var(--bad-ink)}
.insights .ic.good{background:color-mix(in oklab,var(--good) 16%,transparent);color:var(--good-ink)}
.insights .ic.warn{background:color-mix(in oklab,var(--warn) 24%,transparent);color:var(--warn-ink)}

/* ─────────────────────────── Tables ─────────────────────────── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-6px;padding-inline:6px}
.table-wrap.scroll-y{max-height:520px;overflow-y:auto}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-size:12px;font-weight:500;color:var(--ink-3);text-align:right;padding:8px 10px;border-bottom:1px solid var(--hairline);white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:2;vertical-align:bottom}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--hairline);text-align:right;white-space:nowrap;vertical-align:middle}
.tbl th.l,.tbl td.l{text-align:left}
.tbl th.c,.tbl td.c{text-align:center}
.tbl .stick{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:-6px 0 0 var(--surface)}
.tbl tr.group td .gl{position:sticky;left:0}
.tbl th.stick{z-index:3}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tr.group td{background:transparent!important;font-size:11px;font-weight:600;color:var(--ink-3);padding-top:14px;letter-spacing:.02em;border-bottom:1px solid var(--hairline)}
.tbl tr.earlier td{color:var(--ink-2)}
.tbl th button.sort{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 4px;margin:-2px -4px}
.tbl th button.sort:focus-visible{outline:3px solid var(--focus-ring)}
.tbl th button.sort[data-dir]::after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent}
.tbl th button.sort[data-dir="1"]::after{border-bottom:5px solid currentColor}
.tbl th button.sort[data-dir="-1"]::after{border-top:5px solid currentColor}
.tbl .att{display:flex;align-items:center;gap:8px;min-width:150px}
.tbl .att b{font-weight:600;color:var(--ink)}
.tbl .att small{display:block;font-size:11px;color:var(--ink-3);line-height:1.3}
.tbl .colgroup{color:var(--ink-2);font-weight:600;text-align:center;border-bottom:0;padding-bottom:0}
.cwv{display:inline-flex;gap:8px}
.cwv .c{color:var(--good-ink)} .cwv .w{color:var(--bad-ink)} .cwv .s{color:var(--ink-3)}

/* in-cell bars: zero-based, one scale per column, number beside the bar */
.bc{display:inline-grid;grid-template-columns:var(--bw,76px) minmax(3.1em,auto);align-items:center;column-gap:8px;row-gap:1px;vertical-align:middle}
.bc.compact{--bw:46px}
.bc .track{position:relative;display:block;height:8px;border-radius:4px;background:var(--fill)}
.bc .track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--bar);min-width:2px}
.bc .track i.cost{background:var(--bar-cost)}
.bc .track .tk{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--target)}
.bc .track .tb{position:absolute;top:-3px;bottom:-3px;border-radius:2px;background:color-mix(in oklab,var(--target) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--target) 50%,transparent)}
.bc .v{font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink);text-align:right;white-space:nowrap}
.bc small{grid-column:2;font-size:10.5px;color:var(--ink-3);line-height:1.2;text-align:right;white-space:nowrap}
.bc.na .track{background:transparent;box-shadow:inset 0 0 0 1px var(--fill)}
.bc.na .v{color:var(--ink-3);font-weight:400}
.bc .flag{font-size:10px}
.tbl tr.earlier .bc .track i{opacity:.55}
.rwb{display:inline-grid;grid-template-columns:84px auto;align-items:center;column-gap:8px;vertical-align:middle}
.rwb .track{display:flex;gap:1px;height:8px;border-radius:4px;overflow:hidden;background:var(--fill)}
.rwb .track i{display:block;height:100%}
.rwb .track .c{background:color-mix(in oklab,var(--good) 62%,var(--surface))}
.rwb .track .w{background:var(--bad)}
.rwb .track .s{background:color-mix(in oklab,var(--warn) 70%,var(--surface))}

/* ─────────────────────────── Question map ─────────────────────────── */
.qmap{display:grid;gap:22px 28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.qsec{container-type:inline-size;min-width:0}
.qsec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.qsec-h b{font-size:13px;font-weight:600}
.qsec-h span{font-size:12px;color:var(--ink-3)}
.qrow{display:grid;grid-template-columns:40px minmax(0,1fr) 64px;align-items:center;gap:8px;margin-top:5px}
.qrow .lab{font-size:12px;font-weight:500;color:var(--ink-2)}
.qrow .rng{font-size:11px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.qcells{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px}
.qc{position:relative;aspect-ratio:1;border-radius:3px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;line-height:1;background:var(--fill)}
.qc.c{background:color-mix(in oklab,var(--good) 58%,var(--surface))}
.qc.w{background:var(--bad)}
.qc.w::before{content:"\00d7";font-size:12px}
.qc.s{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn)}
.qc.x{background:repeating-linear-gradient(135deg,var(--fill-2) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--fill-2)}
.qc.t::after{content:"";position:absolute;top:-2px;right:-2px;width:6px;height:6px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px var(--surface)}
.qc.hit{outline:2px solid var(--ink);outline-offset:1px;z-index:2}
.qc.pad{background:transparent}
.qc.link{cursor:pointer}

/* one attempt, in depth */
.avhead{gap:10px}
.avpick{min-height:32px;max-width:min(420px,70vw);padding:0 10px;border-radius:9px;border:1px solid var(--hairline);background:var(--surface);color:var(--ink);font:inherit;font-size:13px}
.avtabs{justify-self:start;max-width:100%}
.avlines{margin:0;padding-left:18px;display:grid;gap:7px;font-size:14px;color:var(--ink-2);line-height:1.5}
.avlines li.good{color:var(--good-ink)}
.avlines li.bad{color:var(--bad-ink)}
.avnotes{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px;color:var(--ink-2);line-height:1.5}
.avdl{margin:0;display:grid;gap:0}
.avdl>div{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--hairline);font-size:13px}
.avdl>div:last-child{border-bottom:0}
.avdl dt{color:var(--ink-2);margin:0}
.avdl dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.avout{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.avout::before{content:"";width:9px;height:9px;border-radius:2px;flex:none;background:var(--fill-2)}
.avout.c::before{background:color-mix(in oklab,var(--good) 58%,var(--surface))}
.avout.w::before{background:var(--bad)}
.avout.s::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--warn)}
.avchip{display:inline-block;padding:1px 7px;border-radius:980px;background:var(--fill);font-size:11px;color:var(--ink-2);white-space:nowrap}
.avsig{display:inline-flex;flex-wrap:wrap;gap:4px;max-width:260px}
.avhist b{font-weight:700}
.avhist s{color:var(--ink-3)}
.avqwrap{max-height:70vh}
.avqtbl tr.avhf td{background:color-mix(in oklab,var(--warn) 9%,var(--surface))}
.avqtbl tr.avhf:hover td{background:color-mix(in oklab,var(--warn) 14%,var(--surface))}
.avfilters{gap:8px;margin-bottom:14px}
.avquads{gap:12px}
.avquad{background:var(--surface-2);border-radius:var(--r-inner);padding:12px 14px;font-size:13px}
.avquad b{display:block;margin-bottom:8px}
.avqs{display:flex;flex-wrap:wrap;gap:4px}
.avq{display:inline-block;min-width:26px;padding:2px 6px;border-radius:6px;text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums;background:var(--fill)}
.avq.c{background:color-mix(in oklab,var(--good) 22%,var(--surface))}
.avq.w{background:color-mix(in oklab,var(--bad) 20%,var(--surface))}
.avsinks{margin:0;padding-left:20px;display:grid;gap:7px;font-size:13px}
.avsinks li{padding-left:2px}
.avsinks li span{color:var(--ink-2)}
.avsinks li b{float:right;font-variant-numeric:tabular-nums}
.avseq{max-height:420px;overflow:auto;padding-right:4px}
.avseqsec{margin:14px 0 6px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);text-transform:uppercase}
.avseqline{margin:0;display:flex;flex-wrap:wrap;gap:4px}
.avstep{display:inline-flex;align-items:baseline;gap:5px;padding:2px 8px;border-radius:980px;background:var(--fill);font-size:12px;white-space:nowrap}
.avstep small{color:var(--ink-3);font-size:10.5px;font-variant-numeric:tabular-nums}
.avstep.read,.avstep.reread,.avstep.lookup{background:color-mix(in oklab,var(--bar-2) 16%,var(--surface))}
.avstep.revisit{background:color-mix(in oklab,var(--ord-2) 18%,var(--surface))}
.avstep.idle,.avstep.background{background:color-mix(in oklab,var(--warn) 18%,var(--surface))}
.avlink{padding:0;font-weight:600;text-align:left}
.qc.link:active{transform:scale(.9)}
.qlink{border:0;background:transparent;padding:2px 6px;border-radius:6px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.qlink:hover{background:var(--fill)}
@container (max-width:400px){.qc.w::before{content:none}.qc.t::after{width:4px;height:4px}}
.qlegend .sw.c{background:color-mix(in oklab,var(--good) 58%,var(--surface))}
.qlegend .sw.w{background:var(--bad)}
.qlegend .sw.s{box-shadow:inset 0 0 0 1.5px var(--warn)}
.qlegend .sw.x{background:repeating-linear-gradient(135deg,var(--fill-2) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--fill-2)}
.qlegend .dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}

.order{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.order .step{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;background:var(--fill);color:var(--ink);font-weight:500}
.notes{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2);display:grid;gap:4px}
.stack{display:grid;gap:16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.minihead{font-size:13px;font-weight:600;margin:0 0 8px}
.bar-in{display:flex;align-items:center;gap:8px}
.bar-in i{display:block;height:6px;border-radius:3px;background:var(--ink-3);min-width:1px}
.bar-in i.good{background:var(--good)}
.bar-in i.bad{background:var(--bad)}
details.more{margin-top:12px}
details.more summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .25s var(--spring)}
details.more[open] summary::before{transform:rotate(45deg)}

/* ─────────────────────────── Data view ─────────────────────────── */
.avail td.c{font-size:13px}
.yes{color:var(--good-ink);font-weight:600}
.no{color:var(--ink-3)}
.defs{display:grid;gap:10px;margin:0}
.defs div{display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:12px;font-size:13px}
.defs dt{font-weight:600}
.defs dd{margin:0;color:var(--ink-2)}
.tiers{display:grid;gap:10px}
.tier{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:13px;color:var(--ink-2)}
.tier b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--fill);color:var(--ink);font-size:13px}
.tier strong{color:var(--ink);font-weight:600}
.notes-list{list-style:none;margin:0;padding:0;display:grid;gap:0}
.notes-list li{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--hairline);font-size:13px;color:var(--ink-2)}
.notes-list li:last-child{border-bottom:0}
.notes-list li b{color:var(--ink);font-weight:600}
@media (max-width:560px){.notes-list li,.defs div{grid-template-columns:1fr;gap:4px}}
.userlist{display:grid;gap:8px}
.userlist .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-inner);background:var(--surface-2);font-size:13px}
.banner{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:color-mix(in oklab,var(--accent-fill) 10%,var(--surface));font-size:13px;color:var(--ink-2)}
.banner b{color:var(--ink)}

/* ─────────────────────────── Tooltip, sheet, toast ─────────────────────────── */
.tip{position:fixed;left:0;top:0;z-index:300;pointer-events:none;min-width:170px;max-width:300px;padding:10px 12px;border-radius:12px;background:var(--tip-bg);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 10px 30px rgba(0,0,0,.16),0 0 0 .5px var(--hairline);font-size:12px;line-height:1.45;color:var(--ink);opacity:0;transition:opacity .1s var(--ease)}
.tip.on{opacity:1}
.tip .t{font-size:13px;font-weight:600;letter-spacing:-.01em}
.tip .st{color:var(--ink-3);margin-bottom:6px}
.tip .r{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.tip .r span{color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tip .r b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.tip .r .key{width:12px;height:0;border-top:2px solid currentColor}
.tip .note{margin-top:6px;color:var(--ink-3);white-space:normal}

dialog.sheet{border:0;padding:0;border-radius:22px;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 32px));max-height:min(88vh,920px);box-shadow:0 30px 90px rgba(0,0,0,.28);overflow:hidden}
dialog.sheet[open]{display:flex;flex-direction:column;animation:sheet-in .42s var(--spring)}
dialog.sheet.closing{animation:sheet-out .22s var(--ease) forwards}
dialog.sheet::backdrop{background:rgba(0,0,0,.34)}
@keyframes sheet-in{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sheet-out{to{opacity:0;transform:translateY(28px) scale(.985)}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px 12px}
.sheet-h h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.024em}
.sheet-b{padding:4px 22px 18px;overflow:auto;display:grid;gap:16px}
.sheet-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--hairline);background:var(--surface)}
@media (max-width:600px){dialog.sheet{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92vh}}
.drop{display:grid;place-items:center;gap:6px;text-align:center;padding:30px 16px;border-radius:16px;border:1.5px dashed var(--axis);background:var(--surface-2);cursor:pointer;transition:border-color .15s,background-color .15s,transform .12s}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in oklab,var(--accent-fill) 6%,var(--surface-2))}
.drop:active{transform:scale(.99)}
.drop b{font-size:15px}
.drop span{font-size:13px;color:var(--ink-3)}
.field{display:grid;gap:5px;font-size:12px;font-weight:500;color:var(--ink-2)}
.field input,.field select{height:34px;border-radius:9px;border:1px solid var(--hairline);background:var(--surface-2);padding:0 10px;font-size:14px;color:var(--ink);min-width:0}
.field input:focus,.field select:focus{outline:3px solid var(--focus-ring);outline-offset:0;border-color:transparent}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pending{display:grid;gap:12px}
.pending .item{border:1px solid var(--hairline);border-radius:14px;padding:14px;display:grid;gap:12px}
.pending .item.dup{opacity:.7}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--accent-fill)}
.grid-in{display:grid;grid-template-columns:90px repeat(3,minmax(0,1fr));gap:6px;align-items:center;font-size:12px}
.grid-in input{height:30px;border-radius:8px;border:1px solid var(--hairline);background:var(--surface-2);padding:0 8px;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;z-index:400;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--tip-bg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--ink);padding:10px 16px;border-radius:980px;box-shadow:0 10px 30px rgba(0,0,0,.18),0 0 0 .5px var(--hairline);font-size:13px;font-weight:500;transition:transform .4s var(--spring),opacity .2s var(--ease);max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0);opacity:1}

footer.foot{padding-block:0 40px;font-size:12px;color:var(--ink-3)}

/* ─────────────────────────── Responsive + a11y preferences ─────────────────────────── */
@media (max-width:860px){
  .appbar .wrap{grid-template-columns:1fr auto}
  .tabs-scroll{grid-column:1/-1;grid-row:2;justify-self:stretch}
}
@media (max-width:620px){.switch .txt{font-size:0}.switch .txt::after{content:attr(data-short);font-size:12px}.switch{gap:6px}}
.bt-sm{display:none}
@media (max-width:520px){
  .brand span{display:none}
  .actions{gap:6px}
  .switch input{width:34px;height:20px;border-radius:10px}
  .switch input::after{width:16px;height:16px}
  .switch input:checked::after{transform:translateX(14px)}
  #guideSwitch .txt::after{content:none}
  .bt-lg{display:none}.bt-sm{display:inline}
}
@media (max-width:420px){.btn.add .txt{display:none}.btn.add{width:32px;padding:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (prefers-reduced-transparency:reduce){
  .appbar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  .tip,.toast{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-contrast:more){:root{--hairline:rgba(0,0,0,.35);--grid:#c7c7cc}}
@media print{.appbar,.actions,.filters,dialog,.toast{display:none!important}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.view[hidden]{display:grid!important}}

</style>
</head>
<body>
<header class="appbar" id="appbar">
  <div class="wrap">
    <div class="brand">
      <b>CLAT UG</b>
      <span id="brandSub">Performance dashboard</span>
    </div>
    <div class="tabs-scroll">
      <nav class="seg" id="tabs" role="tablist" aria-label="Dashboard sections">
        <span class="thumb" aria-hidden="true"></span>
        <button role="tab" id="tab-overview" data-view="overview" aria-controls="v-overview" aria-selected="true">Overview</button>
        <button role="tab" id="tab-attempt" data-view="attempt" aria-controls="v-attempt" aria-selected="false">Attempt</button>
      <button role="tab" id="tab-trends" data-view="trends" aria-controls="v-trends" aria-selected="false">Trends</button>
        <button role="tab" id="tab-sections" data-view="sections" aria-controls="v-sections" aria-selected="false">Sections</button>
        <button role="tab" id="tab-questions" data-view="questions" aria-controls="v-questions" aria-selected="false">Questions</button>
        <button role="tab" id="tab-timing" data-view="timing" aria-controls="v-timing" aria-selected="false">Timing &amp; topics</button>
        <button role="tab" id="tab-practice" data-view="practice" aria-controls="v-practice" aria-selected="false" hidden>Practice</button>
        <button role="tab" id="tab-data" data-view="data" aria-controls="v-data" aria-selected="false">Data</button>
      </nav>
    </div>
    <div class="actions">
      <div class="guide-group">
        <label class="switch" id="guideSwitch" title="Draw your target on every chart that has one">
          <input type="checkbox" id="guideToggle" role="switch">
          <span class="txt" data-short="Target">Guiding light</span>
        </label>
        <button class="btn plain small" id="targetEdit" type="button" aria-haspopup="dialog" title="Change your target score or range"><span class="bt-lg">Edit</span><span class="bt-sm">Target</span></button>
      </div>
      <label class="switch wiz" id="wizSwitch" title="Coaching beside every chart, from your own numbers and the cutoffs for your category">
        <input type="checkbox" id="wizToggle" role="switch">
        <span class="txt" data-short="Wiz">Benchmark Wiz</span>
      </label>
      <button class="btn icon" id="themeBtn" type="button" aria-label="Theme: follows system" title="Theme: follows system"></button>
      <button class="btn primary add" id="addBtn" type="button" aria-label="Add attempt">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        <span class="txt">Add attempt</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <section class="view" id="v-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
  <section class="view" id="v-trends" role="tabpanel" aria-labelledby="tab-trends" hidden></section>
  <section class="view" id="v-sections" role="tabpanel" aria-labelledby="tab-sections" hidden></section>
  <section class="view" id="v-questions" role="tabpanel" aria-labelledby="tab-questions" hidden></section>
  <section class="view" id="v-timing" role="tabpanel" aria-labelledby="tab-timing" hidden></section>
  <section class="view" id="v-attempt" role="tabpanel" aria-labelledby="tab-attempt" hidden></section>
  <section class="view" id="v-practice" role="tabpanel" aria-labelledby="tab-practice" hidden></section>
  <section class="view" id="v-data" role="tabpanel" aria-labelledby="tab-data" hidden></section>
</main>
<footer class="foot wrap" id="foot"></footer>

<div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-h">
    <h2 id="sheetTitle">Add an attempt</h2>
    <div class="seg small" id="sheetMode" role="tablist" aria-label="How to add">
      <span class="thumb" aria-hidden="true"></span>
      <button type="button" role="tab" id="modeFile" data-mode="file" aria-selected="true">From Excel</button>
      <button type="button" role="tab" id="modeManual" data-mode="manual" aria-selected="false">Enter by hand</button>
    </div>
  </div>
  <div class="sheet-b" id="sheetBody"></div>
  <div class="sheet-f">
    <button class="btn" type="button" id="sheetCancel">Cancel</button>
    <button class="btn primary" type="button" id="sheetConfirm" disabled>Add</button>
  </div>
</dialog>

<dialog class="sheet narrow" id="targetSheet" aria-labelledby="targetTitle">
  <div class="sheet-h">
    <h2 id="targetTitle">Your target</h2>
    <div class="seg small" id="targetMode" role="tablist" aria-label="Target type">
      <span class="thumb" aria-hidden="true"></span>
      <button type="button" role="tab" data-mode="single" aria-selected="true">One score</button>
      <button type="button" role="tab" data-mode="range" aria-selected="false">A range</button>
    </div>
  </div>
  <div class="sheet-b" id="targetBody"></div>
  <div class="sheet-f">
    <button class="btn plain" type="button" id="targetReset" style="margin-right:auto">Reset to 114</button>
    <button class="btn" type="button" id="targetCancel">Cancel</button>
    <button class="btn primary" type="button" id="targetSave">Save</button>
  </div>
</dialog>

      const d = +m[1], mm = +m[2] - 1, y = +m[3] < 100 ? 2000 + +m[3] : +m[3];
      const dt = new Date(Date.UTC(y, mm, d));
      if (!isNaN(dt)) return { display: s, ts: dt.getTime(), iso: dt.toISOString().slice(0,10) };
    }
    return { display: s, ts: null, iso: null };
  }
  function clean(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,''); }

  /* ───────── FUZZY ───────── */
  function lev(a, b, maxDist){
    a = String(a||''); b = String(b||'');
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    if (Math.abs(a.length - b.length) > (maxDist || Infinity)) return maxDist + 1;
    const m = a.length, n = b.length;
    let prev = new Array(n+1), curr = new Array(n+1);
    for (let j=0; j<=n; j++) prev[j] = j;
    for (let i=1; i<=m; i++){
      curr[0] = i; let rowMin = i;
      for (let j=1; j<=n; j++){
        const cost = a[i-1] === b[j-1] ? 0 : 1;
        curr[j] = Math.min(prev[j]+1, curr[j-1]+1, prev[j-1]+cost);
        if (curr[j] < rowMin) rowMin = curr[j];
      }
      if (maxDist != null && rowMin > maxDist) return maxDist + 1;
      [prev, curr] = [curr, prev];
    }
    return prev[n];
  }
  function sim(a, b){
    a = clean(a); b = clean(b);
    if (!a && !b) return 1;
    if (!a || !b) return 0;
    const d = lev(a, b);
    return 1 - d / Math.max(a.length, b.length);
  }
  function match(needle, dict, threshold){
    threshold = threshold == null ? 0.7 : threshold;
    const n = clean(needle); if (!n) return null;
    let best = null;
    for (const key in dict){
      for (const syn of dict[key]){
        const c = clean(syn); if (!c) continue;
        if (n === c) return { key, score: 1.0 };
        // Substring match: only if both ≥ 3 chars AND length ratio ≥ 0.5 (prevents 'e' eating everything)
        if (n.length >= 3 && c.length >= 3 && (n.includes(c) || c.includes(n)) &&
            Math.min(n.length, c.length) / Math.max(n.length, c.length) >= 0.5) {
          const score = 0.85 + 0.15 * Math.min(n.length, c.length) / Math.max(n.length, c.length);
          if (!best || score > best.score) best = { key, score };
          continue;
        }
        if (Math.abs(n.length - c.length) > Math.max(2, Math.min(n.length, c.length) * 0.5)) continue;
        const s = sim(n, c);
        if (s >= threshold && (!best || s > best.score)) best = { key, score: s };
      }
    }
    return best;
  }

  /* ───────── DICTIONARIES ───────── */
  const SECTION_SYN = {
    english: ['english','english language','verbal ability','verbal','english comprehension','el','va','reading','reading comprehension','rc','language','english & rc'],
    cagk:    ['current affairs','current affairs including general knowledge','gk','general knowledge','ca/gk','ca-gk','gk/ca','cagk','ca','general awareness','ga','static gk','current affairs gk','current affairs & gk'],
    legal:   ['legal','legal reasoning','legal aptitude','lr legal','law','legal knowledge','legal awareness','legal studies'],
    logical: ['logical','logical reasoning','logical reasoning 1','lr','reasoning','analytical reasoning','critical reasoning'],
    quants:  ['quants','quant','quantitative','quantitative aptitude','quantitative techniques','qa','maths','math','mathematics','numerical ability','numerical aptitude','qt','data interpretation','di']
  };
  const COL_SYN = {
    section:    ['section','sec','subject','area','category'],
    subSection: ['sub section','sub-section','subsection','sub','sub topic','sub-topic'],
    topic:      ['topic','topic name','chapter','concept','sub-area'],
    mainSection:['main section','main-section','primary section','parent section'],
    score:      ['score','marks','marks scored','marks obtained','points','net score','total marks'],
    correct:    ['correct','right','correct answers','correct answer','no of correct','correct ans'],
    incorrect:  ['incorrect','wrong','wrong answers','incorrect answers','wrong ans','negative','errors'],
    skipped:    ['skipped','skip','left','unattempted','not attempted','un-attempted','blank'],
    attempted:  ['attempted','attempts','answered','responses'],
    accuracy:   ['accuracy','acc','accuracy %','accuracy percentage','correct %','percent correct'],
    time:       ['time','time taken','time spent','duration','minutes','mins','seconds','t'],
    interval:   ['interval','time interval','range','window','block','bucket'],
    totalQ:     ['total q','total questions','total ques','no of questions','questions','q count'],
    difficulty: ['difficulty','difficulty level','level','complexity'],
    qNum:       ['q no','qno','q. no','question no','question number','q','q#','question id','qid'],
    status:     ['status','result','outcome','answered as','your answer status','attempt status']
  };
  const META_SYN = {
    testName:      ['test name','name','title','exam name','assessment name','mock name'],
    sectionName:   ['section','section name','part','subject area'],
    attempt:       ['attempt','attempt no','attempt number','attempt #','attempt id'],
    questions:     ['questions','total questions','no of questions','total q','question count'],
    maxMarks:      ['marks','maximum marks','max marks','total marks','out of','full marks'],
    duration:      ['duration','test duration','allocated time','total time','time allowed'],
    attemptedOn:   ['attempted on','date','date attempted','submitted on','date of attempt','attempt date'],
    score:         ['score','your score','final score','total score','net score'],
    correct:       ['correct','correct answers','correct attempts','right answers','no of correct'],
    incorrect:     ['incorrect','wrong','wrong answers','incorrect answers','negative answers','errors'],
    skipped:       ['skipped','left','unattempted','not attempted','blank answers','skips'],
    marksObtained: ['marks obtained','positive marks','marks gained','plus marks','obtained marks'],
    marksLost:     ['marks lost','negative marks','penalty','deducted marks','minus marks','negatives'],
    marksSkipped:  ['marks skipped','skipped marks','marks left','potential marks lost'],
    accuracy:      ['accuracy','accuracy %','accuracy percentage','correct %'],
    completed:     ['completed','completion','completion %','attempt rate','coverage','attempted %'],
    timeTaken:     ['time taken','time spent','total time','time used','time consumed','total duration'],
    scoringRule:   ['scoring rule','marking scheme','marking','scheme','grading'],
    scoreCheck:    ['score check','verification','tally','reconciliation'],
    rank:          ['rank','your rank','overall rank','final rank','position'],
    percentile:    ['percentile','your percentile','overall percentile'],
    avgScore:      ['average score','avg score','mean score','topper score'],
    topScore:      ['top score','topper','highest score','best score']
  };
  const DIFF_SYN = {
    easy:    ['easy','simple','basic','foundation','low'],
    medium:  ['medium','moderate','intermediate','med'],
    hard:    ['hard','difficult','tough','advanced','high','expert']
  };
  const STATUS_SYN = {
    correct:      ['correct','right','c','tick'],
    incorrect:    ['incorrect','wrong','w','cross','error'],
    skipped:      ['skipped','not attempted','unattempted','left','blank','na'],
    markedReview: ['marked for review','review','flagged','mfr']
  };

  /* ───────── SHEET PREP ───────── */
  function prep(rows){
    rows = (rows || []).map(r => Array.isArray(r) ? r.slice() : []);
    while (rows.length && rows[rows.length-1].every(c => c == null || String(c).trim() === '')) rows.pop();
    return rows;
  }
  function maybeTranspose(rows){
    if (rows.length < 3) return rows;
    const maxCols = rows.reduce((m, r) => Math.max(m, r.length), 0);
    if (maxCols < 3) return rows;
    const col0HasContent = rows.filter(r => r[0] != null && String(r[0]).trim() !== '').length;
    const row0HasContent = (rows[0] || []).filter(c => c != null && String(c).trim() !== '').length;
    if (row0HasContent > col0HasContent * 2 && row0HasContent >= 4) {
      return Array.from({length: maxCols}, (_, c) => rows.map(r => r[c] == null ? null : r[c]));
    }
    return rows;
  }

  /* ───────── EXTRACTORS ───────── */
  function mapColumns(headerRow){
    const m = { section:null, subSection:null, topic:null, mainSection:null,
                score:null, correct:null, incorrect:null, skipped:null, attempted:null,
                accuracy:null, time:null, interval:null, totalQ:null, difficulty:null,
                qNum:null, status:null };
    if (!headerRow) return m;
    headerRow.forEach((cell, idx) => {
      if (cell == null || String(cell).trim() === '') return;
      const best = match(cell, COL_SYN, 0.78);
      if (!best) return;
      if (m[best.key] == null) m[best.key] = idx;
    });
    return m;
  }

  function extractMeta(rows){
    const meta = {}, _audit = {};
    for (const r of rows){
      if (!r) continue;
      const tryKV = (kIdx, vIdx) => {
        const k = r[kIdx], v = r[vIdx];
        if (k == null || v == null || String(k).trim() === '' || String(v).trim() === '') return;
        const ks = String(k).trim();
        if (/^(overall|total|sum|summary|grand total)$/i.test(ks)) return;
        if (match(ks, SECTION_SYN, 0.85)) return;
        if (match(ks, DIFF_SYN, 0.85)) return;
        if (/^\d+\s*[-–]\s*\d+\s*(?:min|m)?$/i.test(ks)) return;
        const m = match(k, META_SYN, 0.78);
        if (!m) return;
        const field = m.key;
        if (meta[field] != null) return;
        let coerced = v;
        if (['questions','correct','incorrect','skipped','marksObtained','marksLost','marksSkipped','maxMarks','score','rank','topScore','avgScore'].includes(field)) coerced = num(v);
        else if (['accuracy','completed','percentile'].includes(field)) coerced = pct(v);
        else if (field === 'timeTaken') { meta.timeSec = dur(v); coerced = String(v); }
        else if (field === 'duration') { meta.durationSec = dur(v); coerced = String(v); }
        else if (field === 'attemptedOn') { const d = date(v); meta.attemptedOnTs = d ? d.ts : null; coerced = String(v); }
        else coerced = (typeof v === 'string') ? v.trim() : v;
        if (coerced != null) { meta[field] = coerced; _audit[field] = { source: String(k), conf: m.score }; }
      };
      tryKV(0, 1); tryKV(1, 2);
    }
    if (meta.marksLost != null) meta.marksLost = Math.abs(meta.marksLost);
    if (Object.keys(meta).length === 0) return null;
    meta._audit = _audit;
    return meta;
  }

  function extractSections(rows){
    let best = null;
    for (let i=0; i<rows.length; i++){
      const r = rows[i] || [];
      const cm = mapColumns(r);
      if (cm.section == null) continue;
      if (cm.correct == null && cm.score == null && cm.accuracy == null) continue;
      const found = {}, _sourceRows = {};
      let read = 0, conf = 0;
      for (let j=i+1; j<rows.length && j<i+50; j++){
        const r2 = rows[j] || [];
        const raw = r2[cm.section];
        if (raw == null || String(raw).trim() === '') { if (read > 0) break; else continue; }
        if (/^(total|overall|summary)/i.test(String(raw))) break;
        const m = match(raw, SECTION_SYN, 0.72);
        if (!m) continue;
        if (found[m.key]) continue;
        const correct   = cm.correct   != null ? num(r2[cm.correct])   : null;
        const incorrect = cm.incorrect != null ? num(r2[cm.incorrect]) : null;
        const skipped   = cm.skipped   != null ? num(r2[cm.skipped])   : null;
        const score     = cm.score     != null ? num(r2[cm.score])     : null;
        const attempted = cm.attempted != null ? num(r2[cm.attempted]) : null;
        let acc         = cm.accuracy  != null ? pct(r2[cm.accuracy])  : null;
        const timeSec   = cm.time      != null ? dur(r2[cm.time])      : null;
        if (acc == null && correct != null && incorrect != null && (correct + incorrect) > 0) acc = correct / (correct + incorrect) * 100;
        found[m.key] = { correct, incorrect, skipped, score, attempted, acc: acc != null ? +acc.toFixed(2) : null, timeSec };
        _sourceRows[m.key] = { row: j, raw: String(raw), conf: m.score };
        read++; conf += m.score;
      }
      if (read >= 1 && (!best || read > best.count || (read === best.count && conf > best.conf))) {
        best = { cm, sections: found, count: read, conf, _sourceRows, _headerRow: i };
      }
    }
    return best;
  }

  function extractIntervals(rows){
    let out = [], cm = null;
    for (let i=0; i<rows.length; i++){
      const r = rows[i] || [];
      const hasAttempted = r.some(c => /attempted|answered/i.test(String(c||'')));
      const hasAcc = r.some(c => /accuracy|correct\s*%/i.test(String(c||'')));
      if (hasAttempted && hasAcc) {
        cm = mapColumns(r);
        if (cm.interval == null) cm.interval = 0;
        out = [];
        continue;
      }
      if (cm == null) continue;
      const lab = String(r[cm.interval] || '');
      const mm = lab.match(/(\d+)\s*[-–]\s*(\d+)\s*(?:min|m|minute)?/i);
      if (mm) {
        out.push({
          label: `${mm[1]}-${mm[2]} min`,
          attempted: cm.attempted != null ? (num(r[cm.attempted]) || 0) : 0,
          correct:   cm.correct   != null ? (num(r[cm.correct])   || 0) : 0,
          incorrect: cm.incorrect != null ? (num(r[cm.incorrect]) || 0) : 0,
          accuracy:  cm.accuracy  != null ? (pct(r[cm.accuracy])  || 0) : 0,
          marks:     cm.score     != null ? (num(r[cm.score])     || 0) : 0
        });
      } else if (out.length && !/overall|total|sum/i.test(lab) && lab.trim() !== '') {
        cm = null;
      }
    }
    return out.length ? out : null;
  }

  function extractTopicTree(rows){
    let hdr = -1, cm = null;
    for (let i=0; i<rows.length; i++){
      const r = rows[i] || [];
      const joined = r.map(c => String(c||'').toLowerCase());
      const hasMain = joined.some(s => /main\s*section|main-section/.test(s));
      const hasSubAndTopic = joined.some(s => /sub.?section|sub.?topic/.test(s)) && joined.some(s => /\btopic\b/.test(s));
      if (!hasMain && !hasSubAndTopic) continue;
      cm = mapColumns(r); hdr = i; break;
    }
    if (hdr < 0 || (cm.topic == null && cm.subSection == null)) return null;
    const items = [];
    for (let j=hdr+1; j<rows.length; j++){
      const r = rows[j] || [];
      const main = cm.mainSection != null ? String(r[cm.mainSection]||'').trim() : '';
      const sub  = cm.subSection  != null ? String(r[cm.subSection]||'').trim()  : '';
      const tp   = cm.topic       != null ? String(r[cm.topic]||'').trim()       : '';
      if (!main && !sub && !tp) { if (items.length) break; else continue; }
      if (/^notes?$|scoring rule|disclaimer|^page/i.test(main)) break;
      const acc = cm.accuracy != null ? pct(r[cm.accuracy]) : null;
      items.push({
        main, sub, topic: tp,
        score:     cm.score     != null ? num(r[cm.score])     : null,
        correct:   cm.correct   != null ? num(r[cm.correct])   : null,
        incorrect: cm.incorrect != null ? num(r[cm.incorrect]) : null,
        skipped:   cm.skipped   != null ? num(r[cm.skipped])   : null,
        attempted: cm.attempted != null ? num(r[cm.attempted]) : null,
        acc:       acc != null ? +acc.toFixed(2) : null,
        timeSec:   cm.time      != null ? dur(r[cm.time])      : null,
        difficulty:cm.difficulty!= null ? String(r[cm.difficulty]||'').trim() : null
      });
    }
    return items.length ? items : null;
  }

  function extractDifficulty(rows){
    let best = null;
    for (let i=0; i<rows.length; i++){
      const r = rows[i] || [];
      const cm = mapColumns(r);
      if (cm.difficulty == null) continue;
      const buckets = {};
      for (let j=i+1; j<rows.length && j<i+12; j++){
        const r2 = rows[j] || [];
        const label = r2[cm.difficulty];
        if (label == null || String(label).trim() === '') break;
        const m = match(label, DIFF_SYN, 0.72);
        if (!m) continue;
        if (buckets[m.key]) continue;
        buckets[m.key] = {
          correct:   cm.correct   != null ? num(r2[cm.correct])   : null,
          incorrect: cm.incorrect != null ? num(r2[cm.incorrect]) : null,
          skipped:   cm.skipped   != null ? num(r2[cm.skipped])   : null,
          score:     cm.score     != null ? num(r2[cm.score])     : null,
          totalQ:    cm.totalQ    != null ? num(r2[cm.totalQ])    : null,
          attempted: cm.attempted != null ? num(r2[cm.attempted]) : null,
          accuracy:  cm.accuracy  != null ? pct(r2[cm.accuracy])  : null,
          timeSec:   cm.time      != null ? dur(r2[cm.time])      : null
        };
      }
      const count = Object.keys(buckets).length;
      if (count >= 2 && (!best || count > best.count)) best = { buckets, count };
    }
    return best ? best.buckets : null;
  }

  function extractQuestionLevel(rows){
    let hdr = -1, cm = null;
    for (let i=0; i<rows.length; i++){
      const cmTry = mapColumns(rows[i] || []);
      if (cmTry.qNum != null && (cmTry.status != null || cmTry.time != null)) { cm = cmTry; hdr = i; break; }
    }
    if (hdr < 0) return null;
    const items = [];
    for (let j=hdr+1; j<rows.length; j++){
      const r = rows[j] || [];
      const qn = r[cm.qNum];
      if (qn == null || String(qn).trim() === '') break;
      const qnum = num(qn); if (qnum == null) break;
      const statusRaw = cm.status != null ? r[cm.status] : null;
      const status = statusRaw != null ? (match(statusRaw, STATUS_SYN, 0.7) || {}).key : null;
      items.push({
        qNum: qnum,
        status: status || (statusRaw != null ? String(statusRaw).trim() : null),
        timeSec: cm.time != null ? dur(r[cm.time]) : null,
        topic: cm.topic != null ? String(r[cm.topic]||'').trim() : null,
        section: cm.section != null ? String(r[cm.section]||'').trim() : null,
        difficulty: cm.difficulty != null ? String(r[cm.difficulty]||'').trim() : null,
        score: cm.score != null ? num(r[cm.score]) : null
      });
    }
    return items.length ? items : null;
  }

  function extractExtras(rows, meta){
    const claimed = new Set(meta && meta._audit ? Object.values(meta._audit).map(a => clean(a.source)) : []);
    const extras = {};
    for (const r of rows){
      if (!r || r.length < 2) continue;
      const k = r[0], v = r[1];
      if (k == null || v == null) continue;
      const ks = String(k).trim(), vs = String(v).trim();
      if (!ks || !vs) continue;
      if (claimed.has(clean(ks))) continue;
      if (/^(section|main section|sub-?section|topic|metric|field|attempted|correct|incorrect|skipped|accuracy|time|score|marks?|time interval|interval|status|q\.?\s*no\.?|question|difficulty)$/i.test(ks)) continue;
      if (/^(overall|total|sum|summary|grand total)$/i.test(ks)) continue;
      if (match(ks, SECTION_SYN, 0.85)) continue;
      if (match(ks, DIFF_SYN, 0.85)) continue;
      if (match(ks, COL_SYN, 0.85)) continue;
      if (/^\d+\s*[-–]\s*\d+\s*(?:min|m)?$/i.test(ks)) continue;
      if (ks.length > 60 || vs.length > 200) continue;
      if (num(ks) != null) continue;
      extras[ks] = vs;
    }
    return Object.keys(extras).length ? extras : null;
  }

  /* ───────── ORCHESTRATOR ───────── */
  function parseWorkbook(workbook, XLSXref){
    const X = XLSXref || (typeof XLSX !== 'undefined' ? XLSX : null);
    const result = {
      meta:null, sections:null, intervals:null, tree:null, difficulty:null, questions:null, extras:null,
      sectionTimes:null, _sheets:[], _blocks:[], _conf:{}
    };
    for (const sn of workbook.SheetNames){
      const ws = workbook.Sheets[sn];
      let rows = X.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: null });
      rows = prep(rows); rows = maybeTranspose(rows);
      result._sheets.push({ name: sn, rows: rows.length });
      const m  = extractMeta(rows);
      const s  = extractSections(rows);
      const iv = extractIntervals(rows);
      const tr = extractTopicTree(rows);
      const df = extractDifficulty(rows);
      const ql = extractQuestionLevel(rows);
      if (m  && (!result.meta || Object.keys(m).length > Object.keys(result.meta).length)) result.meta = m;
      if (s  && (!result.sections || s.count > result.sections.count || s.conf > result.sections.conf)) result.sections = s;
      if (iv && (!result.intervals || iv.length > result.intervals.length)) result.intervals = iv;
      if (tr && (!result.tree || tr.length > result.tree.length)) result.tree = tr;
      if (df) result.difficulty = df;
      if (ql && (!result.questions || ql.length > result.questions.length)) result.questions = ql;
      result._blocks.push({ sheet: sn,
        meta: m ? Object.keys(m).filter(k => k !== '_audit').length : 0,
        sections: s ? s.count : 0, intervals: iv ? iv.length : 0,
        tree: tr ? tr.length : 0,
        difficulty: df ? Object.keys(df).length : 0,
        questions: ql ? ql.length : 0 });
    }
    if (workbook.SheetNames.length){
      const rows = prep(X.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header:1, blankrows:false, defval:null }));
      result.extras = extractExtras(rows, result.meta);
    }
    // Derive section-time map from tree (sub & topic both "Overall")
    if (result.tree){
      const st = {};
      result.tree.forEach(t => {
        const k = match(t.main, SECTION_SYN, 0.72); if (!k) return;
        const subOverall = !t.sub || /^overall$/i.test(t.sub);
        const topOverall = !t.topic || /^overall$/i.test(t.topic);
        if (subOverall && topOverall && t.timeSec != null) st[k.key] = t.timeSec;
      });
      if (Object.keys(st).length) result.sectionTimes = st;
    }
    result._conf = {
      meta: result.meta ? Object.keys(result.meta).filter(k => k !== '_audit').length / 15 : 0,
      sections: result.sections ? Math.min(1, result.sections.count / 5) : 0,
      intervals: result.intervals ? Math.min(1, result.intervals.length / 4) : 0,
      tree: result.tree ? Math.min(1, result.tree.length / 10) : 0,
      sectionTimes: result.sectionTimes ? Math.min(1, Object.keys(result.sectionTimes).length / 5) : 0,
      difficulty: result.difficulty ? Math.min(1, Object.keys(result.difficulty).length / 3) : 0,
      questions: result.questions ? Math.min(1, result.questions.length / 50) : 0,
      extras: result.extras ? Math.min(1, Object.keys(result.extras).length / 5) : 0
    };
    return result;
  }

  return {
    COERCE: { num, pct, frac, dur, date, clean },
    FUZZY:  { lev, sim, match },
    DICT:   { SECTION_SYN, COL_SYN, META_SYN, DIFF_SYN, STATUS_SYN },
    EXTRACT:{ extractMeta, extractSections, extractIntervals, extractTopicTree, extractDifficulty, extractQuestionLevel, extractExtras, mapColumns },
    parseWorkbook
  };
})();

/* ---- Legacy facades so existing call sites keep working ---- */
function numOf(v){ return P.COERCE.num(v); }
function pctOf(v){ return P.COERCE.pct(v); }
function timeToSec(v){ return P.COERCE.dur(v); }
function normSection(s){ const m = P.FUZZY.match(s, P.DICT.SECTION_SYN, 0.72); return m ? m.key : null; }

/* ── Along the paper: cumulative marks dropped, question by question ── */
function renderPaperRun(host, list) {
  host.replaceChildren();

  if (!logs.length) return emptyChart(host, 'No question logs yet.');
  const W = Math.max(300, host.clientWidth);
  const N = Math.max(...logs.map(o => o.qs.length));
  const series = logs.map(o => {
    let cum = 0;
    const pts = o.qs.map(q => { cum += q.out === 'w' ? 1.25 : q.out === 's' ? 1 : 0; return cum; });
    return Object.assign(o, { pts, total: cum, style: attemptLineStyle(o.a, logs.map(x => x.a)) });
  });
  const ticks = niceTicks(Math.max(5, ...series.map(s => s.total)), 4), hi = ticks[ticks.length - 1];

  });

  if (state.prefs.guide) {
    // Marks you can drop and still hit the target: (1 − target %) of each question so far. A range gives a wedge.
    const [lostLo, lostHi] = TGT.band('lost'), yEnd = v => Y(Math.min(hi, v * N));
    if (lostHi - lostLo > 1e-9) svg.append(S('path', { d: `M${X(0)} ${Y(0)}L${X(N)} ${yEnd(lostLo)}L${X(N)} ${yEnd(lostHi)}Z`, fill: 'var(--target)', opacity: 0.07 }));
    [...new Set([lostLo, lostHi])].forEach(v => svg.append(S('line', { x1: X(0), y1: Y(0), x2: X(N), y2: yEnd(v), stroke: 'var(--target)', 'stroke-dasharray': '5 4', 'stroke-width': 1.25, opacity: 0.75 })));
    svg.append(txt(X(N) - 4, yEnd(lostHi) - 6, `${TGT.value('pct')} pace`, { class: 'halo', 'text-anchor': 'end', fill: 'var(--ink-2)', 'font-size': 10.5, 'font-weight': 500 }));
  }

    let d = `M${X(0).toFixed(1)} ${Y(0).toFixed(1)}`, prev = 0;
    s.pts.forEach((v, i) => { const x = X(i + 1).toFixed(1); d += `H${x}`; if (v !== prev) { d += `V${Y(v).toFixed(1)}`; prev = v; } });
    svg.append(S('path', { d, fill: 'none', stroke: s.style.color, 'stroke-width': s.style.width, opacity: s.style.opacity, 'stroke-linejoin': 'round' }));

  svg.append(txt(padL, 12, 'Marks dropped so far', { fill: 'var(--ink-2)', 'font-size': 11 }));
  const cross = S('line', { y1: padT, y2: Hh - padB, stroke: 'var(--ink-3)', opacity: 0, 'pointer-events': 'none' });

    })));

/* ── Pace: cumulative questions attempted at each 30-minute mark ── */
function renderPace(host, mocks) {
  host.replaceChildren();

  const maxMin = Math.max(...mocks.map(a => a.intervals.length * 30));

  const svg = svgRoot(W, Hh, 'Questions attempted by each 30-minute mark');
  [0, 30, 60, 90, 120].forEach(q => {
    svg.append(S('line', { x1: padL, x2: W - padR, y1: Y(q), y2: Y(q), stroke: q === 0 ? 'var(--axis)' : 'var(--grid)' }));

  for (let mn = 0; mn <= maxMin; mn += 30) svg.append(txt(X(mn), Hh - 9, mn === maxMin ? `${mn} min` : String(mn), { 'text-anchor': 'middle', 'font-size': 10.5 }));
  svg.append(txt(padL, 11, 'Questions attempted', { fill: 'var(--ink-2)', 'font-size': 11 }));
  if (state.prefs.guide) {
    const end = Math.min(120, maxMin);
    svg.append(S('line', { x1: X(0), y1: Y(0), x2: X(end), y2: Y(end), stroke: 'var(--target)', 'stroke-dasharray': '5 4', 'stroke-width': 1.25, opacity: 0.7 }));
    // Above the line's end: the diagonal rises to the right, so a label ending there stays clear of it, and no attempt can plot above its top.
    svg.append(txt(X(end) - 6, Y(end) - 6, '1 question / min', { class: 'halo', 'text-anchor': 'end', fill: 'var(--ink-2)', 'font-size': 10.5, 'font-weight': 500 }));
  }
  const series = mocks.map(a => { let cum = 0; return { a, style: attemptLineStyle(a, mocks), pts: [[0, 0]].concat(a.intervals.map((iv, i) => { cum += iv[0]; return [30 * (i + 1), cum]; })) }; });
  series.slice().sort((p, q) => p.style.width - q.style.width).forEach(sr => {
    svg.append(S('path', { d: sr.pts.map((p, j) => `${j ? 'L' : 'M'}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(''), fill: 'none', stroke: sr.style.color, 'stroke-width': sr.style.width, opacity: sr.style.opacity, 'stroke-linejoin': 'round' }));
    sr.pts.slice(1).forEach(p => svg.append(marker(sr.a.cohort, X(p[0]), Y(p[1]), 3.6, sr.style.color)));
  });
  const ends = series.map(sr => { const lp = sr.pts[sr.pts.length - 1]; return { x: X(lp[0]) + 9, y: Y(lp[1]) + 4, text: `${sr.a.short} · ${lp[1]}`, strong: sr.style.width >= 2.4 }; });
  spreadLabels(ends, 14, padT, Hh - padB).forEach(l => svg.append(txt(l.x, l.y, l.text, { class: 'halo', fill: l.strong ? 'var(--ink)' : 'var(--ink-2)', 'font-size': 11, 'font-weight': l.strong ? 600 : 500 })));
  const overlay = S('rect', { x: padL, y: padT, width: W - padL - padR, height: Hh - padT - padB, fill: 'transparent' });
  svg.append(overlay);
  const onMove = e => {
    const mn = clamp(Math.round((((localXY(svg, W, e)[0] - padL) / (W - padL - padR)) * maxMin) / 30) * 30, 30, maxMin), bi = mn / 30 - 1;
    tip.show(e.clientX, e.clientY, tipNodes(`By minute ${mn}`, `Block ${bi ? mn - 29 : 0}–${mn} min`, series.map(sr => {
      const iv = sr.a.intervals[bi];
      return { label: sr.a.short, color: sr.style.color, value: iv ? `${sr.pts[bi + 1][1]} done · block ${pct(iv[0] ? iv[1] / iv[0] : null, 0)} (${iv[1]}/${iv[0]})` : '—' };
    })));

  overlay.addEventListener('pointermove', onMove);
  overlay.addEventListener('pointerdown', onMove);
  overlay.addEventListener('pointerleave', () => tip.hide());

/* ── Accuracy and coverage side by side: two bars per attempt on one 0–100% axis ── */
function renderPairBars(host, cfg) {
  host.replaceChildren();
  const list = cfg.list, n = list.length;
  if (!n) return emptyChart(host, 'No attempts match these filters.');
  const W = Math.max(300, host.clientWidth), Hh = cfg.height || (W < 560 ? 230 : 260);

  const X = i => padL + step * i, Y = v => padT + (1 - clamp(v, 0, 1)) * plotH, base = Y(0);
  const svg = svgRoot(W, Hh, cfg.ariaLabel || 'Accuracy and coverage for each attempt');
  const undated = list.filter(a => !a.date).length;
  if (undated) svg.append(S('rect', { x: padL, y: padT, width: step * undated, height: plotH, rx: 6, fill: 'var(--fill)', opacity: 0.55 }));
  PCT_TICKS.forEach(t => {
    svg.append(S('line', { x1: padL, x2: W - padR, y1: Y(t), y2: Y(t), stroke: t === 0 ? 'var(--axis)' : 'var(--grid)' }));
    svg.append(txt(padL - 7, Y(t) + 3.5, pctTick(t), { 'text-anchor': 'end', 'font-size': 10.5 }));
  });
  if (state.prefs.guide) {
    targetLine(svg, padL, W - padR, TGT.band('acc'), Y);
    targetKey(svg, `Accuracy target ${TGT.value('acc')}`, W - padR, 14, 'end');
  }
  const bw = Math.min(22, Math.max(4, (step - 10) / 2)), gap = 2;
  /** Bar with a 4px rounded top, anchored square on the baseline. */
  const bar = (x, v, fill, extra = {}) => {
    const y = Y(v), h = base - y, r = Math.min(4, h, bw / 2);
    return S('path', Object.assign({ d: `M${x} ${base}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + bw - r}Q${x + bw} ${y} ${x + bw} ${y + r}V${base}Z`, fill }, extra));
  };
  list.forEach((a, i) => {
    const cx = X(i) + step / 2, x1 = cx - bw - gap / 2, x2 = cx + gap / 2, faint = COHORTS[a.cohort].hollow ? 0.55 : 1;
    if (a.m.cov != null) svg.append(bar(x1, a.m.cov, 'var(--bar-2)', { opacity: faint }));
    if (a.m.acc != null) svg.append(bar(x2, a.m.acc, 'var(--bar)', { opacity: faint }));
    const lab = txt(cx, base + 16, a.short, { 'text-anchor': rotate ? 'end' : 'middle', fill: 'var(--ink-2)', 'font-size': 10.5 });
    if (rotate) lab.setAttribute('transform', `rotate(-38 ${cx} ${base + 16})`);
    svg.append(lab, marker(a.cohort, rotate ? cx + 5 : cx, base + (rotate ? 7 : 26), 3.2));
  });
  // Selective direct labels: only the newest attempt's two bars carry their values.
  const li = n - 1, last = list[li], cx = X(li) + step / 2;
  if (step >= 36) {
    if (last.m.cov != null) svg.append(txt(cx - bw / 2 - gap / 2, Y(last.m.cov) - 5, pctWhole(last.m.cov), { class: 'halo', 'text-anchor': 'middle', fill: 'var(--ink-2)', 'font-size': 10.5 }));
    if (last.m.acc != null) svg.append(txt(cx + bw / 2 + gap / 2, Y(last.m.acc) - 5, pctWhole(last.m.acc), { class: 'halo', 'text-anchor': 'middle', fill: 'var(--ink)', 'font-size': 10.5, 'font-weight': 600 }));
  }
  const hl = S('rect', { y: padT, height: plotH, rx: 6, fill: 'var(--ink)', opacity: 0, 'pointer-events': 'none' });
  const overlay = S('rect', { x: padL, y: 0, width: W - padL - padR, height: Hh, fill: 'transparent' });
  svg.insertBefore(hl, svg.firstChild.nextSibling);
  svg.append(overlay);
  let cur = -1;
  const focus = (i, e) => {
    i = clamp(i, 0, n - 1); cur = i;
    const a = list[i];
    hl.setAttribute('x', X(i) + 2); hl.setAttribute('width', Math.max(0, step - 4)); hl.setAttribute('opacity', 0.05);
    const nodes = tipNodes(a.paper, `${a.cohortName} · ${a.when}`, [
      { label: 'Coverage', color: 'var(--bar-2)', value: `${pct(a.m.cov)} · ${a.m.att}/${a.M}` },
      { label: 'Accuracy', color: 'var(--bar)', value: `${pct(a.m.acc)} · ${a.C}/${a.m.att}` },
      { label: 'Score', value: `${pct(a.m.pct)} · ${marks(a.m.net)}/${a.M}` },
    ], a.date ? null : 'Undated: shown in the order it was recorded');
    if (e) tip.show(e.clientX, e.clientY, nodes);
    else { const r = svg.getBoundingClientRect(), k = r.width / W; tip.show(r.left + (X(i) + step / 2) * k, r.top + padT * k, nodes); }
  };
  const clear = () => { cur = -1; hl.setAttribute('opacity', 0); tip.hide(); };
  const idxAt = e => Math.floor((localXY(svg, W, e)[0] - padL) / step);
  overlay.addEventListener('pointermove', e => focus(idxAt(e), e));

  overlay.addEventListener('pointerleave', clear);

  host.onkeydown = e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); const d = e.key === 'ArrowRight' ? 1 : -1; focus(cur < 0 ? (d > 0 ? 0 : n - 1) : cur + d); }
    else if (e.key === 'Escape') clear();
  };
  host.onblur = clear;
  host.append(svg);
}

/** Small line for a stat tile: the same measure across one kind of attempt, newest point emphasised. */
function sparkline(vals, { w = 120, h = 30, color = 'var(--c-pyq)', label = '' } = {}) {
  const svg = S('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}`, class: 'spark', role: 'img', 'aria-label': label });
  const v = vals.filter(x => x != null && isFinite(x));
  if (v.length < 2) return null;
  let lo = Math.min(...v), hi = Math.max(...v);
  const pad = (hi - lo) * 0.15 || Math.abs(hi) * 0.1 || 1;
  lo -= pad; hi += pad;
  const X = i => 5 + (i / (v.length - 1)) * (w - 10), Y = x => h - 5 - ((x - lo) / (hi - lo)) * (h - 10);
  svg.append(S('path', { d: v.map((x, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(x).toFixed(1)}`).join(''), fill: 'none', stroke: color, 'stroke-width': 1.75, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  v.forEach((x, i) => { if (i < v.length - 1) svg.append(S('circle', { cx: X(i), cy: Y(x), r: 2.2, fill: color, opacity: 0.55 })); });
  const L = v.length - 1;
  svg.append(S('circle', { cx: X(L), cy: Y(v[L]), r: 5, fill: 'var(--surface-2)' }), S('circle', { cx: X(L), cy: Y(v[L]), r: 3.3, fill: color }));
  return svg;
}

function accMini(acc, w = 84, breakEven = 0.2) {

/** Section metrics shared by the Sections charts and their number tables. */
const SEC_METRICS = {

    naSec: (a, k) => { const m = secM(a, k); return m && m.exact && !m.att ? `not attempted (0 of ${m.M})` : 'not recorded'; },

    fmtSec: (a, k) => { const m = secM(a, k); return `${pct(m.pct, 1)} · ${marks(m.net)}/${m.M}`; },
    naSec: () => 'only section accuracy recorded',
    fmtAll: a => `${pct(a.m.pct, 1)} · ${marks(a.m.net)}/${a.M}`,
  },
  lost: {
    name: 'Marks lost per question', lo: 0, hi: 1.25, ticks: [0, 0.25, 0.5, 0.75, 1, 1.25], tick: v => v.toFixed(2), get target() { return TGT.band('lost'); }, get tLabel() { return TGT.label('lost'); },
    sec: (a, k) => { const m = secM(a, k); return m && m.exact && m.M ? m.lost / m.M : null; },
    all: a => a.m.gap / a.M,
    fmtSec: (a, k) => { const m = secM(a, k); return `${(m.lost / m.M).toFixed(2)} · ${m.W} wrong, ${m.S} blank`; },
    naSec: () => 'only section accuracy recorded',
    fmtAll: a => `${(a.m.gap / a.M).toFixed(2)} · ${a.W} wrong, ${a.S} blank`,
  },
  cov: {
    name: 'Coverage', lo: 0, hi: 1, ticks: PCT_TICKS, tick: pctTick, get target() { return TGT.band('cov'); }, get tLabel() { return TGT.label('cov'); },
    sec: (a, k) => { const m = secM(a, k); return m && m.exact && m.M ? m.cov : null; },
    all: a => a.m.cov,
    fmtSec: (a, k) => { const m = secM(a, k); return `${pct(m.cov, 0)} · ${m.att}/${m.M}`; },
    naSec: () => 'only section accuracy recorded',
    fmtAll: a => `${pct(a.m.cov, 1)} · ${a.m.att}/${a.M}`,
  },
};

/** Bar cell used by the number tables. Every section column shares one zero-based scale. */
function secCell(a, k, metric, compact = false) {
  const m = secM(a, k);
  if (!m) return barCell(null, '', { naText: '—', naTitle: 'Not recorded', compact });
  if (!m.exact) {
    if (metric !== 'acc') return barCell(null, '', { naText: '—', naTitle: 'Only section accuracy was recorded for this attempt', compact });
    return barCell(m.acc, pct(m.acc, 0), { compact, flag: !!m.flag, target: TGT.band('acc'), small: compact ? null : 'as recorded', title: m.flag ? 'These recorded section accuracies don’t reconcile with the attempt’s totals' : 'Section accuracy as recorded (no counts)' });
  }
  if (metric === 'acc') {
    if (!m.att) return barCell(null, '', { naText: 'n/a', naTitle: `Not attempted (0 of ${m.M})`, small: compact ? null : `0/${m.M}`, compact });
    return barCell(m.acc, pct(m.acc, 0), { compact, target: TGT.band('acc'), small: compact ? null : `${m.C}/${m.att}`, title: `${m.C} right of ${m.att} attempted · ${m.W} wrong · ${m.S} blank` });
  }
  if (metric === 'pct') return barCell(Math.max(0, m.pct), pct(m.pct, 0), { compact, target: TGT.band('pct'), small: `${marks(m.net)}/${m.M}` });
  if (metric === 'cov') return barCell(m.cov, pct(m.cov, 0), { compact, target: TGT.band('cov'), small: `${m.att}/${m.M}` });
  return barCell(m.M ? m.lost / m.M : null, m.M ? (m.lost / m.M).toFixed(2) : '—', { compact, max: 1.25, cost: true, target: TGT.band('lost'), small: `${marks(m.lost)} of ${m.M}`, title: `${m.W} wrong × 1.25 + ${m.S} blank` });
}
