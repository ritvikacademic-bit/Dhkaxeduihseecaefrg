/** Section metrics shared by the Sections charts and their number tables. */
const SEC_METRICS = {
  acc: {
    name: 'Accuracy', lo: 0, hi: 1, ticks: PCT_TICKS, tick: pctTick, get target() { return TGT.band('acc'); }, get tLabel() { return TGT.label('acc'); },
    sec: (a, k) => { const m = secM(a, k); return m && m.acc != null ? m.acc : null; },
    all: a => a.m.acc,
    fmtSec: (a, k) => { const m = secM(a, k); return !m ? '—' : !m.exact ? `${pct(m.acc, 0)} as recorded${m.flag ? ' ⚠' : ''}` : `${pct(m.acc, 1)} · ${m.C}/${m.att}`; },
    naSec: (a, k) => { const m = secM(a, k); return m && m.exact && !m.att ? `not attempted (0 of ${m.M})` : 'not recorded'; },
    fmtAll: a => `${pct(a.m.acc, 1)} · ${a.C}/${a.m.att}`,
  },
  pct: {
    name: 'Score %', lo: 0, hi: 1, ticks: PCT_TICKS, tick: pctTick, get target() { return TGT.band('pct'); }, get tLabel() { return TGT.label('pct'); },
    sec: (a, k) => { const m = secM(a, k); return m && m.exact && m.M ? m.pct : null; },
    all: a => a.m.pct,
    fmtSec: (a, k) => { const m = secM(a, k); return `${pct(m.pct, 1)} · ${marks(m.net)}/${m.M}`; },
    naSec: () => 'only section accuracy recorded',
    fmtAll: a => `${pct(a.m.pct, 1)} · ${marks(a.m.net)}/${a.M}`,
  },
  lost: {
    name: 'Marks lost per question', lo: 0, hi: 1.25, ticks: [0, 0.25, 0.5, 0.75, 1, 1.25], tick: v => v.toFixed(2), get target() { return TGT.band('lost'); }, get tLabel() { return TGT.label('lost'); },
    sec: (a, k) => { const m = secM(a, k); return m && m.exact && m.M ? m.lost / m.M : null; },
    all: a => a.m.gap / a.M,
    fmtSec: (a, k) => { const m = secM(a, k); return `${(m.lost / m.M).toFixed(2)} · ${m.W} wrong, ${m.S} blank`; },
    naSec: () => 'only section accuracy recorded',
    fmtAll: a => `${(a.m.gap / a.M).toFixed(2)} · ${a.W} wrong, ${a.S} blank`,
  },
  cov: {
    name: 'Coverage', lo: 0, hi: 1, ticks: PCT_TICKS, tick: pctTick, get target() { return TGT.band('cov'); }, get tLabel() { return TGT.label('cov'); },
    sec: (a, k) => { const m = secM(a, k); return m && m.exact && m.M ? m.cov : null; },
    all: a => a.m.cov,
    fmtSec: (a, k) => { const m = secM(a, k); return `${pct(m.cov, 0)} · ${m.att}/${m.M}`; },
    naSec: () => 'only section accuracy recorded',
    fmtAll: a => `${pct(a.m.cov, 1)} · ${a.m.att}/${a.M}`,
  },
};

/** Bar cell used by the number tables. Every section column shares one zero-based scale. */
function secCell(a, k, metric, compact = false) {
  const m = secM(a, k);
  if (!m) return barCell(null, '', { naText: '—', naTitle: 'Not recorded', compact });
  if (!m.exact) {
    if (metric !== 'acc') return barCell(null, '', { naText: '—', naTitle: 'Only section accuracy was recorded for this attempt', compact });
    return barCell(m.acc, pct(m.acc, 0), { compact, flag: !!m.flag, target: TGT.band('acc'), small: compact ? null : 'as recorded', title: m.flag ? 'These recorded section accuracies don’t reconcile with the attempt’s totals' : 'Section accuracy as recorded (no counts)' });
  }
  if (metric === 'acc') {
    if (!m.att) return barCell(null, '', { naText: 'n/a', naTitle: `Not attempted (0 of ${m.M})`, small: compact ? null : `0/${m.M}`, compact });
    return barCell(m.acc, pct(m.acc, 0), { compact, target: TGT.band('acc'), small: compact ? null : `${m.C}/${m.att}`, title: `${m.C} right of ${m.att} attempted · ${m.W} wrong · ${m.S} blank` });
  }
  if (metric === 'pct') return barCell(Math.max(0, m.pct), pct(m.pct, 0), { compact, target: TGT.band('pct'), small: `${marks(m.net)}/${m.M}` });
  if (metric === 'cov') return barCell(m.cov, pct(m.cov, 0), { compact, target: TGT.band('cov'), small: `${m.att}/${m.M}` });
  return barCell(m.M ? m.lost / m.M : null, m.M ? (m.lost / m.M).toFixed(2) : '—', { compact, max: 1.25, cost: true, target: TGT.band('lost'), small: `${marks(m.lost)} of ${m.M}`, title: `${m.W} wrong × 1.25 + ${m.S} blank` });
}

/* ────────────── Overview ────────────── */
/** A link to one attempt's own page, for the head of a view. */

    g ? H('div', { class: 'kpi', style: { marginTop: '14px', display: 'inline-block' } }, [H('div', { class: 'l', text: `Guiding light · ${TGT.value('pct')}` }), H('div', { class: 's', text: gapText('pct', L.m.pct) })]) : null,

    ]),
    note ? small(`Small lines show your ${note} in date order, ending at this attempt.`, { fontSize: '12px', marginTop: '-6px' }) : null,
    cmp,
  ]);
  return H('section', { class: 'card latest', 'aria-label': 'Latest attempt' }, [left, right]);

function buildInsights() {
  const A = state.attempts, out = [];
  const T = A.filter(a => a.cohort === 'pyq_t');
  if (T.length >= 2) {
    const gap = sum(T, a => a.m.gap), wc = sum(T, a => a.m.wrongCost);
    if (gap > 0) out.push({ tone: 'bad', icon: '×', parts: ['Wrong answers, not blanks, cost you most: ', b(pct(wc / gap, 0)), ` of the marks dropped across your ${T.length} timed PYQs (`, b(marks(wc)), ' of ', b(marks(gap)), '). Each wrong answer costs 1.25 marks: the mark you miss plus the 0.25 penalty.'] });

      out.push({ tone: 'warn', icon: '↓', parts: [b(lo.s.name), ' is your weakest section in timed PYQs: ', b(pct(lo.acc, 0)), ` accuracy (${lo.C} of ${lo.att}), losing `, b(lo.perQ.toFixed(2)), ' marks per question. ', b(hi.s.name), ' is strongest at ', b(pct(hi.acc, 0)), '.'] });

    // fall just because you started attempting questions you used to skip.

    const arrow = v => v.map(x => pct(x, 0)).join(' → ');
    const rows = SECS.map(s => {
      const ms = last3.map(a => secM(a, s.k));
      if (ms.some(m => !m || !m.exact || !m.M || m.acc == null)) return null;

      const t = rows.filter(r => r.scDir === dir).sort((p, q) => Math.abs(q.sc[2] - q.sc[0]) - Math.abs(p.sc[2] - p.sc[0]))[0];
      if (t) out.push({ tone: dir < 0 ? 'bad' : 'good', icon: dir < 0 ? '↘' : '↗', parts: [b(t.s.name), ` section score (net ÷ scorable) ${dir < 0 ? 'fell' : 'rose'} in each of your last three timed PYQs: `, b(arrow(t.sc)), ` (${who}; accuracy ${arrow(t.acc)}). These are different papers, so some of it may be paper difficulty.`] });
    });
    const masked = rows.filter(r => r.accDir !== 0 && r.scDir === 0 && r.covMoved).sort((p, q) => Math.abs(q.acc[2] - q.acc[0]) - Math.abs(p.acc[2] - p.acc[0]))[0];
    if (masked) out.push({ tone: '', icon: '≈', parts: [b(masked.s.name), ` accuracy ${masked.accDir < 0 ? 'fell' : 'rose'} across ${who} (`, b(arrow(masked.acc)), `), but that isn’t a steady ${masked.accDir < 0 ? 'decline' : 'improvement'}: you attempted `, b(arrow(masked.cov)), ' of its questions, and its section score (net ÷ scorable) went ', b(arrow(masked.sc)), '.'] });
  }
  const tagged = A.filter(a => { const gs = a.log ? guessStats(a) : null; return gs && !gs.none; });
  if (tagged.length) {
    const parts = ['A guess only adds marks above ', b('20%'), ' accuracy. '];
    tagged.slice(-2).forEach((a, i) => {
      const gs = guessStats(a);
      const worst = gs.groups.filter(x => x.att >= 3 && x.acc != null).sort((p, q) => p.acc - q.acc)[0];
      parts.push(`${i ? ' ' : ''}${a.short}: marked guesses were `, b(pct(gs.marked.acc, 0)), ` right (${gs.marked.C} of ${gs.marked.att}) vs `, b(pct(gs.unmarked.acc, 0)), ' unmarked');
      if (worst && worst.acc < 0.2) parts.push('; ', b(worst.tag), ' guesses hit only ', b(pct(worst.acc, 0)));
      parts.push('.');

    out.push({ tone: 'warn', icon: '?', parts });
  }
  const pairs = retakePairs();
  if (pairs.length) {
    const ds = pairs.map(p => ({ p, d: p.a1.m.pct - p.a0.m.pct }));
    const allUp = ds.every(x => x.d > 0);
    const parts = [allUp ? 'Every retake of a paper scored higher: ' : 'Retakes of the same paper: '];
    ds.forEach((x, i) => parts.push(i ? ', ' : '', `${x.p.paper} `, b(signedPts(x.d))));
    const untimedToTimed = pairs.every(p => p.a0.cohort === 'pyq_u' && p.a1.cohort === 'pyq_t');
    parts.push(untimedToTimed ? '. The first tries were untimed and the retakes timed, so this mixes months of practice with knowing the paper.' : '. Retakes mix practice with knowing the paper.');
    out.push({ tone: allUp ? 'good' : 'warn', icon: '↺', parts });

    const M = A.filter(a => a.cohort === 'mock_t');

      const qt = M.map(a => secM(a, 'qt')).filter(m => m && m.exact);

    }
    parts.push('.');
    out.push({ tone: '', icon: '◎', parts });

}

/** Which bar holds each kind of attempt back, in one sentence per kind (dated attempts only). */
function limiterText(list) {
  const parts = [];
  ['mock_t', 'pyq_t'].forEach(k => {
    const xs = list.filter(a => a.cohort === k && a.date && a.m.acc != null);
    if (xs.length < 2) return;
    const r = f => { const v = xs.map(f); return pctRange(Math.min(...v), Math.max(...v)); };
    const cov = sum(xs, a => a.m.cov) / xs.length, acc = sum(xs, a => a.m.acc) / xs.length;
    const limit = cov < acc - 0.05 ? 'coverage is the shorter bar, so attempting more would lift these scores fastest' : 'accuracy is the shorter bar, so getting more of the attempted questions right is what lifts these scores';
    parts.push(`${COHORTS[k].phrase[0].toUpperCase()}${COHORTS[k].phrase.slice(1)}s: coverage ${r(a => a.m.cov)}, accuracy ${r(a => a.m.acc)}; ${limit}.`);
  });
  return parts.length ? parts.join(' ') : 'Score % = coverage × (1.25 × accuracy − 0.25): both bars have to be tall for a high score.';

/* ────────────── Questions ────────────── */
/** Question papers live next to this file, one viewer per official paper (Set A: the set your answer keys match). */
const PAPER_DIR = 'Question papers/';
const PAPER_VIEWERS = { 2024: 'CLAT 2024 UG Set A.html', 2025: 'CLAT 2025 UG Set A.html', 2026: 'CLAT 2026 UG Set A.html' };
function paperViewer(a) {
  const y = (String(a.paper).match(/CLAT\D{0,6}(20\d\d)/i) || [])[1];
  return y && PAPER_VIEWERS[y] && a.log ? { file: PAPER_DIR + PAPER_VIEWERS[y], win: `clat-paper-${y}` } : null;
}
/** Open question n of attempt a in its paper. Each paper gets one named tab; later clicks on the same paper only
 *  change the address fragment, so that tab scrolls to the new question instead of a new tab opening. */
const canOpenPaper = a => !!(a && a.log);
/** Question n of attempt a, in NeoBook: the paper this attempt was sat on when
 *  NeoBook recorded it, found by its fingerprint or library id; otherwise
 *  NeoBook asks which PDF it is. */
function openInNeoBook(a, n) {
  const s = a.telemetrySessionId && NB.sessions ? NB.sessions.get(a.telemetrySessionId) : null;
  const src = (s && s.source) || {};
  const h = new URLSearchParams({ nbq: src.fp || '', b: src.bookId || '', n: String(n), name: a.paper || '' });
  const w = window.open('index.html#' + h.toString(), 'neobook-paper');
  if (w) { try { w.focus(); } catch (e) { /* best-effort */ } }
  else toast('The browser blocked the new tab. Allow pop-ups for this page, then click the question again.');
  return true;
}
function openQuestion(a, n) {
  /* a mock recorded in NeoBook opens on its own page, with your ink */
  const qc = qvCtxFor(a);
  if (qc) return qvOpen(qc, n);
  const v = paperViewer(a);
  if (!v) return canOpenPaper(a) ? openInNeoBook(a, n) : false;
  const h = new URLSearchParams({ q: String(n), n: `${a.short} · ${a.when}`, o: a.log.out, a: a.log.ans || '', t: JSON.stringify(a.log.tags || {}), r: String(Date.now() % 1e7) });
  const w = window.open(`${encodeURI(v.file)}#${h.toString()}`, v.win);
  if (w) { try { w.focus(); } catch (e) { /* focus is best-effort */ } }
  else toast('The browser blocked the new tab. Allow pop-ups for this file, then click the question again.');
  return true;
}
/* ────────────── One question, on its page ──────────────
   A mock recorded in NeoBook is shown on the paper it was sat on: the page as
   printed, your ink on it exactly where the pen put it (blue answers, red
   circles, crosses and working; erased strokes stay erased), a tick on the
   option the key gives and, when yours differs, a cross on yours. Under the
   page, the numbers for that one question.
   The PDF is read from this device's NeoBook library when it is there; on a
   device without it you choose the file once and it is kept for next time. */
const QV = { lib: null, docs: new Map(), data: new Map(), n: null };
const QV_INK = { blue: '#1f5fd6', red: '#d62828', other: '#6e6e73' };
function qvLoadPdfjs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (QV.lib) return QV.lib;
  QV.lib = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { const L = window.pdfjsLib; L.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(L); };
    s.onerror = () => { QV.lib = null; rej(new Error('the PDF renderer did not load — check the connection')); };
    document.head.append(s);
  });
  return QV.lib;
}
const qvReq = r => new Promise(res => { r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
/** NeoBook's own copy of the paper, if this device has one. Never creates the library. */
async function qvLibraryBytes(bookId) {
  if (!bookId || !indexedDB.databases) return null;
  try {
    const list = await indexedDB.databases();
    if (!list.some(d => d.name === 'lumen')) return null;
    const db = await qvReq(indexedDB.open('lumen'));
    if (!db) return null;
    if (!db.objectStoreNames.contains('kv')) { db.close(); return null; }
    const v = await qvReq(db.transaction('kv').objectStore('kv').get('bytes:' + bookId));
    db.close();
    return v || null;
  } catch (e) { return null; }
}
function qvCacheDB() {
  const r = indexedDB.open('clat-papers', 1);
  r.onupgradeneeded = () => { try { r.result.createObjectStore('pdf'); } catch (e) { /* exists */ } };
  return qvReq(r);
}
async function qvCacheGet(fp) { const db = await qvCacheDB(); if (!db) return null; const v = await qvReq(db.transaction('pdf').objectStore('pdf').get(fp)); db.close(); return v; }
async function qvCachePut(fp, buf) {
  const db = await qvCacheDB(); if (!db) return;
  await new Promise(res => { const t = db.transaction('pdf', 'readwrite'); t.objectStore('pdf').put(buf, fp); t.oncomplete = res; t.onerror = res; t.onabort = res; });
  db.close();
}
const qvU8 = v => v instanceof ArrayBuffer ? new Uint8Array(v) : ArrayBuffer.isView(v) ? new Uint8Array(v.buffer, v.byteOffset, v.byteLength) : null;
async function qvHash(u8) { const h = await crypto.subtle.digest('SHA-256', u8); return 'sha256:' + [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function qvDoc(sess) {
  const fp = (sess.source && sess.source.fp) || sess.id;
  if (QV.docs.has(fp)) return QV.docs.get(fp);
  const raw = (await qvLibraryBytes(sess.source && sess.source.bookId)) || (await qvCacheGet(fp));
  const u8 = raw && qvU8(raw);
  if (!u8) return null;
  const L = await qvLoadPdfjs();
  const doc = await L.getDocument({ data: u8.slice(), isEvalSupported: false }).promise;
  QV.docs.set(fp, doc);
  return doc;
}
/** Map and ink of one attempt, read once. */
async function qvData(sess) {
  if (QV.data.has(sess.id)) return QV.data.get(sess.id);
  const M = nbMock(), db = NB.db;
  const [map, events] = await Promise.all([db.resolveMap(sess), db.readEvents(sess.id)]);
  const byId = new Map((map ? map.questions : []).map(q => [q.id, q]));
  const strokes = M ? M.strokesOf(events || []).filter(s => s.removedAt == null) : [];
  const v = { map, byId, strokes };
  QV.data.set(sess.id, v);
  return v;
}
const qvOutcome = q => q.outcome === 'correct' ? 'c' : q.outcome === 'wrong' ? 'w' : q.outcome === 'skipped' ? 's' : 'x';
const qvPillText = q => q.outcome === 'correct' ? ['✓ Right', ` You ${q.finalAnswer} · Key ${q.officialAnswer}`]
  : q.outcome === 'wrong' ? ['✗ Wrong', ` You ${q.finalAnswer} · Key ${q.officialAnswer}`]
    : q.outcome === 'skipped' ? ['Blank', ` Key ${q.officialAnswer || '—'}`] : [OUTC[q.outcome] ? OUTC[q.outcome].label : 'No key', ''];

/** Ask for the paper's PDF, check it is the same file, keep it. */
function qvAskPdf(sess, name, done) {
  const inp = H('input', { type: 'file', accept: 'application/pdf,.pdf', style: { display: 'none' } });
  const msg = H('p', { class: 'muted', style: { margin: '0 0 14px' }, text: `${name || 'This paper'} is not on this device yet. Choose its PDF once — it stays here for next time, and nothing leaves this device.` });
  const btn = H('button', { class: 'btn primary', type: 'button', text: 'Choose PDF', onclick: () => inp.click() });
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    btn.disabled = true; btn.textContent = 'Reading…';
    try {
      const u8 = new Uint8Array(await f.arrayBuffer());
      const fp = (sess.source && sess.source.fp) || sess.id;
      const got = await qvHash(u8);
      await qvCachePut(fp, u8.buffer);
      if (fp.startsWith('sha256:') && got !== fp) toast('This PDF is not byte-for-byte the file the attempt was sat on, so ink may sit a little off.');
      done();
    } catch (e) { btn.disabled = false; btn.textContent = 'Choose PDF'; msg.textContent = 'Could not read that file: ' + (e && e.message ? e.message : e); }
  });
  return H('div', { class: 'qvask' }, [H('h3', { text: 'Open the paper' }), msg, btn, inp]);
}

/** Draw page `pageNo` with the question outlined, the ink, and the ticks. */
async function qvPaint(box, doc, data, q, mq) {
  const page = await doc.getPage(mq.page + 1);
  const vp1 = page.getViewport({ scale: 1 });
  const cssW = Math.max(280, box.clientWidth || 720), scale = cssW / vp1.width, dpr = Math.min(2, window.devicePixelRatio || 1);
  const vp = page.getViewport({ scale: scale * dpr });
  const cv = H('canvas', { class: 'qvcanvas', width: String(Math.round(vp.width)), height: String(Math.round(vp.height)) });
  cv.style.width = cssW + 'px'; cv.style.height = Math.round(vp1.height * scale) + 'px';
  await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  const W = vp1.width, Hh = vp1.height;
  const svg = S('svg', { class: 'qvink', viewBox: `0 0 ${W} ${Hh}`, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
  const r = mq.rect, pad = 5, oc = qvOutcome(q);
  svg.append(S('rect', { x: r.x - pad, y: r.y - pad, width: r.w + pad * 2, height: r.h + pad * 2, rx: 6, class: `qvq ${oc}` }));
  for (const st of data.strokes) {
    if (st.page !== mq.page || !st.pts.length) continue;
    const d = st.pts.length === 1 ? `M${st.pts[0][0]} ${st.pts[0][1]}h0.1` : st.pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join('');
    svg.append(S('path', { d, fill: 'none', stroke: QV_INK[st.ink] || QV_INK.other, 'stroke-width': 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.92 }));
  }
  const mark = (L, kind) => {
    const o = mq.options && mq.options[L];
    if (!o || o.page !== mq.page) return;
    const lb = o.label || o.region, cx = lb.x - 11, cy = lb.y + lb.h / 2;
    const g = S('g', { class: `qvmark ${kind}` });
    g.append(S('circle', { cx, cy, r: 7 }));
    g.append(S('path', { d: kind === 'ok' ? `M${cx - 3.4} ${cy + 0.2}l2.3 2.4l4.6 -5` : `M${cx - 2.8} ${cy - 2.8}l5.6 5.6M${cx + 2.8} ${cy - 2.8}l-5.6 5.6` }));
    svg.append(g);
  };
  const key = q.officialAnswer, you = q.finalAnswer;
  if (key && mq.options && mq.options[key]) mark(key, 'ok');
  if (you && you !== key) mark(you, 'no');
  const frame = H('div', { class: 'qvpage' }, [cv, svg]);
  box.replaceChildren(frame);
  // bring the question into view inside the page box
  const top = (r.y - 40) * scale;
  box.scrollTop = Math.max(0, top);
}

/** The numbers for one question, laid out beside its page instead of a table row. */
function qvStats(q, c) {
  const pas = q.passageId ? (c.d.passages || []).find(p => p.passageId === q.passageId) : null;
  const cell = (k, v, note) => H('div', { class: 'qvstat' }, [H('span', { text: k }), H('b', { text: v == null || v === '' ? '—' : String(v) }), note ? H('small', { text: note }) : null]);
  const guess = q.guessKind && q.guessKind !== 'none' ? (q.guessKind === 'educated' ? 'Educated guess' : q.guessKind === 'random' ? 'Random guess' : 'Ringed, word unread') : null;
  return H('div', { class: 'qvstats' }, [
    H('div', { class: 'qvgrid' }, [
      cell('Time', msTxt(q.totalActiveTimeMs), q.initialActiveTimeMs != null && q.revisitCount ? `${msTxt(q.initialActiveTimeMs)} first visit` : null),
      cell('To first lock', msTxt(q.initialDecisionTimeMs)),
      cell('Final two', q.finalTwoOptions ? `${q.finalTwoOptions.join(' / ')} · ${msTxt(q.finalTwoDurationMs)}` : null),
      cell('Passage lookups', pas ? `${msTxt(q.passageLookupTimeMs)} · ${q.passageRevisitCount}×` : null, pas ? `Passage ${pas.label || ''}`.trim() : null),
      cell('Visits', q.visitCount),
      cell('Changes', q.answerChangeCount || null),
      cell('Crossed out', (q.eliminatedOptions || []).length ? q.eliminatedOptions.join(', ') : null),
      cell('Marks', q.marks == null ? null : marks(q.marks)),
    ]),
    H('div', { class: 'qvmeta' }, [
      H('span', { class: 'muted', text: 'Answers in order ' }), avHistory(q),
      guess ? H('span', { class: 'avchip', text: guess }) : null,
      q.answerSetByYou ? H('span', { class: 'avchip', text: 'Set by you' }) : null,
      q.highFriction ? avSignals(q) : null,
    ]),
  ]);
}

/** The viewer itself: bar, section strip, page, numbers. `onClose` makes it an overlay. */
function qvView(c, n0, onClose) {
  const qs = c.qs.slice().sort((p, q) => p.position - q.position);
  let n = qs.some(q => q.displayedQuestionNumber === n0) ? n0 : (qs[0] && qs[0].displayedQuestionNumber);
  const root = H('div', { class: 'qv' + (onClose ? ' over' : '') });
  const pageBox = H('div', { class: 'qvbox' });
  const statsBox = H('div');
  const bar = H('div', { class: 'qvbar' });
  const strip = H('div', { class: 'qvstrip' });
  let ticket = 0;
  const go = m => { if (qs.some(q => q.displayedQuestionNumber === m)) { n = m; QV.n = m; draw(); } };
  const step = d => { const i = qs.findIndex(q => q.displayedQuestionNumber === n); const nx = qs[i + d]; if (nx) go(nx.displayedQuestionNumber); };
  const draw = async () => {
    const my = ++ticket;
    const q = qs.find(x => x.displayedQuestionNumber === n);
    if (!q) return;
    const [pill, sub] = qvPillText(q);
    bar.replaceChildren(
      H('div', { class: 'qvtitle' }, [H('b', { text: c.a ? c.a.paper : 'Attempt' }), H('small', { text: c.a ? `${c.a.cohortName} · ${c.a.when}` : '' })]),
      H('div', { class: 'qvnav' }, [
        H('button', { class: 'nb', type: 'button', 'aria-label': 'Previous question', text: '‹', onclick: () => step(-1) }),
        H('div', { class: 'qvid' }, [H('b', { text: `Q${n}` }), H('small', { text: SEC_NAME[q.sectionId] || '' })]),
        H('button', { class: 'nb', type: 'button', 'aria-label': 'Next question', text: '›', onclick: () => step(1) }),
      ]),
      H('span', { class: `qvres ${qvOutcome(q)}` }, [H('b', { text: pill }), H('span', { text: sub })]),
      ...(onClose ? [H('button', { class: 'btn', type: 'button', text: 'Close', onclick: onClose })] : []),
    );
    const secs = SECS.filter(s => qs.some(x => x.sectionId === s.k));
    strip.replaceChildren(
      H('div', { class: 'qvsecs' }, secs.map(s => H('button', { class: 'tchip', type: 'button', 'aria-pressed': String(s.k === q.sectionId), text: s.short || s.name, onclick: () => { const f = qs.find(x => x.sectionId === s.k); if (f) go(f.displayedQuestionNumber); } }))),
      H('div', { class: 'qvsq' }, qs.filter(x => x.sectionId === q.sectionId).map(x => H('button', {
        type: 'button', class: `${qvOutcome(x)}${x.displayedQuestionNumber === n ? ' on' : ''}${x.guessKind && x.guessKind !== 'none' ? ' t' : ''}`,
        title: `Q${x.displayedQuestionNumber} · ${(OUTC[x.outcome] || OUTC.unkeyed).label}`, 'aria-label': `Question ${x.displayedQuestionNumber}`, onclick: () => go(x.displayedQuestionNumber),
      }))),
    );
    statsBox.replaceChildren(qvStats(q, c));
    if (!c.sess) { pageBox.replaceChildren(H('p', { class: 'muted', text: 'This attempt has no page to show.' })); return; }
    if (!pageBox.firstChild || !pageBox.querySelector('.qvpage')) pageBox.replaceChildren(H('p', { class: 'muted qvwait', text: 'Opening the page…' }));
    try {
      const [doc, data] = await Promise.all([qvDoc(c.sess), qvData(c.sess)]);
      if (my !== ticket) return;
      if (!doc) { pageBox.replaceChildren(qvAskPdf(c.sess, c.a ? c.a.paper : '', () => draw())); return; }
      const mq = data.byId.get(q.questionId);
      if (!mq) { pageBox.replaceChildren(H('p', { class: 'muted', text: `Q${n} is not on this attempt's map of the paper.` })); return; }
      await qvPaint(pageBox, doc, data, q, mq);
    } catch (e) {
      console.error(e);
      if (my === ticket) pageBox.replaceChildren(H('p', { class: 'muted', text: 'Could not draw the page: ' + (e && e.message ? e.message : e) }));
    }
  };
  root.addEventListener('keydown', e => {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
    else if (e.key === 'Escape' && onClose) onClose();
  });
  root.tabIndex = -1;
  root.append(H('div', { class: 'qvhead' }, [bar, strip]), pageBox, statsBox);
  /* a timer, not an animation frame: a tab in the background never runs those */
  setTimeout(draw, 0);
  return root;
}

/** Heatmap squares and question links on a recorded mock open here. */
function qvCtxFor(a) {
  const id = a && a.telemetrySessionId;
  const d = id && NB.bundles ? NB.bundles.get(id) : null;
  const sess = id && NB.sessions ? NB.sessions.get(id) : null;
  if (!d || !sess || d.target !== 'attempt') return null;
  return { d, a, full: true, t: d.test, qs: d.questions, sess };
}
function qvOpen(c, n) {
  const prev = document.activeElement;
  let view = null;
  const close = () => { view.remove(); document.documentElement.classList.remove('qvlock'); if (prev && prev.focus) prev.focus(); };
  view = qvView(c, n, close);
  document.documentElement.classList.add('qvlock');
  document.body.append(view);
  view.focus();
  return true;
}

function renderQuestions(el) {
  const L = state.attempts.filter(a => a.log);

  }
  fill(el,
    viewHead('Questions', `Every question from ${plural(L.length, 'attempt')} with an answer-key log: ${listText(L.map(a => `${a.paper} (${a.when})`))}.`),
    runCard(L),
    optionDonutCard(L),
    qmapCard(L),
    H('div', { class: 'grid-2' }, [guessCard(L), optionsCard(L)]),

function runCard(L) {

/* ── the option doughnut ────────────────────────────────────────────────────
   Two rings on the same angles: the outer one is how often each option was
   picked, the inner one splits that wedge into the times it was right and the
   times it was wrong. The base is attempted questions — a blank has no option
   to count — and the middle says how many that is. */
const OPT_COLOR = { A: 'var(--opt-a)', B: 'var(--opt-b)', C: 'var(--opt-c)', D: 'var(--opt-d)' };

function arcPath(cx, cy, r0, r1, a0, a1) {
  const p = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const big = a1 - a0 > Math.PI ? 1 : 0;
  const [x0, y0] = p(r1, a0), [x1, y1] = p(r1, a1), [x2, y2] = p(r0, a1), [x3, y3] = p(r0, a0);
  return `M${x0} ${y0}A${r1} ${r1} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${big} 0 ${x3} ${y3}Z`;
}

function renderDonut(host, mix) {
  const W = Math.max(200, host.clientWidth || 260), size = Math.min(W, 260);
  const cx = size / 2, cy = size / 2, R = size / 2 - 4;
  const svg = svgRoot(size, size, 'How often each option was picked, and how often it was right');
  svg.style.display = 'block';
  svg.style.margin = '0 auto';
  const total = mix.rows.reduce((n, r) => n + r.picked, 0);
  if (!total) { host.replaceChildren(H('div', { class: 'empty', text: 'No attempted questions yet.' })); return; }

  const TAU = Math.PI * 2, GAP = 0.012;
  let a = -Math.PI / 2;
  const g = S('g', {});
  mix.rows.forEach(r => {
    if (!r.picked) return;
    const span = (r.picked / total) * TAU;
    const a0 = a + GAP / 2, a1 = a + span - GAP / 2;
    if (a1 > a0) {
      const outer = S('path', { d: arcPath(cx, cy, R * 0.66, R, a0, a1), fill: OPT_COLOR[r.option], class: 'dseg' });
      outer.append(S('title', {}, `${r.option}: ${Math.round((r.picked / total) * 100)}% of what you picked (${r.picked} of ${total})`));
      g.append(outer);
      /* inner: right first, then wrong, on the same wedge */
      const cut = a0 + (a1 - a0) * (r.picked ? r.right / r.picked : 0);
      if (cut > a0) {
        const good = S('path', { d: arcPath(cx, cy, R * 0.44, R * 0.62, a0, cut), fill: 'var(--good)', opacity: 0.85, class: 'dseg' });
        good.append(S('title', {}, `${r.option} right: ${r.right}`));
        g.append(good);
      }
      if (a1 > cut) {
        const bad = S('path', { d: arcPath(cx, cy, R * 0.44, R * 0.62, cut, a1), fill: 'var(--bad)', opacity: 0.8, class: 'dseg' });
        bad.append(S('title', {}, `${r.option} wrong: ${r.wrong}`));
        g.append(bad);
      }
      /* the letter, on its own wedge, when there is room for it */
      if (a1 - a0 > 0.28) {
        const mid = (a0 + a1) / 2, lr = R * 0.83;
        g.append(S('text', { x: cx + lr * Math.cos(mid), y: cy + lr * Math.sin(mid), class: 'dlabel', 'text-anchor': 'middle', 'dominant-baseline': 'central' }, r.option));
      }
    }
    a += span;
  });
  svg.append(g);
  const right = mix.rows.reduce((n, r) => n + r.right, 0);
  svg.append(S('text', { x: cx, y: cy - 8, class: 'dmid', 'text-anchor': 'middle' }, String(total)));
  svg.append(S('text', { x: cx, y: cy + 10, class: 'dsub', 'text-anchor': 'middle' }, 'attempted'));
  svg.append(S('text', { x: cx, y: cy + 26, class: 'dsub', 'text-anchor': 'middle' }, `${pct(total ? right / total : null, 0)} right`));
  host.replaceChildren(svg);
}

function optionDonutCard(L) {
  const mix = optionMix(L);
  const host = H('div', { class: 'chart donut' });
  mountChart(host, () => renderDonut(host, mix));
  const total = mix.n;
  const table = H('div', { class: 'table-wrap' }, H('table', { class: 'tbl' }, [
    H('thead', {}, H('tr', {}, [
      H('th', { class: 'l', text: 'Option' }), H('th', { class: 'c', text: 'Picked' }), H('th', { class: 'c', text: 'Share' }),
      H('th', { class: 'c', text: 'Right' }), H('th', { class: 'c', text: 'Wrong' }), H('th', { class: 'c', text: 'Accuracy' }),
      H('th', { class: 'c', text: 'In the key' }),
    ])),
    H('tbody', {}, mix.rows.map(r => H('tr', {}, [
      H('td', { class: 'l' }, [H('i', { class: 'sw', style: { background: OPT_COLOR[r.option] } }), b(r.option)]),
      H('td', { class: 'c num', text: String(r.picked) }),
      H('td', { class: 'c num', text: pct(r.share, 1) }),
      H('td', { class: 'c num', text: String(r.right) }),
      H('td', { class: 'c num', text: String(r.wrong) }),
      H('td', { class: 'c' }, [H('span', { class: r.accuracy != null && r.accuracy < 0.5 ? 'tag warn' : 'num', text: pct(r.accuracy, 0) })]),
      H('td', { class: 'c num', text: pct(r.keyShare, 1), title: `${r.inKey} of ${total} keys` }),
    ]))),
  ]));
  return card('What you pick, and how it goes',
    `Every option you marked across ${listText(mix.attempts)}, out of ${total} attempted questions. The outer ring is how often you picked each letter; the inner ring splits that into right and wrong. A blank or a withdrawn question has no option, so it is not counted here.`,
    [H('div', { class: 'donutwrap' }, [host, table])],
    { foot: 'A letter you pick far more often than the key uses it is a habit, not a pattern in the paper.' });
}

/* EXPORT:BEGIN — pure, DOM-free, checked in node by test/dashboard-export.test.mjs */
/* ═══════════════════════════ Analysis export ═══════════════════════════
   One file holding every number this dashboard shows, in the order it shows
   them, so another reader — a person or a model — can work from exactly what
   is on screen. Every figure comes from the same accessors the panes use
   (metrics, secM, decodeLog, optionStats, guessStats), never from a second
   calculation that could drift away from them.

   `st` is the dashboard state and `bundles` the NeoBook telemetry by session
   id, both passed in rather than read from the module, so the whole thing can
   be checked outside a browser. */

const EXPORT_VERSION = 1;

/** A change between two readings, with both ways of saying it. */
function deltaOf(before, after, kind) {
  if (before == null || after == null || !isFinite(before) || !isFinite(after)) return null;
  const d = after - before;
  const out = { before: r4(before), after: r4(after), direction: d > 0 ? 'up' : d < 0 ? 'down' : 'flat' };
  if (kind === 'ratio') {
    out.deltaPoints = r4(d * 100);                       /* 0.52 → 0.65 is +13 points */
    out.deltaRelative = before ? r4(d / before) : null;  /* … and +25% of what it was */
    out.units = { deltaPoints: 'percentage points', deltaRelative: 'fraction of the earlier value' };
  } else {
    out.delta = r4(d);
    out.deltaRelative = before ? r4(d / before) : null;
    out.units = { delta: kind === 'marks' ? 'marks' : 'questions', deltaRelative: 'fraction of the earlier value' };
  }
  return out;
}
const r4 = v => (v == null || !isFinite(v) ? null : Math.round(v * 10000) / 10000);
const r2 = v => (v == null || !isFinite(v) ? null : Math.round(v * 100) / 100);

/** Every option picked across a set of attempts: the doughnut's own numbers. */
function optionMix(list) {
  const L = ['A', 'B', 'C', 'D'];
  const rows = L.map(o => ({ option: o, picked: 0, right: 0, wrong: 0, inKey: 0 }));
  const from = [];
  let n = 0;
  for (const a of list) {
    const qs = decodeLog(a);
    if (!qs) continue;
    from.push(a);
    for (const q of qs) {
      if (q.out !== 'c' && q.out !== 'w') continue;
      n++;
      const pick = rows.find(r => r.option === q.ans);
      if (pick) { pick.picked++; if (q.out === 'c') pick.right++; else pick.wrong++; }
      const key = rows.find(r => r.option === q.key);
      if (key) key.inKey++;
    }
  }
  return {
    base: 'attempted questions (a blank or a withdrawn question has no option to count)',
    n, attempts: from.map(a => a.short),
    rows: rows.map(r => Object.assign(r, {
      share: n ? r4(r.picked / n) : null,
      keyShare: n ? r4(r.inKey / n) : null,
      bias: r.picked - r.inKey,
      accuracy: r.picked ? r4(r.right / r.picked) : null,
    })),
  };
}

function buildAnalysisExport(st, bundles) {
  const now = new Date();
  /* the dashboard's own order — undated papers first, then by date — so the
     file lines up with every chart in it rather than with a second idea of order */
  const attempts = (st.attempts || []).slice();
  const practice = (st.practice || []).slice();
  const withLog = attempts.filter(a => a.log);

  const secRows = a => SECS.map(s => {
    const m = secM(a, s.k);
    if (!m) return null;
    const row = { section: s.k, name: s.name, exact: !!m.exact, accuracy: r4(m.acc) };

      questions: m.M, attempted: m.att, correct: m.C, wrong: m.W, blank: m.S, withdrawn: m.x,
      score: r2(m.net), coverage: r4(m.cov),
      marksLost: { wrong: r2(m.wrongCost), blank: r2(m.skipCost), total: r2(m.lost) },
      timeSec: m.t == null ? null : m.t,
      questionRange: m.q || null,

    const tq = d && d.questions ? new Map(d.questions.map(q => [q.displayedQuestionNumber, q])) : null;

      const row = {
        position: q.q, section: q.sec, sectionName: q.sec ? SEC_NAME[q.sec] : null,
        key: q.key, answer: q.ans, outcome: OUT[q.out] || q.out,
        marks: q.out === 'c' ? 1 : q.out === 'w' ? -0.25 : 0,

        totalActiveTimeMs: t.totalActiveTimeMs, initialActiveTimeMs: t.initialActiveTimeMs,

        firstAnswer: t.firstAnswer, finalAnswer: t.finalAnswer, answerChanges: t.answerChangeCount,
        changeType: t.changeType, marksEffectOfChange: t.marksEffectOfChange,
        eliminated: t.eliminatedOptions, finalTwo: t.finalTwoOptions, finalTwoMs: t.finalTwoDurationMs,
        redStrokes: t.redStrokeCount, blueLocks: t.blueLockCount,

  };

  const attemptRow = a => {
    const m = metrics(a), g = guessStats(a), o = optionStats(a);
    const d = a.telemetrySessionId && bundles ? bundles.get(a.telemetrySessionId) : null;
    const row = {
      id: a.id, paper: a.paper, set: a.set || null, short: a.short,
      date: a.date || null, dateText: a.when, cohort: a.cohort, cohortName: a.cohortName,
      origin: a.origin || null, sectionOrder: a.order || null,
      has: {
        questionLog: !!a.log, sectionCounts: a.secMode === 'counts', sectionAccuracyOnly: a.secMode === 'acc',
        intervals: !!(a.intervals && a.intervals.length), topics: !!(a.tree || a.topics), telemetry: !!d,
      },
      totals: {

        correct: a.C, wrong: a.W, blank: a.S, withdrawn: (a.withdrawn || []).length,
        attempted: m.att, score: r2(m.net), scoreOutOf: a.M,

        marksLost: { wrong: r2(m.wrongCost), blank: r2(m.skipCost), total: r2(m.gap) },
      },
      withdrawnQuestions: a.withdrawn || null,
      timeSec: a.timeSec == null ? null : a.timeSec,
      notes: a.notes || null,
      sections: secRows(a),
    };
    if (a.intervals && a.intervals.length) row.intervals = a.intervals.map((iv, i) => ({

    }));
    if (o) row.options = {
      base: 'attempted questions', attempted: o.n,
      rows: o.rows.map(r => ({ option: r.o, picked: r.picked, share: o.n ? r4(r.picked / o.n) : null, inKey: r.inKey, bias: r.bias, right: r.right, wrong: r.picked - r.right, accuracy: r4(r.acc) })),

    };

      sessionId: a.telemetrySessionId, metricsVersion: d.metricsVersion || null,
      timing: d.test && d.test.timing ? d.test.timing : null,
      passages: d.passages ? d.passages.length : null,

  const rows = attempts.map(attemptRow);

  /* a timeline needs dates: an undated paper is in the file, but not in a trend */
  const series = rows.filter(r => r.totals.scorable && r.date);
  const step = (get, kind) => {

    for (let i = 1; i < series.length; i++) {

      if (d) out.push(Object.assign({ from: series[i - 1].short, to: series[i].short, fromDate: series[i - 1].date, toDate: series[i].date }, d));

    accuracy: { stepByStep: step(r => r.totals.accuracy, 'ratio'), firstToLast: span(r => r.totals.accuracy, 'ratio') },
    coverage: { stepByStep: step(r => r.totals.coverage, 'ratio'), firstToLast: span(r => r.totals.coverage, 'ratio') },
    attempted: { stepByStep: step(r => r.totals.attempted, 'count'), firstToLast: span(r => r.totals.attempted, 'count') },

      return [s.k, { name: s.name, questions: c.n, correct: c.C, wrong: c.W, blank: c.S, accuracy: r4(c.acc) }];
    })),
    marks: (() => {

  const charts = {
    note: 'Each chart as its own data. x is the attempt (or block) in the same order the chart draws it.',
    scoreOverAttempts: { x: series.map(r => r.short), y: series.map(r => r.totals.score), units: 'marks' },
    accuracyOverAttempts: { x: series.map(r => r.short), y: series.map(r => r.totals.accuracy), units: 'fraction 0-1' },
    coverageOverAttempts: { x: series.map(r => r.short), y: series.map(r => r.totals.coverage), units: 'fraction 0-1' },
    sectionAccuracy: { x: series.map(r => r.short), series: SECS.map(s => ({ key: s.k, name: s.name, y: series.map(secAcc(s.k)) })), units: 'fraction 0-1' },

    paceByHalfHour: rows.filter(r => r.intervals).map(r => ({ attempt: r.short, blocks: r.intervals })),
    optionMix: { labels: mix.rows.map(r => r.option), picked: mix.rows.map(r => r.picked), share: mix.rows.map(r => r.share), accuracy: mix.rows.map(r => r.accuracy) },

    practice: practice.map(p => ({ date: p.date || null, section: p.sec || p.section || null, topic: p.topic || null,

      blank: p.S != null ? p.S : null, timeSec: p.timeSec != null ? p.timeSec : null, source: p.telemetrySessionId ? 'neobook' : 'entered' })),

        const T = NBCore.topics, d = TPX.data;
        const nodes = [...d.A.nodes.values()].filter(s => s.n > 0).map(s => ({
          id: s.id, name: s.name, level: s.level, parent: s.parent, facet: s.facet, seen: s.n, correct: s.C, wrong: s.W, blank: s.S,

const STEP_COLOR = { read: 'var(--ord-1)', question: 'var(--ord-2)', revisit: 'var(--ord-3)', lookup: 'var(--bar-2)', reread: 'color-mix(in oklab,var(--bar-2) 45%,var(--surface))', transition: 'var(--fill-2)', idle: 'var(--bar-cost)', background: 'var(--ink-3)' };

/** Every attempt that can be opened: NeoBook's first (they have the most to say), newest first. */
function avChoices() {
  const nb = [], other = [];
  state.attempts.forEach(a => {
    const d = a.telemetrySessionId ? NB.bundles.get(a.telemetrySessionId) : null;
    (d ? nb : other).push({ id: d ? a.telemetrySessionId : a.id, label: `${a.paper}${a.set ? ` · ${a.set}` : ''} · ${a.when}`, date: a.date || '', at: a.addedAt || 0, a, d });
  });
  state.practice.forEach(p => {
    const d = p.telemetrySessionId ? NB.bundles.get(p.telemetrySessionId) : null;
    if (d) nb.push({ id: p.telemetrySessionId, label: `${p.name} · ${p.date ? fmtDate(p.date) : 'Undated'} · practice`, date: p.date || '', at: p.addedAt || 0, p, d });
  });
  const newest = (x, y) => (y.date > x.date ? 1 : y.date < x.date ? -1 : (y.at || 0) - (x.at || 0));

/** Open the Attempt view on one attempt (by NeoBook session id or dashboard id). */

/** The Remove button for one attempt, where one belongs. */

/* ── Check these: what the pen could not settle, settled by you ──────────────
   A blue mark across two options, a blue mark on no option, a question left
   blank that you did answer, a ringed number whose word was not read. Each
   choice is only held here until Save; then it is kept on the attempt (and
   travels with it), the attempt is scored again once, and every view updates. */
const AVC = { id: null, answers: {}, guesses: {}, extra: [], stray: null };
function avcReset(id) { if (AVC.id !== id) { AVC.id = id; AVC.answers = {}; AVC.guesses = {}; AVC.extra = []; AVC.stray = null; } }
async function avcStray(ctx) {
  /* blue marks that touched no option, each set against the question it sits nearest */
  const M = nbMock(), db = NB.db, s = ctx.sess;
  if (!M || !db || !s) return [];
  const [events, map] = await Promise.all([db.readEvents(s.id), db.resolveMap(s)]);
  if (!map) return [];
  const ink = M.deriveAnswers(events, map), strokes = M.strokesOf(events);
  const byId = new Map(strokes.map(x => [x.id, x]));
  const out = [];
  for (const u of ink.unassignedBlue) {
    const st = byId.get(u.strokeId);
    if (!st) continue;
    const cx = st.bbox[0] + st.bbox[2] / 2, cy = st.bbox[1] + st.bbox[3] / 2;
    let best = null, bd = Infinity;
    for (const q of map.questions) {
      if (q.page !== st.page) continue;
      const r = q.rect, dx = cx < r.x ? r.x - cx : cx > r.x + r.w ? cx - r.x - r.w : 0, dy = cy < r.y ? r.y - cy : cy > r.y + r.h ? cy - r.y - r.h : 0;
      const dd = Math.hypot(dx, dy);
      if (dd < bd) { bd = dd; best = q; }
    }
    if (best) out.push({ qid: best.id, n: best.n, page: st.page });
  }
  /* questions where the paper did not show every option letter for certain:
     one missing, or matched to a letter out of line with the others (an
     option placed in a clean gap between its neighbours, conf 0.6, is sure
     enough not to ask about) */
  out.shaky = map.questions.filter(q => {
    const o = q.options || {};
    return ['A', 'B', 'C', 'D'].some(L => !o[L] || (o[L].conf != null && o[L].conf < 0.9 && o[L].conf !== 0.6));
  }).map(q => ({ qid: q.id, n: q.n, missing: ['A', 'B', 'C', 'D'].filter(L => !(q.options || {})[L]), guessed: ['A', 'B', 'C', 'D'].filter(L => (q.options || {})[L] && q.options[L].conf != null && q.options[L].conf < 0.9 && q.options[L].conf !== 0.6) }));
  return out;
}
/** What NeoBook checked when it read this attempt's answer key: the entries
 *  against the paper's questions, the numbering, gaps, repeats, letters, set. */
function avKeyChecksCard(ctx) {
  if (!ctx.sess || !NB.db) return null;
  const list = H('ul', { class: 'avnotes' }, [H('li', { class: 'muted', text: 'Reading the key…' })]);
  const sub = H('span', { text: 'What was checked when the key was read.' });
  NB.db.getKey(ctx.sess.id).then(k => {
    const checks = (k && k.checks) || [];
    if (k && k.source) sub.textContent = `Read from ${k.source.name || k.source.kind}${k.parsedAt ? ' on ' + fmtDate(new Date(k.parsedAt - new Date(k.parsedAt).getTimezoneOffset() * 60000).toISOString().slice(0, 10)) : ''}; what was checked against the paper.`;
    list.replaceChildren(...(checks.length ? checks.map(x => H('li', { text: (x.ok ? '✓ ' : '! ') + x.detail })) : [H('li', { class: 'muted', text: k ? 'This key was saved before its checks were kept.' : 'No key is saved with this attempt.' })]));
  }).catch(() => list.replaceChildren(H('li', { class: 'muted', text: 'The key could not be read.' })));
  return card('The answer key', null, [H('p', { class: 'muted' }, [sub]), list]);
}
function avCheckCard(ctx) {
  if (!ctx.sess || !ctx.full) return null;
  avcReset(ctx.sess.id);
  const qs = ctx.qs, ov = ctx.sess.overrides || {};
  const setA = ov.answers || {}, setG = ov.guesses || {};
  const byN = n => qs.find(q => q.displayedQuestionNumber === n);
  const amb = qs.filter(q => q.ambiguousFinal);
  const blanks = qs.filter(q => q.outcome === 'skipped');
  const unread = qs.filter(q => q.guessKind === 'unknown');
  const mine = qs.filter(q => q.answerSetByYou || setG[q.questionId]);
  const pending = () => Object.keys(AVC.answers).length + Object.keys(AVC.guesses).length;

  const saveBtn = H('button', { class: 'btn primary', type: 'button' });
  const status = H('small', { class: 'muted' });
  const paint = () => { const n = pending(); saveBtn.textContent = n ? `Save ${n} change${n === 1 ? '' : 's'}` : 'Nothing changed yet'; saveBtn.disabled = !n; };

  const pickRow = (q, kind, why) => {
    const id = q.questionId;
    const choices = kind === 'guess' ? [['educated', 'Educated'], ['random', 'Random'], ['none', 'Not a guess']] : [['A', 'A'], ['B', 'B'], ['C', 'C'], ['D', 'D'], ['-', 'Blank']];
    const held = kind === 'guess' ? AVC.guesses : AVC.answers;
    const now = held[id] !== undefined ? held[id] : kind === 'guess' ? (setG[id] || (q.guessKind && q.guessKind !== 'unknown' ? q.guessKind : null)) : (setA[id] !== undefined ? setA[id] : (q.finalAnswer || '-'));
    const btns = choices.map(([v, label]) => {
      const b = H('button', { class: 'avcpick' + (now === v ? ' on' : ''), type: 'button', text: label, 'aria-pressed': String(now === v) });
      b.onclick = () => { held[id] = v; btns.forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-pressed', String(on)); }); paint(); };
      return b;
    });
    return H('div', { class: 'avcrow' }, [
      H('button', { class: 'qlink', type: 'button', title: 'Open this question in the paper', onclick: () => openQuestion(ctx.a, q.displayedQuestionNumber), text: `Q${q.displayedQuestionNumber} ↗` }),
      H('span', { class: 'avcwhy', text: why }),
      H('span', { class: 'avcbtns' }, btns),
    ]);
  };
  const altOf = q => { const h = (q.answerHistory || []).filter(x => !x.revoked); const last = h[h.length - 1]; return last && last.alt ? last.alt : null; };
  const group = (title, rows, open = true) => rows.length ? H('details', { class: 'avcgroup', open }, [H('summary', {}, [b(title), ` · ${rows.length}`]), H('div', { class: 'avclist' }, rows)]) : null;

  const strayBox = H('div');
  const fillStray = list => {
    const rows = list.map(x => { const q = qs.find(y => y.questionId === x.qid); return q ? pickRow(q, 'answer', `a blue mark near it touched no option · counted as ${q.finalAnswer || 'blank'}`) : null; }).filter(Boolean);
    const seen = new Set(amb.map(q => q.questionId).concat(list.map(x => x.qid)));
    const shaky = (list.shaky || []).filter(x => !seen.has(x.qid)).map(x => {
      const q = qs.find(y => y.questionId === x.qid);
      if (!q || q.outcome === 'skipped') return null;
      const what = x.missing.length ? `option ${x.missing.join(', ')} not printed in the paper's text` : `option ${x.guessed.join(', ')} placed by estimate`;
      return pickRow(q, 'answer', `${what} · read as ${q.finalAnswer || 'blank'}`);
    }).filter(Boolean);
    strayBox.replaceChildren(...[group('Blue mark on no option', rows), group('Options the paper did not show clearly', shaky)].filter(Boolean));
  };
  if (AVC.stray) fillStray(AVC.stray);
  else avcStray(ctx).then(list => { AVC.stray = list; fillStray(list); }).catch(() => {});

  const other = H('input', { class: 'avcnum', type: 'number', min: '1', placeholder: 'Q no.', 'aria-label': 'Another question to correct' });
  const extraBox = H('div', { class: 'avclist' }, AVC.extra.map(n => byN(n)).filter(Boolean).map(q => pickRow(q, 'answer', `read as ${q.finalAnswer || 'blank'}`)));
  const addOther = () => {
    const n = parseInt(other.value, 10), q = byN(n);
    if (!q) { status.textContent = n ? `There is no question ${n} in this attempt.` : ''; return; }
    if (!AVC.extra.includes(n)) { AVC.extra.push(n); extraBox.append(pickRow(q, 'answer', `read as ${q.finalAnswer || 'blank'}`)); }
    other.value = ''; status.textContent = '';
  };
  other.addEventListener('keydown', e => { if (e.key === 'Enter') addOther(); });

  saveBtn.onclick = async () => {
    const n = pending();
    if (!n) return;
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    try {
      const M = nbMock(), db = NB.db, s = Object.assign({}, await db.getSession(ctx.sess.id) || ctx.sess);
      const o = Object.assign({}, s.overrides || {});
      o.answers = Object.assign({}, o.answers || {}, AVC.answers);
      o.guesses = Object.assign({}, o.guesses || {}, AVC.guesses);
      o.at = Date.now();
      s.overrides = o; s.version = (s.version || 1) + 1; s.updatedAt = Date.now();
      await db.putSession(s);
      const [events, map, key, samples] = await Promise.all([db.readEvents(s.id), db.resolveMap(s), db.getKey(s.id), db.getMeta('guess.samples').catch(() => null)]);
      if (map && key) await db.putDerived(M.deriveAttempt({ session: s, events, map, key, now: Date.now(), guessSamples: Array.isArray(samples) ? samples : [] }));
      AVC.answers = {}; AVC.guesses = {};
      try { new BroadcastChannel('neobook').postMessage({ type: 'attempt-changed', id: s.id, from: 'dashboard' }); } catch (e) { /* the other tab carries it next time */ }
      await refreshNeoBook();
      buildModel(); refreshChrome(); invalidate();
      toast(`${n} change${n === 1 ? '' : 's'} saved — scored again`);
    } catch (e) {
      console.error(e); status.textContent = 'Could not save: ' + (e && e.message ? e.message : e); paint();
    }
  };
  paint();

  const total = amb.length + blanks.length + unread.length;
  return card('Check these', `Where the pen could not be read for certain. Choose what you meant — nothing changes until you save, and then the attempt is scored again once.${mine.length ? ` ${mine.length} question${mine.length === 1 ? ' is' : 's are'} already set by you.` : ''}`, [
    group('Blue mark across two options', amb.map(q => pickRow(q, 'answer', `read as ${q.finalAnswer || 'blank'}${altOf(q) ? `, also touching ${altOf(q)}` : ''}`))),
    strayBox,
    group('Ringed, word not read', unread.map(q => pickRow(q, 'guess', 'what kind of guess was it?'))),
    group('Left blank', blanks.map(q => pickRow(q, 'answer', 'no answer was read — pick one if you did answer')), false),
    group('Set by you', mine.map(q => q.answerSetByYou ? pickRow(q, 'answer', `set to ${q.finalAnswer || 'blank'}`) : pickRow(q, 'guess', `set to ${setG[q.questionId]}`)), false),
    H('div', { class: 'avcother' }, [H('span', { class: 'muted', text: 'Another question:' }), other, H('button', { class: 'btn plain', type: 'button', onclick: addOther, text: 'Correct it' })]),
    extraBox,
    H('div', { class: 'avcfoot' }, [saveBtn, status]),
  ].filter(Boolean), { foot: total ? null : 'Nothing was left uncertain in this attempt; you can still correct any question above.' });
}

function renderAttempt(el) {
  const ch = avChoices();
  if (!ch.all.length) return fill(el, viewHead('Attempt', 'No attempts yet.'));
  const cur = ch.all.find(c => c.id === AV.sel) || ch.all.find(c => c.id === state.prefs.attemptSel) || ch.nb[0] || ch.all[0];
  if (AV.sel !== cur.id) { AV.sel = cur.id; state.prefs.attemptSel = cur.id; savePrefs(); }
  avHash();
  const opt = c => H('option', { value: c.id, selected: c.id === cur.id, text: c.label });
  const picker = H('select', { class: 'avpick', 'aria-label': 'Choose an attempt', onchange: e => avSelect(e.target.value) }, [
    ch.nb.length ? H('optgroup', { label: 'Recorded in NeoBook' }, ch.nb.map(opt)) : null,
    ch.other.length ? H('optgroup', { label: ch.nb.length ? 'Other attempts' : 'Attempts' }, ch.other.map(opt)) : null,
  ]);
  const d = cur.d;
  const title = cur.a ? `${cur.a.paper}${cur.a.set ? ` · ${cur.a.set}` : ''}` : cur.p.name;
  const sub = cur.a ? `${cur.a.cohortName} · ${cur.a.when}${d ? ' · recorded in NeoBook' : ''}` : `${SEC_NAME[cur.p.section] || 'Mixed'} practice · ${cur.p.date ? fmtDate(cur.p.date) : 'Undated'} · recorded in NeoBook`;
  const head = viewHead(title, sub, H('div', { class: 'filter-group avhead' }, [picker, typeof avRemoveButton === 'function' ? avRemoveButton(cur) : null]));
  if (!d) return fill(el, head, avPlain(cur.a));
  const ctx = { d, a: cur.a || null, p: cur.p || null, full: d.target === 'attempt', t: d.test, qs: d.questions, sess: NB.sessions.get(cur.id) || null };
  /* Verify settles what the pen could not read; an attempt with no pen log has nothing to settle */
  const panes = AV_PANES.filter(p => !p.needsLog || (ctx.sess && ctx.full));
  const pane = panes.some(p => p.k === state.prefs.attemptPane) ? state.prefs.attemptPane : 'summary';
  const seg = H('nav', { class: 'seg small', id: 'avTabs', role: 'tablist', 'aria-label': 'Analysis of this attempt' }, [H('span', { class: 'thumb', 'aria-hidden': 'true' })].concat(panes.map(p => H('button', {
    type: 'button', role: 'tab', 'aria-selected': String(p.k === pane), tabindex: p.k === pane ? '0' : '-1',
    onclick: () => { state.prefs.attemptPane = p.k; savePrefs(); invalidate(['attempt']); },
  }, p.label))));
  let body;
  try { body = AV_RENDER[pane](ctx); }
  catch (e) { console.error(e); body = [card('This part hit an error', e && e.message ? e.message : String(e), [])]; }
  fill(el, head, H('div', { class: 'tabs-scroll avtabs' }, seg), ...[].concat(body));
  requestAnimationFrame(() => moveThumb(seg, false));
}

        kpi('Rereading', msTxt(t.averageRereadMs), 'per passage, on average'),
        kpi('Marks per minute', t.efficiencyMarksPerMinute == null ? '—' : t.efficiencyMarksPerMinute.toFixed(2), 'across passage blocks'),

/* what stands out: short sentences, each straight from one metric */
function avHeadlines(c) {
  const t = c.t, qs = c.qs, lines = [];
  const say = (text, tone) => lines.push(H('li', { class: tone || '' }, text));
  const slowest = qs.filter(q => q.totalActiveTimeMs > 0).sort((x, y) => y.totalActiveTimeMs - x.totalActiveTimeMs)[0];
  if (slowest) say(`Longest on one question: Q${slowest.displayedQuestionNumber}, ${msTxt(slowest.totalActiveTimeMs)} — ${(OUTC[slowest.outcome] || OUTC.unkeyed).label.toLowerCase()}.`, slowest.outcome === 'wrong' ? 'bad' : '');
  const ch = t.answerChanging;
  if (ch.questionsChanged) say(`Changing answers ${ch.netMarksFromChanging > 0 ? 'gained' : ch.netMarksFromChanging < 0 ? 'cost' : 'netted'} ${marks(Math.abs(ch.netMarksFromChanging))} marks: ${ch.wrongToRight} wrong → right, ${ch.rightToWrong} right → wrong${ch.wrongToWrong ? `, ${ch.wrongToWrong} wrong → wrong` : ''}.`, ch.netMarksFromChanging < 0 ? 'bad' : ch.netMarksFromChanging > 0 ? 'good' : '');
  if (t.finalTwo.questions) say(`Final two reached on ${plural(t.finalTwo.questions, 'question')}; ${t.finalTwo.conversionRate == null ? 'none scored yet' : `${pct(t.finalTwo.conversionRate, 0)} converted`}.`);
  const tm = t.timing, lost = tm.idleMs + tm.backgroundMs;
  if (lost >= 60000) say(`${msTxt(lost)} went to idling (${msTxt(tm.idleMs)}) and time away from the app (${msTxt(tm.backgroundMs)}).`, 'bad');
  if (t.lateTestSlowdown != null && t.lateTestSlowdown >= 1.25) say(`Questions in the last third took ${t.lateTestSlowdown.toFixed(2)}× as long as earlier ones.`);
  if (t.friction.highFrictionCount) say(`${plural(t.friction.highFrictionCount, 'question')} showed two kinds of difficulty at once; ${t.friction.highFrictionCorrect} still went right.`);
  const secs = (c.d.sections || []).filter(s => s.totalTimeMs > 0);
  if (secs.length > 1) {
    const best = secs.slice().sort((x, y) => (y.marksPerMinute || 0) - (x.marksPerMinute || 0))[0], worst = secs.slice().sort((x, y) => (x.marksPerMinute || 0) - (y.marksPerMinute || 0))[0];
    if (best !== worst && best.marksPerMinute != null && worst.marksPerMinute != null) say(`Best return on time: ${SEC_NAME[best.sectionId]} at ${best.marksPerMinute.toFixed(2)} marks a minute; least: ${SEC_NAME[worst.sectionId]} at ${worst.marksPerMinute.toFixed(2)}.`);
  }
  if (t.unassignedBlueMarks) say(`${plural(t.unassignedBlueMarks, 'blue mark')} touched no option and did not count as an answer.`, 'bad');
  if (!lines.length) say('Nothing unusual in this attempt.');
  return H('ul', { class: 'avlines' }, lines);
}

/* ═══════════════════════════ 8. Adding data ═══════════════════════════ */
const V13_SEC = { english: 'en', cagk: 'gk', legal: 'le', logical: 'lr', quants: 'qt' };
const TAG_MEANING_FALLBACK = { 'CG/EG': 'Calculated guess', G: 'Normal guess', 'Circled only': 'Circled only', 'G/circle': 'Educated guess / circled', X: 'Possibly invalid question' };

function normSecKey(s) {
  const t = String(s == null ? '' : s).toLowerCase();
  if (!t) return null;
  if (/legal|\blaw\b/.test(t)) return 'le';
  if (/english|verbal|reading|\brc\b/.test(t)) return 'en';
  if (/current|general knowledge|\bgk\b|cagk|affairs/.test(t)) return 'gk';
  if (/quant|math|numer|\bqt\b|\bqa\b|data interp/.test(t)) return 'qt';
  if (/logic|reason|\blr\b/.test(t)) return 'lr';
  return null;
}
const ymd = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
function isoFrom(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : ymd(v.getFullYear(), v.getMonth() + 1, v.getDate());
  if (typeof v === 'number') {
    if (v > 25000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
    if (v > 1e11) { const d = new Date(v); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
    return null;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return ymd(m[1], m[2], m[3]);
  const mon = t => MONTHS.findIndex(x => x.toLowerCase() === String(t).slice(0, 3).toLowerCase()) + 1;
  m = s.match(/^(\d{1,2})\s+([A-Za-z]{3,})\.?,?\s+(\d{4})/);
  if (m && mon(m[2])) return ymd(m[3], mon(m[2]), m[1]);
  m = s.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/);
  if (m && mon(m[1])) return ymd(m[3], mon(m[1]), m[2]);
  m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/);
  if (m) return ymd(m[3].length === 2 ? `20${m[3]}` : m[3], m[2], m[1]);
  return null;
}
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (loadXLSX.p) return loadXLSX.p;
  loadXLSX.p = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error('The Excel reader didn’t start. Reload the page and try again.')));
    s.onerror = () => { loadXLSX.p = null; reject(new Error('Couldn’t load the Excel reader. Check your internet connection and try again.')); };
    document.head.appendChild(s);
  });
  return loadXLSX.p;
}
const sheetRows = (X, ws) => X.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: null, raw: true });

/** Answer-key question-log workbooks (one attempt per log sheet). */
function parseQuestionLogWorkbook(wb, X) {
  const lower = v => String(v == null ? '' : v).trim().toLowerCase();
  const dates = {}, orders = {};
  const all = wb.SheetNames.map(sn => ({ sn, rows: sheetRows(X, wb.Sheets[sn]) }));
  all.forEach(({ rows }) => rows.forEach((r, i) => {
    const c = (r || []).map(lower);
    const iOn = c.indexOf('attempted on'), iYear = c.indexOf('exam year');
    if (iOn >= 0 && iYear >= 0) {
      for (let j = i + 1; j < rows.length; j++) { const rr = rows[j] || []; const y = parseInt(rr[iYear], 10); if (!y) break; const d = isoFrom(rr[iOn]); if (d) dates[y] = d; }
    }
    const iOrder = c.indexOf('order'), iAtt = c.indexOf('attempt');
    if (iOrder >= 0 && iAtt >= 0) {
      for (let j = i + 1; j < rows.length; j++) {
        const rr = rows[j] || [], m = String(rr[iAtt] || '').match(/(20\d\d)/);
        if (!m) break;
        const ord = String(rr[iOrder] || '').split(/→|->|>|,/).map(normSecKey).filter(Boolean);
        if (ord.length >= 3) orders[+m[1]] = ord;
      }
    }
  }));
  const found = [];
  all.forEach(({ sn, rows }) => {
    let hi = -1, col = null;
    for (let i = 0; i < Math.min(rows.length, 25); i++) {
      const c = (rows[i] || []).map(lower);
      const q = c.findIndex(x => /^q\.?\s*(no\.?|num(ber)?|#)?$/.test(x) || /^question\s*(no\.?|number)?$/.test(x));
      const s = c.findIndex(x => x === 'section' || x === 'subject');
      const o = c.findIndex(x => x === 'outcome' || x === 'result' || x === 'status');
      const k = c.findIndex(x => /official key|^key$|answer key|correct (answer|option)/.test(x));
      const u = c.findIndex(x => /user answer|your answer|^response$|marked answer|^answer$/.test(x));
      if (q >= 0 && s >= 0 && o >= 0 && (k >= 0 || u >= 0)) {
        hi = i;
        col = { q, s, o, k, u, tag: c.findIndex(x => /guess tag|^annotation$|^tag$/.test(x)), meaning: c.findIndex(x => /annotation meaning|tag meaning/.test(x)) };
        break;
      }
    }
    if (hi < 0) return;
    const letter = v => { const t = String(v == null ? '' : v).trim().toUpperCase(); return /^[A-D]$/.test(t) ? t : ''; };
    const qs = [];
    for (let j = hi + 1; j < rows.length; j++) {
      const r = rows[j] || [], qn = parseInt(r[col.q], 10);
      if (!qn) continue;
      const sec = normSecKey(r[col.s]), o = lower(r[col.o]);
      const out = /withdraw|dropped|deleted|bonus|cancel/.test(o) ? 'x' : /^(correct|right|c)$/.test(o) ? 'c' : /^(wrong|incorrect|w)$/.test(o) ? 'w' : /skip|blank|unattempt|not attempted|^left$|^s$/.test(o) ? 's' : null;
      if (!sec || !out) continue;
      qs.push({ q: qn, sec, out, key: col.k >= 0 ? letter(r[col.k]) : '', ans: col.u >= 0 ? letter(r[col.u]) : '', tag: col.tag >= 0 && r[col.tag] != null ? String(r[col.tag]).trim() : '', meaning: col.meaning >= 0 && r[col.meaning] != null ? String(r[col.meaning]).trim() : '' });
    }
    if (qs.length < 20) return;
    qs.sort((p, q) => p.q - q.q);
    if (qs.some((x, i) => x.q !== i + 1)) return;
    const title = String((rows[0] || [])[0] || sn);
    const ym = `${title} ${sn}`.match(/(20\d\d)/), year = ym ? +ym[1] : null;
    const exam = /ailet/i.test(title) ? 'AILET' : 'CLAT';
    const setM = title.match(/\bset\s*([A-D])\b/i);
    const sec = {};
    SECS.forEach(s => {
      const list = qs.filter(x => x.sec === s.k);
      if (list.length) sec[s.k] = { q: [list[0].q, list[list.length - 1].q], n: list.length, x: list.filter(x => x.out === 'x').length, C: list.filter(x => x.out === 'c').length, W: list.filter(x => x.out === 'w').length, S: list.filter(x => x.out === 's').length };
    });
    const count = o => qs.filter(x => x.out === o).length;
    const tags = {}, tagMeanings = {};
    qs.forEach(x => { if (x.tag) { tags[x.q] = x.tag; if (!tagMeanings[x.tag]) tagMeanings[x.tag] = x.meaning || TAG_MEANING_FALLBACK[x.tag] || ''; } });
    found.push({
      id: `u-${uid()}`, paper: year ? `${exam} ${year}` : title.slice(0, 40), set: setM ? `Set ${setM[1].toUpperCase()}` : undefined,
      cohort: 'pyq_t', date: (year && dates[year]) || null, origin: 'upload', addedAt: Date.now(),
      M: qs.length - count('x'), paperQs: qs.length, C: count('c'), W: count('w'), S: count('s'), secMode: 'counts', sec,
      withdrawn: qs.filter(x => x.out === 'x').map(x => x.q), order: (year && orders[year]) || null, tagMeanings, notes: [],
      log: { key: qs.map(x => (x.out === 'x' ? 'W' : x.key || '-')).join(''), ans: qs.map(x => x.ans || '-').join(''), out: qs.map(x => x.out).join(''), tags },
    });
  });
  return found;
}

function cleanPaperName(name) {
  const s = String(name || '').trim(), m = s.match(/full\s*length\s*mock(?:\s*test)?\D{0,4}(\d{1,3})\b/i);
  return m ? `PW Mock ${m[1]}` : (s || 'Mock');
}
/** v13-shaped attempt (from its parser or its browser storage) → v14 attempt. */
function fromV13Attempt(o, origin) {
  const C = Number(o.correct) || 0, W = Number(o.incorrect) || 0, S = Number(o.skipped) || 0;
  const a = {
    id: `u-${uid()}`, paper: cleanPaperName(o.name), cohort: o.type === 'untimed' ? 'mock_u' : 'mock_t',
    date: isoFrom(o.attemptedOn) || (o.date ? isoFrom(Number(o.date)) : null),
    origin, addedAt: Date.now(), C, W, S,
  };
  a.M = C + W + S || Number(o.questions) || 120;
  a.paperQs = a.M;
  const exact = {};
  (Array.isArray(o.tree) ? o.tree : []).forEach(t => {
    const k = normSecKey(t.main);
    const subO = !t.sub || /^overall$/i.test(t.sub), topO = !t.topic || /^overall$/i.test(t.topic);
    if (k && subO && topO && t.correct != null) exact[k] = { n: (t.correct || 0) + (t.incorrect || 0) + (t.skipped || 0), C: t.correct || 0, W: t.incorrect || 0, S: t.skipped || 0, t: t.timeSec == null ? null : t.timeSec };
  });
  const ex = Object.values(exact);
  if (ex.length === 5 && sum(ex, s => s.C) === C && sum(ex, s => s.W) === W) { a.secMode = 'counts'; a.sec = exact; }
  else if (o.sections) {
    a.secMode = 'acc'; a.secAcc = {};
    Object.entries(V13_SEC).forEach(([k13, k]) => {
      const acc = o.sections[k13], w = o.wrongDist ? o.wrongDist[k13] : null;
      a.secAcc[k] = acc == null || (Number(acc) === 0 && !w) ? null : Number(acc);
    });
  }
  if (Array.isArray(o.intervals) && o.intervals.length) a.intervals = o.intervals.map(iv => [Number(iv.attempted) || 0, Number(iv.correct) || 0, Number(iv.incorrect) || 0, Number(iv.marks) || 0]);
  if (Array.isArray(o.tree)) {
    const leaves = o.tree.filter(t => t.topic && !/^overall$/i.test(t.topic)).map(t => [normSecKey(t.main), t.sub || '', t.topic, t.correct || 0, t.incorrect || 0, t.skipped || 0, t.timeSec == null ? null : t.timeSec]).filter(r => r[0]);
    if (leaves.length) a.tree = leaves;
  } else if (o.topics && typeof o.topics === 'object') {
    const t = {};
    Object.entries(o.topics).forEach(([name, arr]) => { const k = normSecKey(name); if (k && Array.isArray(arr) && arr.length) t[k] = arr.map(x => [x.label, x.acc == null ? null : Number(x.acc)]); });

  }

  return a;
}
function fromV13Practice(p, origin) {
  return {
    id: `p-${uid()}`, name: p.name || 'Practice test', category: p.category || 'sectional', section: V13_SEC[p.section] || normSecKey(p.section) || 'mixed',
    topic: p.topic || '', date: isoFrom(p.attemptedOn) || (p.date ? isoFrom(Number(p.date)) : null), origin, addedAt: Date.now(),
    C: Number(p.correct) || 0, W: Number(p.incorrect) || 0, S: Number(p.skipped) || 0, timeSec: p.timeSec == null ? null : p.timeSec,
  };
}
function parsePwWorkbook(wb, X, fileName) {
  const R = Legacy.P.parseWorkbook(wb, X);
  const base = String(fileName || '').replace(/\.(xlsx|xls|csv)$/i, '');
  let allRows = [];
  wb.SheetNames.forEach(sn => { allRows = allRows.concat(sheetRows(X, wb.Sheets[sn])); });
  const meta = R.meta || {};
  const cls = Legacy.classifyUpload(R.sections, allRows, base);
  const hasMeta = meta.correct != null || meta.score != null || meta.accuracy != null || meta.testName != null;
  if (!R.sections && !cls.fallbackTotals && !hasMeta && !R.tree) return null;
  if (cls.category === 'mock') {
    const o = Legacy.buildAttemptFromParse(R.sections, R.intervals, meta, R.tree, R.sectionTimes || {});
    o.name = meta.testName || base;
    return { kind: 'attempt', a: fromV13Attempt(o, 'upload') };
  }
  const p = Legacy.buildPracticeFromParse(R.sections, cls, allRows);
  if (!p.name || p.name === 'New') p.name = base;
  return { kind: 'practice', a: fromV13Practice(p, 'upload') };
}

/** One-time: bring over anything the v13 dashboard saved in this browser. */
function importLegacy() {
  const result = { attempts: [], practice: 0, total: 0 };
  if (state.user.legacyChecked) return result;
  state.user.legacyChecked = true;
  const legacy = store.get(KEYS.legacy, null);
  if (legacy && typeof legacy === 'object') {
    (Array.isArray(legacy.attempts) ? legacy.attempts : []).forEach(o => {
      if (!o || V13_SEED_NAMES.has(o.name)) return;
      try {
        const a = fromV13Attempt(o, 'v13-browser');
        if (!(a.C + a.W + a.S) || findDuplicate(a) || state.user.attempts.some(u => signature(u) === signature(a))) return;
        state.user.attempts.push(a);
        result.attempts.push(a.paper);
      } catch (e) { console.warn('Skipped a v13 attempt', e); }
    });
    (Array.isArray(legacy.practice) ? legacy.practice : []).forEach(o => {
      try {
        const p = fromV13Practice(o, 'v13-browser');
        if (state.user.practice.some(x => x.name === p.name && x.C === p.C && x.W === p.W)) return;
        state.user.practice.push(p);
        result.practice++;
      } catch (e) { console.warn('Skipped a v13 practice test', e); }
    });

/** A correction: verified supervision, kept with the attempt when NeoBook recorded it. */
async function tpxCorrect(d, r, topicId) {
  const T = tpxT();
  if (!T.TOPIC_BY_ID[topicId] || topicId === r.topic) return;
  const a = d.byAttempt.get(r.attempt);
  const sid = a && a.telemetrySessionId;
  const pickNow = d.topics.get(r.attempt) && d.topics.get(r.attempt).picks.get(r.n);
  const prev = pickNow ? { id: pickNow.id, conf: pickNow.conf, source: pickNow.source, version: pickNow.version || T.CLASSIFIER_VERSION } : null;
  try {
    if (sid && NB.db && NB.sessions.has(sid)) {
      const map = TPX.maps.get(sid);
      const q = map && map.questions.find(x => x.n === r.n);
      if (!q) throw new Error('this question is not on the paper’s map');
      const s = Object.assign({}, await NB.db.getSession(sid) || NB.sessions.get(sid));
      const o = Object.assign({}, s.overrides || {});
      o.topics = Object.assign({}, o.topics || {}, { [q.id]: topicId });
      const text = [q.text || '', Object.values(q.opts || {}).join(' ')].join(' ');
      o.topicLog = (o.topicLog || []).concat([{ qid: q.id, hash: q.hash || r.hash || null, section: q.sectionId, topicId, at: Date.now(), prev, tokens: T.tokensOf(text) }]).slice(-500);
      o.at = Date.now();
      s.overrides = o; s.version = (s.version || 1) + 1; s.updatedAt = Date.now();
      await NB.db.putSession(s);
      NB.sessions.set(sid, s);
      try { new BroadcastChannel('neobook').postMessage({ type: 'attempt-changed', id: s.id, from: 'dashboard' }); } catch (e) { /* the other tab carries it next time */ }
    } else {
      if (!r.hash) throw new Error('this question has no fingerprint to hold the correction');
      const list = tpxLocalCorrections().filter(c => c.hash !== r.hash);
      list.push({ hash: r.hash, section: r.section, topicId, at: Date.now(), prev, tokens: [] });
      store.set(TPX_CORR_KEY, list);
    }
    TPX.sig = '';
    toast(`Q${r.n} of ${r.short} is now under ${tpxName(topicId)}`);
    invalidate(['topics', 'patterns']);
  } catch (e) {
    console.error(e);
    toast('Could not save the topic: ' + (e && e.message ? e.message : e));
  }
}

function tpxHowCard(d) {
  const T = tpxT(), A = d.A;
  const rows = d.rows.filter(r => r.topic && !r.aggregate);
  const bySrc = rows.reduce((m, r) => { const k = r.source || 'rules'; m[k] = (m[k] || 0) + 1; return m; }, {});
  const sure = rows.filter(r => r.source === 'human' || (r.conf != null && r.conf >= 0.8)).length;
  const k = A.kappa;
  const text = [
    `${rows.length} questions placed: ${bySrc.human || 0} by you, ${bySrc.learned || 0} with help from your corrections, ${bySrc.rules || 0} by the classifier alone; ${Math.round(sure / Math.max(1, rows.length) * 100)}% at 80% confidence or more.`,
    `The classifier reads each question’s stem, options and passage against a controlled CLAT UG tree of ${T.TOPICS.length} topics with permanent ids, so one idea is always one row. On CLAT papers it was not tuned on, it chose the right micro-topic about 4 times in 5, and the level it reports (it stops higher up the tree when unsure) was right over 9 times in 10.`,

  ];
