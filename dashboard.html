function buildInsights() {
  const A = state.attempts, out = [];
  const T = A.filter(a => a.cohort === 'pyq_t');
  if (T.length >= 2) {
    const gap = sum(T, a => a.m.gap), wc = sum(T, a => a.m.wrongCost);
    if (gap > 0) out.push({ tone: 'bad', icon: '×', parts: ['Wrong answers, not blanks, cost you most: ', b(pct(wc / gap, 0)), ` of the marks dropped across your ${T.length} timed PYQs (`, b(marks(wc)), ' of ', b(marks(gap)), '). Each wrong answer costs 1.25 marks: the mark you miss plus the 0.25 penalty.'] });
    const pooled = SECS.map(s => Object.assign({ s }, pooledSec(T, s.k))).filter(r => r.att > 0);
    if (pooled.length >= 2) {
      const sorted = pooled.slice().sort((p, q) => p.acc - q.acc), lo = sorted[0], hi = sorted[sorted.length - 1];
      out.push({ tone: 'warn', icon: '↓', parts: [b(lo.s.name), ' is your weakest section in timed PYQs: ', b(pct(lo.acc, 0)), ` accuracy (${lo.C} of ${lo.att}), losing `, b(lo.perQ.toFixed(2)), ' marks per question. ', b(hi.s.name), ' is strongest at ', b(pct(hi.acc, 0)), '.'] });
    }
  }
  if (T.length >= 3) {
    // A section "trend" must hold in score % (net ÷ scorable), which folds in coverage. Accuracy alone can
    // fall just because you started attempting questions you used to skip.
    const last3 = T.slice(-3), who = last3.map(a => a.short).join(', ');
    const mono = v => (v[0] > v[1] && v[1] > v[2] ? -1 : v[0] < v[1] && v[1] < v[2] ? 1 : 0);
    const arrow = v => v.map(x => pct(x, 0)).join(' → ');
    const rows = SECS.map(s => {
      const ms = last3.map(a => secM(a, s.k));
      if (ms.some(m => !m || !m.exact || !m.M || m.acc == null)) return null;
      const acc = ms.map(m => m.acc), sc = ms.map(m => m.pct), cov = ms.map(m => m.cov);
      return { s, acc, sc, cov, accDir: mono(acc), scDir: mono(sc), covMoved: Math.max(...cov) - Math.min(...cov) > 0.1 };
    }).filter(Boolean);
    [-1, 1].forEach(dir => {
      const t = rows.filter(r => r.scDir === dir).sort((p, q) => Math.abs(q.sc[2] - q.sc[0]) - Math.abs(p.sc[2] - p.sc[0]))[0];
      if (t) out.push({ tone: dir < 0 ? 'bad' : 'good', icon: dir < 0 ? '↘' : '↗', parts: [b(t.s.name), ` section score (net ÷ scorable) ${dir < 0 ? 'fell' : 'rose'} in each of your last three timed PYQs: `, b(arrow(t.sc)), ` (${who}; accuracy ${arrow(t.acc)}). These are different papers, so some of it may be paper difficulty.`] });
    });
    const masked = rows.filter(r => r.accDir !== 0 && r.scDir === 0 && r.covMoved).sort((p, q) => Math.abs(q.acc[2] - q.acc[0]) - Math.abs(p.acc[2] - p.acc[0]))[0];
    if (masked) out.push({ tone: '', icon: '≈', parts: [b(masked.s.name), ` accuracy ${masked.accDir < 0 ? 'fell' : 'rose'} across ${who} (`, b(arrow(masked.acc)), `), but that isn’t a steady ${masked.accDir < 0 ? 'decline' : 'improvement'}: you attempted `, b(arrow(masked.cov)), ' of its questions, and its section score (net ÷ scorable) went ', b(arrow(masked.sc)), '.'] });
  }
  const tagged = A.filter(a => { const gs = a.log ? guessStats(a) : null; return gs && !gs.none; });
  if (tagged.length) {
    const parts = ['A guess only adds marks above ', b('20%'), ' accuracy. '];
    tagged.slice(-2).forEach((a, i) => {
      const gs = guessStats(a);
      const worst = gs.groups.filter(x => x.att >= 3 && x.acc != null).sort((p, q) => p.acc - q.acc)[0];
      parts.push(`${i ? ' ' : ''}${a.short}: marked guesses were `, b(pct(gs.marked.acc, 0)), ` right (${gs.marked.C} of ${gs.marked.att}) vs `, b(pct(gs.unmarked.acc, 0)), ' unmarked');
      if (worst && worst.acc < 0.2) parts.push('; ', b(worst.tag), ' guesses hit only ', b(pct(worst.acc, 0)));
      parts.push('.');
    });
    out.push({ tone: 'warn', icon: '?', parts });
  }
  const pairs = retakePairs();
  if (pairs.length) {
    const ds = pairs.map(p => ({ p, d: p.a1.m.pct - p.a0.m.pct }));
    const allUp = ds.every(x => x.d > 0);
    const parts = [allUp ? 'Every retake of a paper scored higher: ' : 'Retakes of the same paper: '];
    ds.forEach((x, i) => parts.push(i ? ', ' : '', `${x.p.paper} `, b(signedPts(x.d))));
    const untimedToTimed = pairs.every(p => p.a0.cohort === 'pyq_u' && p.a1.cohort === 'pyq_t');
    parts.push(untimedToTimed ? '. The first tries were untimed and the retakes timed, so this mixes months of practice with knowing the paper.' : '. Retakes mix practice with knowing the paper.');
    out.push({ tone: allUp ? 'good' : 'warn', icon: '↺', parts });
  }
  if (T.length) {
    const covs = T.map(a => a.m.cov), lo = Math.min(...covs), hi = Math.max(...covs);
    const parts = lo >= 0.9 ? ['Coverage isn’t what holds back your timed PYQs (', b(`${pct(lo, 0)}–${pct(hi, 0)}`), ')'] : ['Coverage in your timed PYQs ranged ', b(`${pct(lo, 0)}–${pct(hi, 0)}`)];
    const M = A.filter(a => a.cohort === 'mock_t');
    if (M.length) {
      const mc = M.map(a => a.m.cov);
      parts.push('. In mocks it was ', b(`${pct(Math.min(...mc), 0)}–${pct(Math.max(...mc), 0)}`));
      const qt = M.map(a => secM(a, 'qt')).filter(m => m && m.exact);
      if (qt.length === M.length && qt.every(m => m.att <= 1)) parts.push(', with Quants barely touched (', b(qt.map(m => m.att).join(', ')), ` of ${qt[0].M} attempted)`);
    }
    parts.push('.');
    out.push({ tone: '', icon: '◎', parts });
  }
  return out.slice(0, 6);
}

/* ────────────── Trends ────────────── */
function renderTrends(el) {

  const vis = list();
  const mainHost = H('div', { class: 'chart' }), lossHost = H('div', { class: 'chart' }), pathHost = H('div', { class: 'chart' });
  const mainCfg = () => ({

        : { title: 'Score · % of scorable marks', name: 'Score', lo: 0, hi: 1, ticks: PCT_TICKS, tick: pctTick, target: TGT.band('pct'), tLabel: TGT.label('pct'), series: [{ value: a => a.m.pct, fmt: a => `${pct(a.m.pct)} · ${marks(a.m.net)}/${a.M}` }] },
      { title: 'Accuracy · correct ÷ attempted', name: 'Accuracy', lo: 0, hi: 1, ticks: PCT_TICKS, tick: pctTick, target: TGT.band('acc'), tLabel: TGT.label('acc'), series: [{ value: a => a.m.acc, fmt: a => `${pct(a.m.acc)} · ${a.C}/${a.m.att}` }] },
      { title: 'Coverage · attempted ÷ scorable', name: 'Coverage', lo: 0, hi: 1, ticks: PCT_TICKS, tick: pctTick, target: TGT.band('cov'), tLabel: TGT.label('cov'), series: [{ value: a => a.m.cov, fmt: a => `${pct(a.m.cov)} · ${a.m.att}/${a.M}` }] },

/** Which bar holds each kind of attempt back, in one sentence per kind (dated attempts only). */
function limiterText(list) {
  const parts = [];
  ['mock_t', 'pyq_t'].forEach(k => {
    const xs = list.filter(a => a.cohort === k && a.date && a.m.acc != null);
    if (xs.length < 2) return;
    const r = f => { const v = xs.map(f); return pctRange(Math.min(...v), Math.max(...v)); };
    const cov = sum(xs, a => a.m.cov) / xs.length, acc = sum(xs, a => a.m.acc) / xs.length;
    const limit = cov < acc - 0.05 ? 'coverage is the shorter bar, so attempting more would lift these scores fastest' : 'accuracy is the shorter bar, so getting more of the attempted questions right is what lifts these scores';
    parts.push(`${COHORTS[k].phrase[0].toUpperCase()}${COHORTS[k].phrase.slice(1)}s: coverage ${r(a => a.m.cov)}, accuracy ${r(a => a.m.acc)}; ${limit}.`);
  });
  return parts.length ? parts.join(' ') : 'Score % = coverage × (1.25 × accuracy − 0.25): both bars have to be tall for a high score.';
}

const PAPER_DIR = 'Question papers/';
const PAPER_VIEWERS = { 2024: 'CLAT 2024 UG Set A.html', 2025: 'CLAT 2025 UG Set A.html', 2026: 'CLAT 2026 UG Set A.html' };
function paperViewer(a) {
  const y = (String(a.paper).match(/CLAT\D{0,6}(20\d\d)/i) || [])[1];
  return y && PAPER_VIEWERS[y] && a.log ? { file: PAPER_DIR + PAPER_VIEWERS[y], win: `clat-paper-${y}` } : null;

/** Open question n of attempt a in its paper. Each paper gets one named tab; later clicks on the same paper only

function openQuestion(a, n) {

  const w = window.open(`${encodeURI(v.file)}#${h.toString()}`, v.win);

/* ────────────── Timing & topics ────────────── */
function renderTiming(el) {
  const A = state.attempts;
  const withIv = A.filter(a => a.intervals && a.intervals.length);
  const withT = A.filter(a => a.secMode === 'counts' && SECS.some(s => a.sec[s.k] && a.sec[s.k].t != null));
  const withTopics = A.filter(a => (a.topics && Object.keys(a.topics).length) || (a.tree && a.tree.length));
  const noClock = A.filter(a => a.cohort === 'pyq_t' && !(a.intervals && a.intervals.length));
  const covered = [...new Set([...withIv, ...withT, ...withTopics])].sort((p, q) => p.idx - q.idx);
  if (!covered.length) return fill(el, viewHead('Timing & topics', 'No attempt has clock or topic data yet. PW-style exports with 30-minute blocks, section times or a topic breakdown show up here.'));
  fill(el,
    viewHead('Timing & topics', `Clock and topic data exists only for ${listText(covered.map(a => a.short))}.${noClock.length ? ` Your timed PYQs (${listText(noClock.map(a => a.short))}) recorded no per-block or per-topic timing, so they don’t appear here.` : ''}`),
    withIv.length ? paceCard(withIv) : null,
    withT.length ? sectionTimeCard(withT) : null,
    withTopics.length ? topicsCard(withTopics) : null,
  );
}

function topicsCard(list) {

/* ────────────── Attempt: one attempt, in depth ──────────────
   Any attempt can be opened here. One taken in NeoBook's Attempt Mock also
   carries everything its raw log could say — passages, timing, behaviour,
   the final two, answer changes, a timeline — each number computed by
   NBCore.mock.deriveAttempt and only displayed here. */
const AV = { sel: null, sort: { key: 'pos', dir: 1 }, filter: { sec: 'all', out: 'all', only: 'all' } };
const AV_PANES = [
  { k: 'summary', label: 'Summary' }, { k: 'sections', label: 'Sections' }, { k: 'passages', label: 'Passages' },

function msTxt(ms) {
  if (ms == null || !isFinite(ms)) return '—';
  const s = Math.round(ms / 1000), h = Math.floor(s / 3600);
  return h ? `${h}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : mmss(s);
}
const OUTC = { correct: { k: 'c', label: 'Right' }, wrong: { k: 'w', label: 'Wrong' }, skipped: { k: 's', label: 'Blank' }, withdrawn: { k: 'x', label: 'Withdrawn' }, unkeyed: { k: 'x', label: 'No key' } };
const FRICTION_TEXT = {

const STATE_PARTS = [

  { k: 'TRANSITION', label: 'Moving', color: 'var(--fill-2)' },
  { k: 'IDLE', label: 'Idle', color: 'var(--bar-cost)' },
  { k: 'BACKGROUND', label: 'Away from the app', color: 'var(--ink-3)' },

const STEP_COLOR = { read: 'var(--ord-1)', question: 'var(--ord-2)', revisit: 'var(--ord-3)', lookup: 'var(--bar-2)', reread: 'color-mix(in oklab,var(--bar-2) 45%,var(--surface))', transition: 'var(--fill-2)', idle: 'var(--bar-cost)', background: 'var(--ink-3)' };

/** Every attempt that can be opened: NeoBook's first (they have the most to say), newest first. */
function avChoices() {
  const nb = [], other = [];
  state.attempts.forEach(a => {
    const d = a.telemetrySessionId ? NB.bundles.get(a.telemetrySessionId) : null;
    (d ? nb : other).push({ id: d ? a.telemetrySessionId : a.id, label: `${a.paper}${a.set ? ` · ${a.set}` : ''} · ${a.when}`, date: a.date || '', at: a.addedAt || 0, a, d });
  });
  state.practice.forEach(p => {
    const d = p.telemetrySessionId ? NB.bundles.get(p.telemetrySessionId) : null;
    if (d) nb.push({ id: p.telemetrySessionId, label: `${p.name} · ${p.date ? fmtDate(p.date) : 'Undated'} · practice`, date: p.date || '', at: p.addedAt || 0, p, d });
  });
  const newest = (x, y) => (y.date > x.date ? 1 : y.date < x.date ? -1 : (y.at || 0) - (x.at || 0));
  nb.sort(newest);
  other.reverse();
  return { nb, other, all: nb.concat(other) };
}
function avSelect(id) {
  AV.sel = id; state.prefs.attemptSel = id; savePrefs();
  avHash();
  invalidate(['attempt']);
}
function avHash() {
  const want = `attempt=${encodeURIComponent(AV.sel || '')}`;
  if (state.prefs.view === 'attempt' && AV.sel && location.hash.slice(1) !== want) history.replaceState(null, '', `#${want}`);
}
/** Open the Attempt view on one attempt (by NeoBook session id or dashboard id). */
function openAttempt(id, pane) {
  AV.sel = id; state.prefs.attemptSel = id;
  if (pane) state.prefs.attemptPane = pane;
  savePrefs();
  dirty.add('attempt');
  show('attempt');
}

/** The Remove button for one attempt, where one belongs. */
function avRemoveButton(cur, style) {
  const cls = `btn ${style === 'plain' ? 'plain ' : ''}danger`;
  if (cur && cur.d) {
    const id = cur.id || (cur.d && cur.d.attemptId);
    const name = cur.a ? cur.a.paper : (cur.p ? cur.p.name : null);
    return H('button', { class: cls, type: 'button', title: 'Removes this attempt and everything recorded with it', onclick: () => nbRemoveAttempt(id, name), text: 'Remove attempt' });
  }
  /* an attempt added by hand or from a workbook: the dashboard's own record */
  const a = cur && cur.a;
  if (a && state.user.attempts.some(u => u.id === a.id)) {
    return H('button', { class: cls, type: 'button', onclick: () => { removeUserItem('attempt', a.id); if (state.prefs.view === 'attempt') { AV.sel = null; invalidate(['attempt']); } }, text: 'Remove attempt' });
  }
  return null;   /* the built-in attempts are part of the file, not your data */
}

function renderAttempt(el) {
  const ch = avChoices();
  if (!ch.all.length) return fill(el, viewHead('Attempt', 'No attempts yet.'));
  const cur = ch.all.find(c => c.id === AV.sel) || ch.all.find(c => c.id === state.prefs.attemptSel) || ch.nb[0] || ch.all[0];
  if (AV.sel !== cur.id) { AV.sel = cur.id; state.prefs.attemptSel = cur.id; savePrefs(); }
  avHash();
  const opt = c => H('option', { value: c.id, selected: c.id === cur.id, text: c.label });
  const picker = H('select', { class: 'avpick', 'aria-label': 'Choose an attempt', onchange: e => avSelect(e.target.value) }, [
    ch.nb.length ? H('optgroup', { label: 'Recorded in NeoBook' }, ch.nb.map(opt)) : null,
    ch.other.length ? H('optgroup', { label: ch.nb.length ? 'Other attempts' : 'Attempts' }, ch.other.map(opt)) : null,
  ]);
  const d = cur.d;
  const title = cur.a ? `${cur.a.paper}${cur.a.set ? ` · ${cur.a.set}` : ''}` : cur.p.name;
  const sub = cur.a ? `${cur.a.cohortName} · ${cur.a.when}${d ? ' · recorded in NeoBook' : ''}` : `${SEC_NAME[cur.p.section] || 'Mixed'} practice · ${cur.p.date ? fmtDate(cur.p.date) : 'Undated'} · recorded in NeoBook`;
  const head = viewHead(title, sub, H('div', { class: 'filter-group avhead' }, [picker, typeof avRemoveButton === 'function' ? avRemoveButton(cur) : null]));
  if (!d) return fill(el, head, avPlain(cur.a));

  }, p.label))));
  const ctx = { d, a: cur.a || null, p: cur.p || null, full: d.target === 'attempt', t: d.test, qs: d.questions, sess: NB.sessions.get(cur.id) || null };

/* ═══════════════════════════ 8. Adding data ═══════════════════════════ */
const V13_SEC = { english: 'en', cagk: 'gk', legal: 'le', logical: 'lr', quants: 'qt' };
const TAG_MEANING_FALLBACK = { 'CG/EG': 'Calculated guess', G: 'Normal guess', 'Circled only': 'Circled only', 'G/circle': 'Educated guess / circled', X: 'Possibly invalid question' };

function normSecKey(s) {
  const t = String(s == null ? '' : s).toLowerCase();
  if (!t) return null;
  if (/legal|\blaw\b/.test(t)) return 'le';
  if (/english|verbal|reading|\brc\b/.test(t)) return 'en';
  if (/current|general knowledge|\bgk\b|cagk|affairs/.test(t)) return 'gk';
  if (/quant|math|numer|\bqt\b|\bqa\b|data interp/.test(t)) return 'qt';
  if (/logic|reason|\blr\b/.test(t)) return 'lr';
  return null;
}
const ymd = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
function isoFrom(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : ymd(v.getFullYear(), v.getMonth() + 1, v.getDate());
  if (typeof v === 'number') {
    if (v > 25000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
    if (v > 1e11) { const d = new Date(v); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
    return null;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return ymd(m[1], m[2], m[3]);
  const mon = t => MONTHS.findIndex(x => x.toLowerCase() === String(t).slice(0, 3).toLowerCase()) + 1;
  m = s.match(/^(\d{1,2})\s+([A-Za-z]{3,})\.?,?\s+(\d{4})/);
  if (m && mon(m[2])) return ymd(m[3], mon(m[2]), m[1]);
  m = s.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/);
  if (m && mon(m[1])) return ymd(m[3], mon(m[1]), m[2]);
  m = s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/);
  if (m) return ymd(m[3].length === 2 ? `20${m[3]}` : m[3], m[2], m[1]);
  return null;
}
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (loadXLSX.p) return loadXLSX.p;
  loadXLSX.p = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = () => (window.XLSX ? resolve(window.XLSX) : reject(new Error('The Excel reader didn’t start. Reload the page and try again.')));
    s.onerror = () => { loadXLSX.p = null; reject(new Error('Couldn’t load the Excel reader. Check your internet connection and try again.')); };
    document.head.appendChild(s);
  });
  return loadXLSX.p;
}
const sheetRows = (X, ws) => X.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: null, raw: true });

/** Answer-key question-log workbooks (one attempt per log sheet). */
function parseQuestionLogWorkbook(wb, X) {
  const lower = v => String(v == null ? '' : v).trim().toLowerCase();
  const dates = {}, orders = {};
  const all = wb.SheetNames.map(sn => ({ sn, rows: sheetRows(X, wb.Sheets[sn]) }));
  all.forEach(({ rows }) => rows.forEach((r, i) => {
    const c = (r || []).map(lower);
    const iOn = c.indexOf('attempted on'), iYear = c.indexOf('exam year');
    if (iOn >= 0 && iYear >= 0) {
      for (let j = i + 1; j < rows.length; j++) { const rr = rows[j] || []; const y = parseInt(rr[iYear], 10); if (!y) break; const d = isoFrom(rr[iOn]); if (d) dates[y] = d; }
    }
    const iOrder = c.indexOf('order'), iAtt = c.indexOf('attempt');
    if (iOrder >= 0 && iAtt >= 0) {
      for (let j = i + 1; j < rows.length; j++) {
        const rr = rows[j] || [], m = String(rr[iAtt] || '').match(/(20\d\d)/);
        if (!m) break;
        const ord = String(rr[iOrder] || '').split(/→|->|>|,/).map(normSecKey).filter(Boolean);
        if (ord.length >= 3) orders[+m[1]] = ord;
      }
    }
  }));
  const found = [];
  all.forEach(({ sn, rows }) => {
    let hi = -1, col = null;
    for (let i = 0; i < Math.min(rows.length, 25); i++) {
      const c = (rows[i] || []).map(lower);
      const q = c.findIndex(x => /^q\.?\s*(no\.?|num(ber)?|#)?$/.test(x) || /^question\s*(no\.?|number)?$/.test(x));
      const s = c.findIndex(x => x === 'section' || x === 'subject');
      const o = c.findIndex(x => x === 'outcome' || x === 'result' || x === 'status');
      const k = c.findIndex(x => /official key|^key$|answer key|correct (answer|option)/.test(x));
      const u = c.findIndex(x => /user answer|your answer|^response$|marked answer|^answer$/.test(x));
      if (q >= 0 && s >= 0 && o >= 0 && (k >= 0 || u >= 0)) {
        hi = i;
        col = { q, s, o, k, u, tag: c.findIndex(x => /guess tag|^annotation$|^tag$/.test(x)), meaning: c.findIndex(x => /annotation meaning|tag meaning/.test(x)) };
        break;
      }
    }
    if (hi < 0) return;
    const letter = v => { const t = String(v == null ? '' : v).trim().toUpperCase(); return /^[A-D]$/.test(t) ? t : ''; };
    const qs = [];
    for (let j = hi + 1; j < rows.length; j++) {
      const r = rows[j] || [], qn = parseInt(r[col.q], 10);
      if (!qn) continue;
      const sec = normSecKey(r[col.s]), o = lower(r[col.o]);
      const out = /withdraw|dropped|deleted|bonus|cancel/.test(o) ? 'x' : /^(correct|right|c)$/.test(o) ? 'c' : /^(wrong|incorrect|w)$/.test(o) ? 'w' : /skip|blank|unattempt|not attempted|^left$|^s$/.test(o) ? 's' : null;
      if (!sec || !out) continue;
      qs.push({ q: qn, sec, out, key: col.k >= 0 ? letter(r[col.k]) : '', ans: col.u >= 0 ? letter(r[col.u]) : '', tag: col.tag >= 0 && r[col.tag] != null ? String(r[col.tag]).trim() : '', meaning: col.meaning >= 0 && r[col.meaning] != null ? String(r[col.meaning]).trim() : '' });
    }
    if (qs.length < 20) return;
    qs.sort((p, q) => p.q - q.q);
    if (qs.some((x, i) => x.q !== i + 1)) return;
    const title = String((rows[0] || [])[0] || sn);
    const ym = `${title} ${sn}`.match(/(20\d\d)/), year = ym ? +ym[1] : null;
    const exam = /ailet/i.test(title) ? 'AILET' : 'CLAT';
    const setM = title.match(/\bset\s*([A-D])\b/i);
    const sec = {};
    SECS.forEach(s => {
      const list = qs.filter(x => x.sec === s.k);
      if (list.length) sec[s.k] = { q: [list[0].q, list[list.length - 1].q], n: list.length, x: list.filter(x => x.out === 'x').length, C: list.filter(x => x.out === 'c').length, W: list.filter(x => x.out === 'w').length, S: list.filter(x => x.out === 's').length };
    });
    const count = o => qs.filter(x => x.out === o).length;
    const tags = {}, tagMeanings = {};
    qs.forEach(x => { if (x.tag) { tags[x.q] = x.tag; if (!tagMeanings[x.tag]) tagMeanings[x.tag] = x.meaning || TAG_MEANING_FALLBACK[x.tag] || ''; } });
    found.push({
      id: `u-${uid()}`, paper: year ? `${exam} ${year}` : title.slice(0, 40), set: setM ? `Set ${setM[1].toUpperCase()}` : undefined,
      cohort: 'pyq_t', date: (year && dates[year]) || null, origin: 'upload', addedAt: Date.now(),
      M: qs.length - count('x'), paperQs: qs.length, C: count('c'), W: count('w'), S: count('s'), secMode: 'counts', sec,
      withdrawn: qs.filter(x => x.out === 'x').map(x => x.q), order: (year && orders[year]) || null, tagMeanings, notes: [],
      log: { key: qs.map(x => (x.out === 'x' ? 'W' : x.key || '-')).join(''), ans: qs.map(x => x.ans || '-').join(''), out: qs.map(x => x.out).join(''), tags },
    });
  });
  return found;
}

function cleanPaperName(name) {
  const s = String(name || '').trim(), m = s.match(/full\s*length\s*mock(?:\s*test)?\D{0,4}(\d{1,3})\b/i);
  return m ? `PW Mock ${m[1]}` : (s || 'Mock');
}
/** v13-shaped attempt (from its parser or its browser storage) → v14 attempt. */
function fromV13Attempt(o, origin) {
  const C = Number(o.correct) || 0, W = Number(o.incorrect) || 0, S = Number(o.skipped) || 0;
  const a = {
    id: `u-${uid()}`, paper: cleanPaperName(o.name), cohort: o.type === 'untimed' ? 'mock_u' : 'mock_t',
    date: isoFrom(o.attemptedOn) || (o.date ? isoFrom(Number(o.date)) : null),
    origin, addedAt: Date.now(), C, W, S,
  };
  a.M = C + W + S || Number(o.questions) || 120;
  a.paperQs = a.M;
  const exact = {};
  (Array.isArray(o.tree) ? o.tree : []).forEach(t => {
    const k = normSecKey(t.main);
    const subO = !t.sub || /^overall$/i.test(t.sub), topO = !t.topic || /^overall$/i.test(t.topic);
    if (k && subO && topO && t.correct != null) exact[k] = { n: (t.correct || 0) + (t.incorrect || 0) + (t.skipped || 0), C: t.correct || 0, W: t.incorrect || 0, S: t.skipped || 0, t: t.timeSec == null ? null : t.timeSec };
  });
  const ex = Object.values(exact);
  if (ex.length === 5 && sum(ex, s => s.C) === C && sum(ex, s => s.W) === W) { a.secMode = 'counts'; a.sec = exact; }
  else if (o.sections) {
    a.secMode = 'acc'; a.secAcc = {};
    Object.entries(V13_SEC).forEach(([k13, k]) => {
      const acc = o.sections[k13], w = o.wrongDist ? o.wrongDist[k13] : null;
      a.secAcc[k] = acc == null || (Number(acc) === 0 && !w) ? null : Number(acc);
    });
  }
  if (Array.isArray(o.intervals) && o.intervals.length) a.intervals = o.intervals.map(iv => [Number(iv.attempted) || 0, Number(iv.correct) || 0, Number(iv.incorrect) || 0, Number(iv.marks) || 0]);
  if (Array.isArray(o.tree)) {
    const leaves = o.tree.filter(t => t.topic && !/^overall$/i.test(t.topic)).map(t => [normSecKey(t.main), t.sub || '', t.topic, t.correct || 0, t.incorrect || 0, t.skipped || 0, t.timeSec == null ? null : t.timeSec]).filter(r => r[0]);
    if (leaves.length) a.tree = leaves;
  } else if (o.topics && typeof o.topics === 'object') {
    const t = {};
    Object.entries(o.topics).forEach(([name, arr]) => { const k = normSecKey(name); if (k && Array.isArray(arr) && arr.length) t[k] = arr.map(x => [x.label, x.acc == null ? null : Number(x.acc)]); });
    if (Object.keys(t).length) a.topics = t;
  }
  if (o.timeSec != null) a.timeSec = o.timeSec;
  return a;
}
function fromV13Practice(p, origin) {
  return {
    id: `p-${uid()}`, name: p.name || 'Practice test', category: p.category || 'sectional', section: V13_SEC[p.section] || normSecKey(p.section) || 'mixed',
    topic: p.topic || '', date: isoFrom(p.attemptedOn) || (p.date ? isoFrom(Number(p.date)) : null), origin, addedAt: Date.now(),
    C: Number(p.correct) || 0, W: Number(p.incorrect) || 0, S: Number(p.skipped) || 0, timeSec: p.timeSec == null ? null : p.timeSec,
  };
}
function parsePwWorkbook(wb, X, fileName) {
  const R = Legacy.P.parseWorkbook(wb, X);
  const base = String(fileName || '').replace(/\.(xlsx|xls|csv)$/i, '');
  let allRows = [];
  wb.SheetNames.forEach(sn => { allRows = allRows.concat(sheetRows(X, wb.Sheets[sn])); });
  const meta = R.meta || {};
  const cls = Legacy.classifyUpload(R.sections, allRows, base);
  const hasMeta = meta.correct != null || meta.score != null || meta.accuracy != null || meta.testName != null;
  if (!R.sections && !cls.fallbackTotals && !hasMeta && !R.tree) return null;
  if (cls.category === 'mock') {
    const o = Legacy.buildAttemptFromParse(R.sections, R.intervals, meta, R.tree, R.sectionTimes || {});
    o.name = meta.testName || base;
    return { kind: 'attempt', a: fromV13Attempt(o, 'upload') };
  }
  const p = Legacy.buildPracticeFromParse(R.sections, cls, allRows);
  if (!p.name || p.name === 'New') p.name = base;
  return { kind: 'practice', a: fromV13Practice(p, 'upload') };
}

/** One-time: bring over anything the v13 dashboard saved in this browser. */
function importLegacy() {
  const result = { attempts: [], practice: 0, total: 0 };
  if (state.user.legacyChecked) return result;
  state.user.legacyChecked = true;
  const legacy = store.get(KEYS.legacy, null);
  if (legacy && typeof legacy === 'object') {
    (Array.isArray(legacy.attempts) ? legacy.attempts : []).forEach(o => {
      if (!o || V13_SEED_NAMES.has(o.name)) return;
      try {
        const a = fromV13Attempt(o, 'v13-browser');
        if (!(a.C + a.W + a.S) || findDuplicate(a) || state.user.attempts.some(u => signature(u) === signature(a))) return;
        state.user.attempts.push(a);
        result.attempts.push(a.paper);
      } catch (e) { console.warn('Skipped a v13 attempt', e); }
    });
    (Array.isArray(legacy.practice) ? legacy.practice : []).forEach(o => {
      try {
        const p = fromV13Practice(o, 'v13-browser');
        if (state.user.practice.some(x => x.name === p.name && x.C === p.C && x.W === p.W)) return;
        state.user.practice.push(p);
        result.practice++;
      } catch (e) { console.warn('Skipped a v13 practice test', e); }
    });
  }
  result.total = result.attempts.length + result.practice;
  if (result.total) state.user.legacyNote = { attempts: result.attempts, practice: result.practice, dismissed: false };
  saveUser();
  if (result.total) buildModel();
  return result;
}

function commitUser() { saveUser(); buildModel(); refreshChrome(); invalidate(); }

async function downloadBackup() {

async function restoreBackup(file) {
  try {
    const data = JSON.parse(await file.text());

    let added = 0;
    data.attempts.forEach(a => {

      if (state.user.attempts.some(u => u.id === a.id) || findDuplicate(a)) return;

}

async function handleFile(file) {

  sheetState.busy = true; sheetState.error = null; sheetState.pending = [];
  renderSheet();
  try {
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), { type: 'array' });
    const logs = parseQuestionLogWorkbook(wb, X);
    let pending;
    if (logs.length) pending = logs.map(a => ({ kind: 'attempt', a }));
    else {
      const r = parsePwWorkbook(wb, X, file.name);
      if (!r) throw new Error('No scores, sections or question log were found in that file. Try “Enter by hand” instead.');
      pending = [r];
    }
    pending.forEach(p => {
      if (p.kind === 'attempt') { const d = findDuplicate(p.a); p.dup = d ? `${d.paper} · ${d.when}` : null; if (!p.a.date) p.a.date = todayISO(); }
      p.include = !p.dup;
    });
    sheetState.pending = pending;
  } catch (e) {
    console.error(e);
    sheetState.error = e.message || String(e);
  }
  sheetState.busy = false;
  renderSheet();
}
function confirmSheet() {
  if (sheetState.mode === 'manual') return confirmManual();
  const chosen = sheetState.pending.filter(p => p.include);
  if (!chosen.length) return;
  chosen.forEach(p => { if (p.kind === 'practice') state.user.practice.push(p.a); else state.user.attempts.push(p.a); });
  commitUser();
  closeSheet();
  toast(chosen.length === 1 ? `Added ${chosen[0].a.paper || chosen[0].a.name}` : `Added ${chosen.length} attempts`);
}

    const r = d.rows[s.k], n = parseInt(r.n, 10) || 0, c = parseInt(r.C, 10) || 0, w = parseInt(r.W, 10) || 0;
    if (n < 0 || c < 0 || w < 0) return { error: `${s.name}: numbers can’t be negative.` };
    if (c + w > n) return { error: `${s.name}: right + wrong is more than the number of questions.` };
    sec[s.k] = { n, C: c, W: w, S: n - c - w };

  if (!M) return { error: 'Enter the number of questions for at least one section.' };

  secTrend(M) {

  secProfile(M) {

  secTime(M, list) {

  },

/* ── The Wiz card on Overview: where you stand, your path to exam day, this week's targets ── */
function renderPlan(host, M) {
  host.replaceChildren();
  const W = Math.max(300, host.clientWidth), Hh = W < 560 ? 250 : 290;
  const narrow = W < 560, padL = 34, padR = narrow ? 96 : 150, padT = 16, padB = 26;
  const t0 = Math.min(M.timed.length ? isoUTC(M.timed[0].date) : M.now, M.now) - 5 * DAY, t1 = M.exam + 6 * DAY;
  const X = t => padL + ((t - t0) / (t1 - t0)) * (W - padL - padR);
  const lo = 40, hi = 120, Y = v => padT + (1 - (clamp(v, lo, hi) - lo) / (hi - lo)) * (Hh - padT - padB);
  const svg = svgRoot(W, Hh, 'Your timed scores, your weekly targets to exam day, and the NALSAR benchmarks for your category');
  [40, 60, 80, 100, 120].forEach(v => {
    svg.append(S('line', { x1: padL, x2: W - padR, y1: Y(v), y2: Y(v), stroke: v === lo ? 'var(--axis)' : 'var(--grid)' }));
    svg.append(txt(padL - 6, Y(v) + 3.5, String(v), { 'text-anchor': 'end', 'font-size': 10.5 }));
  });
  // month ticks
  const d0 = new Date(t0);
  for (let y = d0.getUTCFullYear(), mo = d0.getUTCMonth() + 1; ; mo++) {
    const t = Date.UTC(y, mo, 1);
    if (t > t1) break;

  }

    const [a, z] = s.marks;
    svg.append(S('rect', { x: padL, width: W - padL - padR, y: Y(z), height: Y(a) - Y(z), fill: i ? 'var(--bench-2)' : 'var(--bench-1)', opacity: 0.16 }));

    labs.push({ x: W - padR + 8, y: Y((a + z) / 2) + 4, text: `${narrow ? s.short.split(' ')[0] : s.short} ${a}–${z}`, color: i ? 'var(--bench-2)' : 'var(--bench-1)' });
  });

    svg.append(S('line', { x1: X(t), x2: X(t), y1: padT, y2: Hh - padB, stroke: 'var(--ink-3)', 'stroke-dasharray': t === M.exam ? '0' : '2 3', opacity: 0.6 }));
    svg.append(txt(X(t) + dx, Hh - padB - 6, l, { class: 'halo', 'text-anchor': anchor, fill: 'var(--ink-2)', 'font-size': 10.5 }));
  });

  if (M.weeks.length && M.level != null) {
    const pts = [[M.now, M.level]].concat(M.weeks.map(w => [Math.max(w.mid, M.now + DAY), w.target]));
    svg.append(S('path', { d: pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(''), fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-dasharray': '6 4', 'stroke-linecap': 'round' }));
    M.weeks.forEach(w => svg.append(S('circle', { cx: X(Math.max(w.mid, M.now + DAY)), cy: Y(w.target), r: w.i === 0 ? 4.5 : 3, fill: w.i === 0 ? 'var(--accent)' : 'var(--surface)', stroke: 'var(--accent)', 'stroke-width': 1.5 })));
    const last = M.weeks[M.weeks.length - 1];
    labs.push({ x: W - padR + 8, y: Y(last.target) + 4, text: `Plan ${marks(last.target)}`, color: 'var(--accent)' });
  }
  // your timed attempts, joined within each kind
  ['mock_t', 'pyq_t'].forEach(k => {
    const xs = M.timed.filter(a => a.cohort === k);
    if (xs.length > 1) svg.append(S('path', { d: xs.map((a, i) => `${i ? 'L' : 'M'}${X(isoUTC(a.date)).toFixed(1)} ${Y(a.m.pct * PAPER_MAX).toFixed(1)}`).join(''), fill: 'none', stroke: `var(${COHORTS[k].color})`, 'stroke-width': 1.6, opacity: 0.8 }));

    ]) })));
  const ring = S('circle', { r: 8, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1.5, opacity: 0, 'pointer-events': 'none' });
  const overlay = S('rect', { x: padL, y: padT, width: W - padL - padR, height: Hh - padT - padB, fill: 'transparent' });
  svg.append(ring, overlay);
  const onMove = e => {
    const [mx, my] = localXY(svg, W, e);
    let best = null, bd = 30;

}

    ...M.levers.map(l => H('div', { class: 'lv' }, [
      H('span', { class: 'lv-n', text: l.s.name }),
      barCell(l.gain / maxGain, `+${l.gain.toFixed(1)}`, { small: `${pct(l.acc, 0)} → ${pct(M.accLever, 0)}`, title: `${l.s.name}: ${pct(l.acc, 0)} accuracy on about ${Math.round(l.att)} attempted per paper; at ${pct(M.accLever, 0)} that is +${l.gain.toFixed(1)} marks` }),
    ])),
  ]);
  const weeksTable = () => H('div', { class: 'table-wrap' }, H('table', { class: 'tbl' }, [
    H('thead', {}, H('tr', {}, [['Week', 'l'], ['Dates', 'l'], ['Full-mock score', ''], ['Accuracy', ''], ['Wrong ≤', ''], ['Focus', 'l']].map(([t, c]) => H('th', { class: c, text: t })))),
    H('tbody', {}, M.weeks.map(wk => H('tr', { class: wk.i === 0 ? 'now' : '' }, [
      H('td', { class: 'l', text: wk.exam ? 'Exam week' : `Week ${wk.i + 1}${wk.i === 0 ? ' · now' : ''}` }), H('td', { class: 'l', text: weekRange(wk.start, wk.end) }),
      H('td', {}, barCell(wk.target / PAPER_MAX, marks(wk.target), { compact: true })), H('td', {}, pct(wk.acc, 0)), H('td', {}, String(wk.wrong)),
      H('td', { class: 'l', text: wk.exam ? 'Light mocks, sleep, revision lists' : wk.focus ? `${wk.focus.s.name} (${pct(wk.focus.acc, 0)} → ${pct(M.accLever, 0)})` : 'Full mocks' }),
    ]))),
  ]));
  return card('Benchmark Wiz', `For you: ${WIZ_PROFILE.text}. CLAT 2027 is on ${examTxt} — ${plural(Math.max(0, M.daysLeft), 'day')}, ${plural(M.nW, 'week')} including this one.`, [
    H('div', { class: 'wiz-top' }, [stand, weekBox]),
    H('div', { class: 'legend', style: { margin: '18px 0 8px' } }, [
      H('span', { class: 'k' }, [glyph('pyq_t'), 'Timed PYQ']), H('span', { class: 'k' }, [glyph('mock_t'), 'Timed mock']),
      H('span', { class: 'k' }, [H('i', { class: 'lk', style: { color: 'var(--accent)', borderTopStyle: 'dashed' } }), 'Weekly targets']),
      H('span', { class: 'k' }, [H('i', { class: 'sw', style: { background: 'var(--bench-1)', opacity: 0.5 } }), tl.name]),
      H('span', { class: 'k' }, [H('i', { class: 'sw', style: { background: 'var(--bench-2)', opacity: 0.5 } }), ai.name]),
    ]),
    host,
    levers,
    numbersToggle('Show the week-by-week plan', weeksTable),
    H('details', { class: 'more' }, [H('summary', { text: 'How the Wiz gets these numbers' }), H('ul', { class: 'notes', style: { marginTop: '10px' } }, BENCH.method.map(t => H('li', { text: t })))]),
  ], { cls: 'wiz' });
}
/** Quick picks for the target editor, from the benchmarks that apply to you. */
function wizTargetPresets() {
  return BENCH.seats.map(s => ({ label: `${s.name} · ${s.marks[0]}–${s.marks[1]}`, mode: 'range', lo: s.marks[0], hi: s.marks[1], why: `${s.name} (${s.why}) closed at AIR ${s.ranks.map(r => INR.format(r[1])).join(', ')} in ${s.ranks.map(r => r[0]).join(', ')}` }));
}

/* ═══════════════════════════ 9. Shell ═══════════════════════════ */
const VIEWS = ['overview', 'attempt', 'trends', 'sections', 'questions', 'timing', 'practice', 'data'];
const RENDER = { overview: renderOverview, trends: renderTrends, sections: renderSections, questions: renderQuestions, timing: renderTiming, attempt: renderAttempt, practice: renderPractice, data: renderData };
const dirty = new Set(VIEWS);

function safeRender(view, el) {
  try { RENDER[view](el); }
  catch (e) {
    console.error(e);
    fill(el, viewHead('This view hit an error', 'The rest of the dashboard still works. The details below help pin it down.'), card('Error', e && e.message ? e.message : String(e), []));
  }
}
function show(view, { animate = true } = {}) {
  /* "#attempt=<id>" opens one attempt: NeoBook links straight to it */
  const deep = /^attempt=(.+)$/.exec(String(view || ''));
  if (deep) { AV.sel = decodeURIComponent(deep[1]); state.prefs.attemptSel = AV.sel; dirty.add('attempt'); view = 'attempt'; }
  if (!VIEWS.includes(view) || (view === 'practice' && !state.practice.length)) view = 'overview';
  const changed = state.prefs.view !== view;
  state.prefs.view = view;
  savePrefs();
  VIEWS.forEach(v => {
    const on = v === view, tab = $(`#tab-${v}`);
    $(`#v-${v}`).hidden = !on;
    tab.setAttribute('aria-selected', String(on));
    tab.tabIndex = on ? 0 : -1;
  });
  const el = $(`#v-${view}`);
  if (dirty.has(view)) { dirty.delete(view); safeRender(view, el); }
  if (animate && changed) { el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }
  moveThumb($('#tabs'), animate);
  if (animate && changed) $(`#tab-${view}`).scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  const hash = view === 'attempt' && AV.sel ? `attempt=${encodeURIComponent(AV.sel)}` : view;
  if (location.hash.slice(1) !== hash) history.replaceState(null, '', `#${hash}`);
  tip.hide();
}
function invalidate(views = VIEWS) {
  views.forEach(v => dirty.add(v));
  const cur = state.prefs.view;
  if (views.includes(cur) && !$(`#v-${cur}`).hidden) { dirty.delete(cur); safeRender(cur, $(`#v-${cur}`)); }
}
function refreshChrome() {
  $('#tab-practice').hidden = !state.practice.length;
  const A = state.attempts, L = A[A.length - 1];
  $('#brandSub').textContent = L ? `${plural(A.length, 'attempt')} · latest ${L.when}` : 'Performance dashboard';
  $('#guideSwitch').title = `Draw your target (${TGT.text()}, ${TGT.value('pct')}) on every chart that has one`;
  const added = state.user.attempts.length + state.user.practice.length;
  const fromNB = NB.attempts.length + NB.practice.length;
  $('#foot').textContent = `Dashboard v14 · data built ${fmtDate(SEED.built)} · ${plural(SEED.attempts.length, 'built-in attempt')}${added ? ` + ${added} added in this browser` : ''}${fromNB ? ` + ${plural(fromNB, 'attempt')} recorded in NeoBook` : ''} · figures recompute from the raw counts on every load`;
  if (state.prefs.view === 'practice' && !state.practice.length) show('overview', { animate: false });
  requestAnimationFrame(() => moveThumb($('#tabs'), false));
}
function themeIcon(t) {
  const svg = S('svg', { viewBox: '0 0 16 16', 'aria-hidden': 'true' });
  if (t === 'light') {
    svg.append(S('circle', { cx: 8, cy: 8, r: 3, fill: 'currentColor' }));
    for (let i = 0; i < 8; i++) {
      const ang = (i * Math.PI) / 4;
      svg.append(S('line', { x1: 8 + Math.cos(ang) * 5, y1: 8 + Math.sin(ang) * 5, x2: 8 + Math.cos(ang) * 6.7, y2: 8 + Math.sin(ang) * 6.7, stroke: 'currentColor', 'stroke-width': 1.4, 'stroke-linecap': 'round' }));
    }
  } else if (t === 'dark') {
    svg.append(S('path', { d: 'M10.6 2.1a5.9 5.9 0 1 0 3.4 8.4 4.7 4.7 0 0 1-3.4-8.4z', fill: 'currentColor' }));
  } else {
    svg.append(S('circle', { cx: 8, cy: 8, r: 5.9, fill: 'none', stroke: 'currentColor', 'stroke-width': 1.4 }));
    svg.append(S('path', { d: 'M8 2.1a5.9 5.9 0 0 1 0 11.8z', fill: 'currentColor' }));
  }
  return svg;
}
function applyTheme() {
  const t = ['light', 'dark'].includes(state.prefs.theme) ? state.prefs.theme : 'system';
  const root = document.documentElement;
  if (t === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  const label = { system: 'Theme follows your system', light: 'Light theme', dark: 'Dark theme' }[t];
  const btn = $('#themeBtn');
  btn.setAttribute('aria-label', `${label}. Change theme`);
  btn.title = `${label} (click to change)`;
  btn.replaceChildren(themeIcon(t));
}

function boot() {
  tip.el = $('#tip');
  applyTheme();
  buildModel();
  const imported = importLegacy();
  refreshChrome();

  const guide = $('#guideToggle');
  guide.checked = !!state.prefs.guide;
  guide.addEventListener('change', () => {
    state.prefs.guide = guide.checked;
    savePrefs();
    invalidate();
    toast(guide.checked ? `Guiding light on · your target (${TGT.text()}) is drawn on every chart` : 'Guiding light off');
  });
  const wiz = $('#wizToggle');
  wiz.checked = !!state.prefs.wiz;
  wiz.addEventListener('change', () => {
    state.prefs.wiz = wiz.checked;
    savePrefs();
    invalidate();
    toast(wiz.checked ? 'Benchmark Wiz on · coaching sits beside each chart' : 'Benchmark Wiz off');
  });
  $('#themeBtn').addEventListener('click', () => {
    const order = ['system', 'light', 'dark'];
    state.prefs.theme = order[(order.indexOf(state.prefs.theme) + 1) % order.length];
    savePrefs();
    applyTheme();
    requestAnimationFrame(() => moveThumb($('#tabs'), false));
  });
  $('#addBtn').addEventListener('click', () => openSheet());
  $('#targetEdit').addEventListener('click', openTargetSheet);
  $('#targetCancel').addEventListener('click', closeTargetSheet);
  $('#targetSave').addEventListener('click', saveTarget);
  $('#targetReset').addEventListener('click', () => { Object.assign(targetDraft, { mode: 'single', lo: DEFAULT_TARGET.hi, hi: DEFAULT_TARGET.hi }); renderTargetSheet(); moveThumb($('#targetMode')); });
  $$('#targetMode button').forEach(bn => bn.addEventListener('click', () => {
    const d = targetDraft;
    if (bn.dataset.mode === d.mode) return;
    d.mode = bn.dataset.mode;
    if (d.mode === 'range' && !(d.lo < d.hi)) { d.hi = Math.min(PAPER_MAX, Number(d.hi) || 114); d.lo = Math.max(1, d.hi - 10); }
    renderTargetSheet(); moveThumb($('#targetMode'));
  }));
  $('#targetSheet').addEventListener('cancel', e => { e.preventDefault(); closeTargetSheet(); });
  $('#targetSheet').addEventListener('click', e => { if (e.target === e.currentTarget) closeTargetSheet(); });
  $('#targetSheet').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); saveTarget(); } });

  $$('#tabs [role="tab"]').forEach(t => t.addEventListener('click', () => show(t.dataset.view)));
  $('#tabs').addEventListener('keydown', e => {
    const tabs = $$('#tabs [role="tab"]').filter(t => !t.hidden);
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    const j = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key];
    if (j == null) return;
    e.preventDefault();
    tabs[j].focus();
    show(tabs[j].dataset.view);
  });
  addEventListener('hashchange', () => show(location.hash.slice(1)));

  const bar = $('#appbar');
  const onScroll = () => bar.classList.toggle('scrolled', scrollY > 2);
  addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  addEventListener('resize', () => { moveThumb($('#tabs'), false); moveThumb($('#sheetMode'), false); moveThumb($('#targetMode'), false); });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('.chart, .qmap')) tip.hide(); }, true);

  $('#sheetCancel').addEventListener('click', closeSheet);
  $('#sheetConfirm').addEventListener('click', confirmSheet);
  $$('#sheetMode button').forEach(bn => bn.addEventListener('click', () => { sheetState.mode = bn.dataset.mode; renderSheet(); }));
  $('#sheet').addEventListener('cancel', e => { e.preventDefault(); closeSheet(); });
  $('#sheet').addEventListener('click', e => { if (e.target === e.currentTarget) closeSheet(); });
  addEventListener('dragover', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault(); });
  addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    if (!$('#sheet').open) openSheet();
    handleFile(f);
  });

  const initial = location.hash.slice(1);
  show(VIEWS.includes(initial) || /^attempt=./.test(initial) ? initial : state.prefs.view, { animate: false });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveThumb($('#tabs'), false));
  if (imported.total) toast(`Brought over ${plural(imported.total, 'item')} from your v13 dashboard`);
}
window.NBDash = { NB, loadNeoBook, refreshNeoBook, openAttempt, show, state, AV, buildModel, invalidate, nbPull, PULL, nbDevice, nbRemoveAttempt };
const nbFirst = loadNeoBook();
Promise.race([nbFirst, new Promise(r => setTimeout(r, 1200))]).then(() => { NB.booted = true; boot(); });
nbFirst.then(() => { if (NB.booted && !NB.applied) { buildModel(); refreshChrome(); invalidate(); } })
  .then(() => nbPull(false));
/* a mock finished in NeoBook in another tab shows up when this one is looked at again */
addEventListener('visibilitychange', () => { if (!document.hidden && NB.booted) refreshNeoBook().then(() => { if (Date.now() - PULL.at > 60000) nbPull(false); }); });

})();
</script>
